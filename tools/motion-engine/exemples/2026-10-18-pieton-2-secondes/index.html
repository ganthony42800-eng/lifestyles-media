import * as THREE from 'three';

/* ============================== utilitaires déterministes ============================== */
const W=1080,H=1920,RW=720,RH=1280;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-clamp(x),3);
const ein=x=>Math.pow(clamp(x),3);
const pulse=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const C=c=>new THREE.Color(c);

/* ============================== rendu ============================== */
const r=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
r.setPixelRatio(1); r.setSize(RW,RH,false); r.domElement.id='gl'; document.body.prepend(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.15;
const scene=new THREE.Scene();
const FOG=new THREE.FogExp2('#0A1028',0.0085); scene.fog=FOG;
const cam=new THREE.PerspectiveCamera(48,RW/RH,0.05,900);

/* environnement réfléchissant (nuit urbaine : ciel bleu nuit, sources sodium, liseré cyan) */
{const pm=new THREE.PMREMGenerator(r);const e=new THREE.Scene();e.background=C('#03050c');
 const panel=(w,h,col,k,pos)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:C(col).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(0,0,0);e.add(m);};
 panel(40,8,'#1A1F4A',0.9,[0,9,-14]); panel(1.2,1.2,'#FF9E45',9,[6,6,-8]); panel(1.2,1.2,'#FF9E45',9,[-6,6,-16]); panel(1.2,1.2,'#FF9E45',6,[6,6,8]);
 panel(0.4,10,'#5EF2E0',1.2,[-9,3,4]); panel(30,30,'#020308',1,[0,-8,0]);
 scene.environment=pm.fromScene(e,0.03).texture; scene.environmentIntensity=0.55;}

const NOISE=`
float hash2(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise2(vec2 x){vec2 i=floor(x);vec2 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(hash2(i),hash2(i+vec2(1,0)),f.x),mix(hash2(i+vec2(0,1)),hash2(i+vec2(1,1)),f.x),f.y);}
float fbm2(vec2 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vnoise2(p);p*=2.03;a*=0.5;}return s;}
`;

/* ---------- ciel (dôme) : nuit / crépuscule ---------- */
const skyU={uDusk:{value:0},uDark:{value:0}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(600,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
 vertexShader:`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
 fragmentShader:`varying vec3 vD;uniform float uDusk,uDark;
 void main(){float h=clamp(vD.y,0.0,1.0);
  vec3 night=mix(vec3(0.075,0.085,0.20),vec3(0.028,0.045,0.12),smoothstep(0.0,0.25,h));night=mix(night,vec3(0.012,0.016,0.045),smoothstep(0.2,0.7,h));
  vec3 dusk=mix(vec3(0.94,0.54,0.36),vec3(0.59,0.51,1.0),smoothstep(0.0,0.10,h));dusk=mix(dusk,vec3(0.10,0.12,0.29),smoothstep(0.10,0.45,h));
  vec3 c=mix(night,dusk*0.85,uDusk);c*=1.0-uDark;gl_FragColor=vec4(c,1.0);}`}));
sky.renderOrder=-10; scene.add(sky);

/* ---------- chaussée (ne s'inscrit pas dans le Z : les reflets « sous » la route restent visibles) ---------- */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  t.userData.redraw=()=>{const g=c.getContext('2d');g.clearRect(0,0,w,h);draw(g,w,h);t.needsUpdate=true;};t.userData.redraw();return t;}
const R0=mulberry32(1810);
const asphN=canvasTex(512,512,(g,w,h)=>{const R=mulberry32(5);g.fillStyle='rgb(128,128,255)';g.fillRect(0,0,w,h);
  for(let i=0;i<26000;i++){const x=R()*w,y=R()*h,a=R()*6.28,s=0.5+R()*1.6;g.fillStyle=`rgb(${128+Math.cos(a)*90|0},${128+Math.sin(a)*90|0},230)`;g.fillRect(x,y,s,s);}});
asphN.colorSpace=THREE.NoColorSpace; asphN.wrapS=asphN.wrapT=THREE.RepeatWrapping; asphN.repeat.set(4,160);
const roadMat=new THREE.MeshPhysicalMaterial({color:'#15171d',roughness:0.22,metalness:0,normalMap:asphN,normalScale:new THREE.Vector2(0.35,0.35),
  clearcoat:1,clearcoatRoughness:0.08,envMapIntensity:1.0,depthWrite:false});
const road=new THREE.Mesh(new THREE.PlaneGeometry(7,800,1,1),roadMat); road.rotation.x=-Math.PI/2; road.position.set(0,0,-300); road.renderOrder=-5; scene.add(road);
const walkMat=new THREE.MeshStandardMaterial({color:'#14161f',roughness:0.75,envMapIntensity:0.5});
for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.15,800),walkMat);w.position.set(s*4.8,0.075,-300);scene.add(w);
  const curb=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,800),new THREE.MeshStandardMaterial({color:'#2a2d38',roughness:0.6}));curb.position.set(s*3.55,0.08,-300);scene.add(curb);}
// marquages : médiane pointillée + rives
const markMat=new THREE.MeshStandardMaterial({color:'#C9CCD6',roughness:0.4,emissive:'#C9CCD6',emissiveIntensity:0.06,polygonOffset:true,polygonOffsetFactor:-2});
{const dash=new THREE.PlaneGeometry(0.12,3);dash.rotateX(-Math.PI/2);const im=new THREE.InstancedMesh(dash,markMat,140);const m4=new THREE.Matrix4();
 for(let i=0;i<140;i++){m4.makeTranslation(0,0.004,60-i*6.5);im.setMatrixAt(i,m4);}scene.add(im);
 for(const s of [-1,1]){const e=new THREE.Mesh(new THREE.PlaneGeometry(0.12,800),markMat);e.rotation.x=-Math.PI/2;e.position.set(s*3.3,0.004,-300);scene.add(e);}}

/* ---------- façades (fenêtres procédurales, 5 % allumées) ---------- */
const facMat=new THREE.MeshStandardMaterial({color:'#0B0E1A',roughness:0.9,envMapIntensity:0.3});
const facU={uLit:{value:1}};
facMat.onBeforeCompile=s=>{s.uniforms.uLit=facU.uLit;
 s.vertexShader=s.vertexShader.replace('void main() {','varying vec3 vWP;\nvoid main() {').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
 s.fragmentShader=s.fragmentShader.replace('void main() {',NOISE+'varying vec3 vWP;uniform float uLit;\nvoid main() {')
 .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
  {vec2 q=vec2(vWP.z+vWP.x*0.37,vWP.y)/vec2(2.6,3.1);vec2 c=floor(q);vec2 f=fract(q);
   float win=step(0.22,f.x)*step(f.x,0.78)*step(0.3,f.y)*step(f.y,0.8)*step(2.0,vWP.y);
   float on=step(0.94,hash2(c+vec2(17.0,3.0)));vec3 wc=mix(vec3(1.0,0.72,0.42),vec3(0.75,0.85,1.0),step(0.8,hash2(c*1.7)));
   totalEmissiveRadiance+=wc*win*on*0.55*uLit*(0.6+0.4*hash2(c*3.1));}`);};
{const R=mulberry32(77);for(const s of [-1,1]){let z=60;while(z>-330){const d=6+R()*10,h=6+R()*9;const b=new THREE.Mesh(new THREE.BoxGeometry(8,h,d),facMat);
   b.position.set(s*(10.2+R()*0.8),h/2,z-d/2);scene.add(b);z-=d+0.4+R()*1.5;}}}

/* ---------- lampadaires sodium + halos + stries de reflet ---------- */
const LAMPS=[];
const poleMat=new THREE.MeshStandardMaterial({color:'#1C1F2A',metalness:0.6,roughness:0.45});
const addMat=(o)=>new THREE.MeshBasicMaterial(Object.assign({transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,fog:false},o));
const haloTex=canvasTex(128,128,(g,w,h)=>{const rg=g.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(0.35,'rgba(255,255,255,.45)');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,w,h);});
const streakMat=new THREE.ShaderMaterial({uniforms:{uCol:{value:C('#FF9E45')},uA:{value:0.5},uWet:{value:1}},transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,
 vertexShader:`varying vec2 vUv;varying vec3 vWP;void main(){vUv=uv;vWP=(modelMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(vWP,1.0);}`,
 fragmentShader:NOISE+`varying vec2 vUv;varying vec3 vWP;uniform vec3 uCol;uniform float uA,uWet;
 void main(){float x=abs(vUv.x-0.5)*2.0;float a=exp(-x*x*5.0)*pow(1.0-vUv.y,0.7)*smoothstep(0.0,0.08,vUv.y);
  float n=0.45+0.9*fbm2(vec2(vWP.x*3.0,vWP.z*1.3));gl_FragColor=vec4(uCol*a*n*uA*uWet,1.0);}`});
function lamp(x,z){const s=Math.sign(x);const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,7,10),poleMat);pole.position.y=3.5;g.add(pole);
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.6,8),poleMat);arm.rotation.z=Math.PI/2;arm.position.set(-s*0.75,6.95,0);g.add(arm);
  const head=new THREE.Mesh(new RoundedBoxGeometry(0.7,0.14,0.28,2,0.05),poleMat);head.position.set(-s*1.5,6.9,0);g.add(head);
  const bulbM=new THREE.MeshBasicMaterial({color:C('#FF9E45').multiplyScalar(4),toneMapped:false});
  const bulb=new THREE.Mesh(new THREE.PlaneGeometry(0.55,0.2),bulbM);bulb.rotation.x=Math.PI/2;bulb.position.set(-s*1.5,6.82,0);g.add(bulb);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:haloTex,color:'#FF9E45',blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,toneMapped:false,fog:false}));
  glow.position.set(-s*1.5,6.75,0);glow.scale.set(1.7,1.7,1);g.add(glow);
  const halo=new THREE.Mesh(new THREE.CircleGeometry(4.2,32),addMat({map:haloTex,color:C('#FF9E45').multiplyScalar(0.32)}));halo.rotation.x=-Math.PI/2;halo.position.set(-s*1.5,0.17,0);g.add(halo);
  const st=new THREE.Mesh(new THREE.PlaneGeometry(0.9,16),streakMat.clone());st.geometry.translate(0,-8,0);st.geometry.rotateX(-Math.PI/2);scene.add(st);
  const L={g,bulbM,glow,halo,st,x:x-s*1.5,z,on:1};LAMPS.push(L);return L;}
for(const z of [95,45,-5,-55,-105,-155,-205,-255])lamp(5.2,z);
for(const z of [68,18,-32,-82,-132,-182,-232])lamp(-5.2,z);
const clampPole=LAMPS.find(l=>l.z===-32);

/* ---------- voiture (carrosserie vernie, feux) ---------- */
const car=new THREE.Group();scene.add(car);
const paint=new THREE.MeshPhysicalMaterial({color:'#0C0E16',metalness:0.6,roughness:0.32,clearcoat:1,clearcoatRoughness:0.06,envMapIntensity:1.4});
const body=new THREE.Group();car.add(body);
{const lo=new THREE.Mesh(new RoundedBoxGeometry(1.8,0.62,4.4,3,0.18),paint);lo.position.set(1.75,0.5,2.2);body.add(lo);
 const cab=new THREE.Mesh(new RoundedBoxGeometry(1.56,0.56,2.2,3,0.2),new THREE.MeshPhysicalMaterial({color:'#05060a',metalness:0.2,roughness:0.08,clearcoat:1,envMapIntensity:1.6}));cab.position.set(1.75,1.02,2.6);body.add(cab);
 for(const [x,z] of [[0.95,0.9],[2.55,0.9],[0.95,3.5],[2.55,3.5]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(0.33,0.33,0.24,18),new THREE.MeshStandardMaterial({color:'#050505',roughness:0.8}));w.rotation.z=Math.PI/2;w.position.set(x,0.33,z);body.add(w);}
 const tl=new THREE.MeshBasicMaterial({color:C('#FF3B3B').multiplyScalar(3),toneMapped:false});
 for(const x of [1.05,2.45]){const m=new THREE.Mesh(new THREE.PlaneGeometry(0.38,0.09),tl);m.position.set(x,0.68,4.41);body.add(m);
   const st=new THREE.Mesh(new THREE.PlaneGeometry(0.3,3.2),addMat({map:haloTex,color:C('#FF3B3B').multiplyScalar(0.35)}));st.rotation.x=-Math.PI/2;st.position.set(x,0.012,6.0);body.add(st);}
 const hl=new THREE.MeshBasicMaterial({color:C('#FFE2B0').multiplyScalar(3),toneMapped:false});
 for(const x of [1.05,2.45]){const m=new THREE.Mesh(new THREE.PlaneGeometry(0.36,0.1),hl);m.rotation.y=Math.PI;m.position.set(x,0.66,-0.01);body.add(m);}}
const hood=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.7,1,6),paint);
{const p=hood.geometry.attributes.position;for(let i=0;i<p.count;i++){const yy=p.getY(i);p.setZ(i,-0.12*Math.pow((yy+0.85)/1.7,2));}hood.geometry.computeVertexNormals();}
hood.rotation.x=-Math.PI/2+0.06;hood.position.set(1.6,0.6,0.85);car.add(hood);
/* phares : 2 vrais SpotLight + cônes volumétriques */
const HL=[];
const coneMat=new THREE.ShaderMaterial({uniforms:{uI:{value:1},uT:{value:0},uRain:{value:1}},transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,
 vertexShader:`varying float vK;varying vec3 vN,vV,vWP;void main(){vK=clamp(position.z/44.0,0.0,1.0);vec4 wp=modelMatrix*vec4(position,1.0);vWP=wp.xyz;vN=normalize(mat3(modelMatrix)*normal);vV=normalize(cameraPosition-wp.xyz);gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:NOISE+`varying float vK;varying vec3 vN,vV,vWP;uniform float uI,uT,uRain;
 void main(){float f=pow(abs(dot(vN,vV)),1.4);float a=pow(1.0-vK,1.8)*smoothstep(0.0,0.06,vK)*f;
  float n=mix(1.0,0.55+0.9*vnoise2(vec2(vWP.x*6.0+vWP.z*0.5,vWP.y*1.5+uT*14.0)),uRain);
  if(vWP.y<0.0)discard;gl_FragColor=vec4(vec3(1.0,0.886,0.69)*a*0.075*uI*n,1.0);}`});
for(const x of [1.05,2.45]){const sp=new THREE.SpotLight('#FFF1DC',150,75,0.36,0.55,1.0);sp.position.set(x,0.66,0);sp.target.position.set(x+(x-1.75)*0.3+0.4,0.3,-30);car.add(sp,sp.target);
  const cg=new THREE.ConeGeometry(5.0,44,28,1,true);cg.translate(0,-22,0);cg.rotateX(-Math.PI/2);
  const cone=new THREE.Mesh(cg,coneMat);cone.position.copy(sp.position);cone.scale.set(1,0.5,1);car.add(cone);cone.lookAt(new THREE.Vector3(x+(x-1.75)*0.3,0.2,-30).add(V3(0,0,0)));
  HL.push({sp,cone});}
const hemi=new THREE.HemisphereLight('#1A1F4A','#04060F',0.35);scene.add(hemi);

/* ---------- pluie (stries instanciées, position = f(temps figé)) ---------- */
const NR=2200;
const rG=new THREE.InstancedBufferGeometry();const qd=new THREE.PlaneGeometry(1,1);rG.index=qd.index;rG.setAttribute('position',qd.getAttribute('position'));
{const a=new Float32Array(NR*4);const R=mulberry32(99);for(let i=0;i<NR;i++){a[i*4]=R();a[i*4+1]=R();a[i*4+2]=R();a[i*4+3]=R();}rG.setAttribute('aSeed',new THREE.InstancedBufferAttribute(a,4));}
const rainU={uT:{value:0},uCam:{value:new THREE.Vector3()},uA:{value:1},uSweep:{value:999},uL0:{value:new THREE.Vector3()},uL1:{value:new THREE.Vector3()},uLD:{value:new THREE.Vector3(0,0,-1)},uLI:{value:1}};
const rainMat=new THREE.ShaderMaterial({uniforms:rainU,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,
 vertexShader:`attribute vec4 aSeed;uniform float uT,uSweep;uniform vec3 uCam;varying vec2 vQ;varying vec3 vWP;varying float vSw;
 void main(){vec3 B=vec3(24.0,11.0,46.0);vec3 base=aSeed.xyz*B;base.y-=uT*(9.0+aSeed.w*3.0);base.x+=uT*0.8;
  vec3 o=uCam-vec3(B.x*0.5,2.0,B.z*0.85);vec3 p=o+mod(base-o,B);
  float len=0.45+aSeed.w*0.3;vec3 toC=normalize(vec3(uCam.x-p.x,0.0,uCam.z-p.z));vec3 side=normalize(cross(vec3(0.0,1.0,0.0),toC));
  vec3 wp=p+side*position.x*0.012*(1.0+length(uCam-p)*0.03)+vec3(0.08,1.0,0.0)*position.y*len;
  vQ=position.xy;vWP=wp;vSw=step(p.z,uSweep);gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.0);}`,
 fragmentShader:`varying vec2 vQ;varying vec3 vWP;varying float vSw;uniform vec3 uCam,uL0,uL1,uLD;uniform float uA,uLI;
 float beam(vec3 L){vec3 d=vWP-L;float dist=length(d);float c=dot(d/dist,uLD);return smoothstep(0.90,0.985,c)*smoothstep(48.0,4.0,dist);}
 void main(){float a=(1.0-abs(vQ.x)*2.0)*(1.0-pow(abs(vQ.y)*2.0,2.0));float dc=length(vWP-uCam);
  float b=max(beam(uL0),beam(uL1))*uLI;float fade=smoothstep(60.0,15.0,dc)*smoothstep(2.0,6.0,dc)*0.75;
  vec3 col=vec3(0.75,0.83,1.0)*(0.10+1.1*b);gl_FragColor=vec4(col*a*fade*uA*vSw,1.0);}`});
const rain=new THREE.Mesh(rG,rainMat);rain.frustumCulled=false;rain.renderOrder=20;rG.instanceCount=NR;scene.add(rain);

/* ---------- piéton (mannequin articulé, sans visage) ---------- */
