function sampleBody(spec,N,seed,off){

  const inside=(P,skip)=>{for(let k=0;k<prims.length;k++){if(k===skip)continue;const q=prims[k];
      if(q.k==='e'){const x=(P[0]-q.c[0])/q.rad[0],y=(P[1]-q.c[1])/q.rad[1],z=(P[2]-q.c[2])/q.rad[2];if(x*x+y*y+z*z<0.94)return true;}
      else{const ab=[q.b[0]-q.a[0],q.b[1]-q.a[1],q.b[2]-q.a[2]];const ap=[P[0]-q.a[0],P[1]-q.a[1],P[2]-q.a[2]];
        const h=clamp((ab[0]*ap[0]+ab[1]*ap[1]+ab[2]*ap[2])/(q.L*q.L));const d=Math.hypot(ap[0]-ab[0]*h,ap[1]-ab[1]*h,ap[2]-ab[2]*h);if(d<mix(q.ra,q.rb,h)*0.96)return true;}}
    return false;};
  for(let i=0,guard=0;i<N&&guard<N*12;guard++){const u=R();let j=0;while(j<cum.length-1&&u>cum[j])j++;const p=prims[j];let P,Nn,up;
    if(p.k==='e'){const d=rnd3();P=[p.c[0]+d[0]*p.rad[0],p.c[1]+d[1]*p.rad[1],p.c[2]+d[2]*p.rad[2]];
      Nn=[d[0]/p.rad[0],d[1]/p.rad[1],d[2]/p.rad[2]];up=(d[1]+1)/2;}
    else{const ax=[(p.b[0]-p.a[0])/p.L,(p.b[1]-p.a[1])/p.L,(p.b[2]-p.a[2])/p.L];
      let tmp=Math.abs(ax[1])<0.9?[0,1,0]:[1,0,0];
      let e1=[ax[1]*tmp[2]-ax[2]*tmp[1],ax[2]*tmp[0]-ax[0]*tmp[2],ax[0]*tmp[1]-ax[1]*tmp[0]];let l1=Math.hypot(...e1);e1=e1.map(v=>v/l1);
      const e2=[ax[1]*e1[2]-ax[2]*e1[1],ax[2]*e1[0]-ax[0]*e1[2],ax[0]*e1[1]-ax[1]*e1[0]];
      const side=Math.PI*(p.ra+p.rb)*p.L/p.area;
      if(R()<side){const v=R(),th=R()*Math.PI*2;const rr=mix(p.ra,p.rb,v);const c=Math.cos(th),sn=Math.sin(th);
        const rv=[e1[0]*c+e2[0]*sn,e1[1]*c+e2[1]*sn,e1[2]*c+e2[2]*sn];
        P=[p.a[0]+ax[0]*p.L*v+rv[0]*rr,p.a[1]+ax[1]*p.L*v+rv[1]*rr,p.a[2]+ax[2]*p.L*v+rv[2]*rr];Nn=rv;up=1-v;}
      else{const end=R()<0.5;const d=rnd3();const cc=end?p.b:p.a;const rr=end?p.rb:p.ra;const dd=(d[0]*ax[0]+d[1]*ax[1]+d[2]*ax[2])*(end?1:-1);
        const dv=dd<0?d.map((v,k)=>v-2*dd*ax[k]*(end?1:-1)):d;P=[cc[0]+dv[0]*rr,cc[1]+dv[1]*rr,cc[2]+dv[2]*rr];Nn=dv;up=end?0:1;}}
    if(inside(P,j))continue;
    const ln=Math.hypot(...Nn);
    pos[i*3]=P[0]+off[0];pos[i*3+1]=P[1]+off[1];pos[i*3+2]=P[2]+off[2];
    nor[i*3]=Nn[0]/ln;nor[i*3+1]=Nn[1]/ln;nor[i*3+2]=Nn[2]/ln;reg[i]=p.reg;sv[i*3]=R();sv[i*3+1]=R();sv[i*3+2]=up;i++;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aN',new THREE.BufferAttribute(nor,3));
  g.setAttribute('aR',new THREE.BufferAttribute(reg,1));g.setAttribute('aS',new THREE.BufferAttribute(sv,3));

}

const PAL=`vec3 pal(float x){x=clamp(x,0.0,1.0);
 vec3 c0=vec3(0.016,0.012,0.10),c1=vec3(0.063,0.133,0.43),c2=vec3(0.18,0.36,1.0),c3=vec3(0.48,0.29,1.0),c4=vec3(0.84,0.235,0.78),c5=vec3(1.0,0.42,0.23),c6=vec3(1.0,0.77,0.28),c7=vec3(1.0,0.965,0.855);
 if(x<0.15)return mix(c0,c1,x/0.15);if(x<0.3)return mix(c1,c2,(x-0.15)/0.15);if(x<0.45)return mix(c2,c3,(x-0.3)/0.15);if(x<0.6)return mix(c3,c4,(x-0.45)/0.15);

function bodyMat(shell){

   void main(){int ri=int(aR+0.5);vec3 p=position;float yN=(p.y-uBase)/uHt;
