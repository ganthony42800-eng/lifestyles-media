{const m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3();let k=0;

function hermK(K,t,idx){const n=K.length;let i=0;while(i<n-2&&t>K[i+1][0])i++;const a=K[i],b=K[i+1];const dt=b[0]-a[0];const u=clamp((t-a[0])/dt);

    if(d0*d1<=0)return 0;const w1=2*h1+h0,w2=h1+2*h0;return (w1+w2)/(w1/d0+w2/d1);};

  return (2*u3-3*u2+1)*p0+(u3-2*u2+u)*m0+(-2*u3+3*u2)*p1+(u3-u2)*m1;}

     s.material.opacity=k*0.32*Math.sin(Math.PI*ph)*(1-0.4*sd[3])*sm(lin(t,19.5,19.9));});}
  // ---- neige ----
  {const gust=15*sm(lin(t,9.25,10.5));const obl=BX*sm(lin(t,16.9,19.8));const base=0.45+0.55*dense+0.25*sm(lin(t,9.25,9.6))*(1-sm(lin(t,10.2,10.8)));
   const zOff=V*t,yOff=-1.0*t;   // 57,5 m = 5 × BZ ; 25 m = 2 × BY
   const cp=cam.position;
   for(let i=0;i<NSN;i++){const s=SNS[i];let x=s[0]*BX-gust-obl+0.6*t*(BX/15)+0.3*Math.sin(t*0.9+s[3]*6);let y=s[1]*BY+yOff+0.25*Math.sin(t*1.3+s[2]*9);let z=s[2]*BZ+zOff*Math.cos(SLOPE);
     x=((x%BX)+BX)%BX-BX/2;y=((y%BY)+BY)%BY-BY/2;z=((z%BZ)+BZ)%BZ-BZ*0.85;
     snP[i*3]=cp.x+x;snP[i*3+1]=cp.y+y;snP[i*3+2]=cp.z+z;snA[i]=(s[3]<base?1:0)*(0.55+0.45*s[3]);}
   snG.attributes.position.needsUpdate=true;snG.attributes.aA.needsUpdate=true;}
  // ---- post ----
  const edge=sm(lin(t,4.98,5.6))*(1-0.25*sm(lin(t,9.3,10.2)))*(1-sm(lin(t,18.6,19.9)));
  fin.uniforms.uEdge.value=edge*0.9;
  fin.uniforms.uCool.value=sm(lin(t,9.3,10.2))*(1-sm(lin(t,19.3,20.0)))*(0.6+0.3*sm(lin(t,12.8,15)));
  fin.uniforms.uFrame.value=Math.round(t*30);
  // ombre de la traverse du pylône qui balaie l'image
  {let k=0,y=-1;for(const tp of PYL){const d=t-tp;if(d>-0.35&&d<0.35){k=Math.sin(Math.PI*(d+0.35)/0.7);y=1.15-1.3*(d+0.35)/0.7;}}fin.uniforms.uSweepK.value=k;fin.uniforms.uSweep.value=y;}
  fin.uniforms.uFlash.value=0.6*pulse(t,17.22,0.05);
  fin.uniforms.uVig.value=0.24+0.10*night;
  // mise au point : décor flou derrière la main (macro) et la poitrine, léger flou sinon
  const macro=sm(lin(t,5.0,5.8))*(1-sm(lin(t,7.5,7.9)));const chest=sm(lin(t,7.7,8.1))*(1-sm(lin(t,10.3,10.7)));const th=sm(lin(t,19.4,19.9))*(1-sm(lin(t,21.7,22.2)));
  const bb=0.55+3.2*macro+1.6*chest+1.4*th+0.9*(t>3.0&&t<4.9?1:0)*sm(lin(t,3.0,3.3))*(1-sm(lin(t,4.6,4.9)));
  blurH.uniforms.uB.value=bb;blurV.uniforms.uB.value=bb;
  bloom.strength=0.5+0.25*sm(lin(t,5.0,5.6))*(1-sm(lin(t,10,11)));
}

  window.renderAt(0);
  for(const b of B){b.el.style.opacity=1;b.el.style.transform='none';b.el.style.filter='none';b.el.style.letterSpacing='';const rg=document.createRange();rg.selectNodeContents(b.el);const bb=rg.getBoundingClientRect();
    if(bb.left<90||bb.right>990)console.warn('trop large',b.id,Math.round(bb.left),Math.round(bb.right));if(bb.bottom>780)console.warn('trop bas',b.id,Math.round(bb.bottom));}
  window.renderAt(0);})();
