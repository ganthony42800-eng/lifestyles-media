<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:IDB;src:url(/engine/fonts/InterDisplay-Black.otf)}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05060d}
  canvas{position:absolute;inset:0}
  .t{position:absolute;left:0;right:0;text-align:center;font-family:IDB;color:#fff;letter-spacing:-2px}
  #h1{top:1180px;font-size:92px;line-height:1.02;background:linear-gradient(90deg,#5ef2e0,#9682ff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(94,242,224,.45))}
</style>
<script type="importmap">{"imports":{"three":"/engine/vendor/three/three.module.js","three/addons/":"/engine/vendor/three/addons/"}}</script>
</head><body>
<div class="t" id="h1">Tu t'enrhumes<br>presque autant.</div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const W=1080,H=1920;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1); r.setSize(W*2/3,H*2/3,false); r.domElement.style.width=W+'px'; r.domElement.style.height=H+'px'; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.05;
document.body.prepend(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#05060d');
const pm=new THREE.PMREMGenerator(r); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(32,W/H,0.1,100);

// verre d'eau
const glass=new THREE.Mesh(new THREE.CylinderGeometry(1.05,0.9,3.2,96,1,true),
  new THREE.MeshPhysicalMaterial({color:'#bfe9ff',transmission:1,thickness:0.25,roughness:0.03,ior:1.45,side:THREE.DoubleSide,transparent:true}));
scene.add(glass);
const water=new THREE.Mesh(new THREE.CylinderGeometry(1.0,0.86,2.4,96),
  new THREE.MeshPhysicalMaterial({color:'#7fd8ff',transmission:0.95,thickness:2,roughness:0.05,ior:1.33,attenuationColor:new THREE.Color('#3aa7ff'),attenuationDistance:3}));
water.position.y=-0.4; scene.add(water);
// comprimé effervescent
const tab=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.2,96),
  new THREE.MeshPhysicalMaterial({color:'#ff8a1c',roughness:0.55,clearcoat:0.3,sheen:0.6,sheenColor:new THREE.Color('#ffd28a')}));
scene.add(tab);
// bulles instanciées
const NB=420, bub=new THREE.InstancedMesh(new THREE.SphereGeometry(0.035,12,12),
  new THREE.MeshPhysicalMaterial({color:'#ffffff',transmission:0.6,roughness:0,emissive:'#9fe8ff',emissiveIntensity:0.35}),NB);
scene.add(bub);
const seeds=[...Array(NB)].map((_,i)=>({x:(Math.sin(i*12.9898)*43758.5453%1),z:(Math.sin(i*78.233)*12345.678%1),s:0.4+((i*0.618)%1),o:(i*0.37)%1}));
// lumières
const key=new THREE.SpotLight('#ffffff',90,20,0.5,0.6); key.position.set(3,6,4); scene.add(key);
const rim=new THREE.PointLight('#5ef2e0',40,12); rim.position.set(-3,1,-2); scene.add(rim);
const rim2=new THREE.PointLight('#9682ff',40,12); rim2.position.set(3,-1,-2); scene.add(rim2);

const comp=new EffectComposer(r); comp.addPass(new RenderPass(scene,cam));
comp.setSize(W*2/3,H*2/3); comp.addPass(new UnrealBloomPass(new THREE.Vector2(W/3,H/3),0.55,0.6,0.82)); comp.addPass(new OutputPass());
const m=new THREE.Matrix4(), q=new THREE.Quaternion(), v=new THREE.Vector3(), sc=new THREE.Vector3();
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
window.renderAt=(t)=>{
  const d=ease(t/2.2); // chute du comprimé
  tab.position.set(0,2.6-3.4*d,0); tab.rotation.set(0.6*(1-d)+0.2,t*0.4,0.3*(1-d));
  for(let i=0;i<NB;i++){const s=seeds[i]; const life=((t*0.35*s.s+s.o)%1); const on=t>1.6?1:0;
    v.set((s.x-0.5)*1.5,-1.4+life*2.3,(s.z-0.5)*1.5); sc.setScalar(on*(0.4+s.s)*(0.6+life));
    m.compose(v,q,sc); bub.setMatrixAt(i,m);} bub.instanceMatrix.needsUpdate=true;
  const a=0.35+t*0.08; cam.position.set(Math.sin(a)*7.2,1.4-t*0.05,Math.cos(a)*7.2); cam.lookAt(0,0.2,0);
  document.getElementById('h1').style.opacity=Math.min(1,t/0.3+0.999);
  comp.render();
};
window.sceneReady=document.fonts.ready.then(()=>{window.renderAt(0);});
</script></body></html>
