import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const RW=720,RH=1280;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ein=x=>Math.pow(clamp(x),3);
const eback=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const springE=p=>p>=1?1:(p<=0?0:1-Math.exp(-5.2*p)*Math.cos(8.6*p));
const TAU=Math.PI*2;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];const sc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};const lerp3=(a,b,k)=>[mix(a[0],b[0],k),mix(a[1],b[1],k),mix(a[2],b[2],k)];

const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1);r.setSize(RW,RH,false);r.domElement.id='gl';document.body.prepend(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;
const S=new THREE.Scene();S.background=new THREE.Color('#06070D');
const cam=new THREE.PerspectiveCamera(55,RW/RH,0.02,80);
const comp=new EffectComposer(r);comp.setPixelRatio(1);comp.setSize(RW,RH);
comp.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(RW,RH),0.8,0.55,0.14);comp.addPass(bloom);
comp.addPass(new OutputPass());

const U={uH:{value:RH}};
const VS=`uniform float uH;attribute vec3 aCol;attribute float aSz;varying vec3 vC;
 void main(){vC=aCol;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=clamp(aSz*uH*0.0050/(-mv.z),1.0,16.0);}`;
const FS=`varying vec3 vC;void main(){vec2 q=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(q));gl_FragColor=vec4(vC*a,1.0);}`;
const mat=()=>new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
function dyn(n,sz){const g=new THREE.BufferGeometry();const p=new Float32Array(n*3),c=new Float32Array(n*3),z=new Float32Array(n).fill(sz||1);
  g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('aCol',new THREE.BufferAttribute(c,3));g.setAttribute('aSz',new THREE.BufferAttribute(z,1));
  const o=new THREE.Points(g,mat());o.frustumCulled=false;S.add(o);return {g,p,c,z,o,n};}
const upd=D=>{D.g.attributes.position.needsUpdate=true;D.g.attributes.aCol.needsUpdate=true;D.g.attributes.aSz.needsUpdate=true;};

/* ép. 17 — dromadaire en particules dans les dunes au crépuscule. Accroche : la bosse brille comme une gourde d'eau (bleu qui
   clapote) → MYTHE : l'eau vire à l'ambre (graisse, jusqu'à ≈ 36 kg) → il boit au point d'eau : le flux part dans le corps
   (le sang), pas dans la bosse → globules rouges ovales en gros plan → la nuance : réserve de nourriture, sans manger la bosse
   fond et retombe sur le côté → ép. 18 chat. */
const LD=nrm([-0.35,0.8,0.5]);
const RIM=nrm([0.75,0.3,-0.6]);
function shade(n,base,rimK){const d=Math.max(0,n[0]*LD[0]+n[1]*LD[1]+n[2]*LD[2]);const rm=Math.pow(Math.max(0,n[0]*RIM[0]+n[1]*RIM[1]+n[2]*RIM[2]),2)*(rimK||1);
  return [base[0]*(0.34+0.85*d)+rm*0.70,base[1]*(0.34+0.85*d)+rm*0.42,base[2]*(0.34+0.85*d)+rm*0.26];}

/* ---------- décor : dunes, ciel, lune, point d'eau ---------- */
const dune=(x,z)=>0.30*Math.sin(x*0.45+z*0.2)+0.22*Math.sin(z*0.6-x*0.15+1.3)+0.10*Math.sin(x*1.3+z*0.9)-0.25;
const duneAt=(x,z)=>{const d=Math.hypot(x-0.6,z-0.3);return dune(x,z)*sm(lin(d,2.4,5.0));};
const NG=18000;const GROUND=dyn(NG,1.1);const GP=[];{const R=mulberry32(1717);for(let i=0;i<NG;i++){GP.push([(R()*2-1)*10+1,(R()*2-1)*8-2,R()]);}}
const NST=1600;const STAR=dyn(NST,1.6);{const R=mulberry32(5);for(let i=0;i<NST;i++){const a=(R()*0.9-0.45)*Math.PI,h=0.12+R()*0.9;
  const rr=22;STAR.p.set([Math.cos(a)*rr*-1+2,1+h*rr*0.7,Math.sin(a)*rr-10],i*3);const k=0.05+0.5*R()**6;STAR.c.set([k*0.9,k*0.92,k],i*3);}upd(STAR);}
const NMN=900;const MOON=dyn(NMN,2.2);{const R=mulberry32(8);for(let i=0;i<NMN;i++){const a=R()*TAU,rr=Math.sqrt(R());const k=rr<0.93?0.55:0.25;
  MOON.p.set([-4.5+Math.cos(a)*rr*0.9,9.5+Math.sin(a)*rr*0.9,-14],i*3);MOON.c.set([k*1.0,k*0.92,k*0.78],i*3);}upd(MOON);}
const NHZ=2600;const HAZE=dyn(NHZ,3.2);{const R=mulberry32(9);for(let i=0;i<NHZ;i++){const x=(R()*2-1)*16,z=-9-R()*4;HAZE.p.set([x,R()*1.4,z],i*3);const k=0.03+0.03*R();HAZE.c.set([k*1.6,k*0.8,k*0.55],i*3);}upd(HAZE);}
const NM=500;const MOTE=dyn(NM,1.3);const MD=[];{const R=mulberry32(55);for(let i=0;i<NM;i++)MD.push([R()*2-1,R()*2-1,R()*2-1,R()]);}
const NPO=2600;const POOL=dyn(NPO,1.3);const POU=[];{const R=mulberry32(21);for(let i=0;i<NPO;i++)POU.push([R()*TAU,Math.sqrt(R()),R()]);}
const PC=[2.45,0.02,0.75];

/* ---------- dromadaire ---------- */
const OR=mulberry32(1717);
const SPH=n=>{const a=[];for(let i=0;i<n;i++){const th=Math.acos(2*OR()-1),ph=OR()*TAU;a.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph),OR()]);}return a;};
const NBO=8000,NHU=4200,NHI=3200,NNE=2600,NHE=1600,NLG=3600,NTL=200,NEY=30;
const CAM=dyn(NBO+NHU+NHI+NNE+NHE+NLG+NTL+NEY,1.2);
const BOU=SPH(NBO),HUU=SPH(NHU),HEU=SPH(NHE);
const HIU=[];for(let i=0;i<NHI;i++){const th=Math.acos(2*OR()-1),ph=OR()*TAU,rr=Math.cbrt(OR())*0.88;HIU.push([Math.sin(th)*Math.cos(ph)*rr,Math.cos(th)*rr,Math.sin(th)*Math.sin(ph)*rr,OR()]);}
const NEU=[];for(let i=0;i<NNE;i++)NEU.push([OR(),OR()*TAU]);
const LGU=[];for(let i=0;i<NLG;i++)LGU.push([i%4,OR(),OR()*TAU]);
const TLU=[];for(let i=0;i<NTL;i++)TLU.push([OR(),OR()*TAU]);
const SAND=[1.0,0.74,0.46];let CAMK=1;
let HUMP=1,FLOP=0,DRINK=0,WATER=0,FATK=0,INNER=1,IDLE=1;
function bez(P0,P1,P2,P3,u){const v=1-u;return [0,1,2].map(i=>v*v*v*P0[i]+3*v*v*u*P1[i]+3*v*u*u*P2[i]+u*u*u*P3[i]);}
function neckPts(t){const sw=0.03*Math.sin(t*1.1)*IDLE;
  const P0=[0.88,1.95,0],P1=lerp3([1.30,1.95,0],[1.20,1.70,0],DRINK),P2=lerp3([1.55,2.55,sw],[1.85,1.10,0],DRINK),P3=lerp3([1.62,2.90,sw],[2.20,0.45,0],DRINK);
  return [P0,P1,P2,P3];}
function headC(t){const P=neckPts(t);const e=bez(...P,1);const d=lerp3([1,0.12,0],[0.45,-0.85,0],DRINK);return add(e,sc(nrm(d),0.24));}
const HC=()=>[-0.05,2.12,0];
function buildCamel(t){let n=0;
  const put=(p,c,s)=>{CAM.p.set(p,n*3);CAM.c.set(sc(c,CAMK),n*3);CAM.z[n]=s||1.2;n++;};
  const breath=1+0.012*Math.sin(t*1.6);
  // corps
  for(const [x,y,z,q] of BOU){put([x*1.02,1.78+y*0.44*breath,z*0.40*breath],shade([x,y,z],SAND,1.4),1.35);}
  // bosse (surface) : HUMP = volume, FLOP = retombe sur le côté
  const hc=HC();const hh=0.62*HUMP;
  const humpP=(x,y,z,rs)=>{const yy=Math.max(y,-0.2);const up=Math.max(0,yy);
    let px=hc[0]+x*0.55*rs*(0.7+0.3*HUMP),py=hc[1]+yy*hh*rs,pz=z*0.36*rs;
    // retombe : le haut bascule vers +z et vers le bas
    const fl=FLOP*up*up;pz+=fl*0.85;py-=fl*0.30*hh*2.4;return [px,py,pz];};
  for(const [x,y,z,q] of HUU){const p=humpP(x,y,z,1);put(p,sc(shade([x,y,z],SAND,1.2),INNER<1?mix(0.35,1,INNER):1),1.25);}
  // intérieur de la bosse : eau (bleu, clapote) → graisse (ambre)
  for(const [x,y,z,q] of HIU){const wob=0.06*Math.sin(t*4+x*6+q*6)*WATER;const p=humpP(x,y+wob,z,0.92);
    const cw=[0.35,0.95,1.7],cf=[1.25,0.72,0.22];const c=lerp3(cw,cf,FATK);const k=(1-INNER)*(0.7+0.6*q)*(y>-0.2?1:0)/Math.max(CAMK,0.3);put(p,sc(c,k),1.15);}
  // cou + tête
  const P=neckPts(t);
  for(const [u,a] of NEU){const b=bez(...P,u);const b2=bez(...P,Math.min(1,u+0.01));const tg=nrm([b2[0]-b[0],b2[1]-b[1],b2[2]-b[2]]);
    const sd=nrm([-tg[1],tg[0],0]);const r0=mix(0.24,0.13,u);const nv=add(sc(sd,Math.cos(a)),[0,0,Math.sin(a)]);put(add(b,sc(nv,r0)),shade(nv,SAND,1.3),1.15);}
  const h=headC(t);const hd=nrm(lerp3([1,0.12,0],[0.45,-0.85,0],DRINK));const hs=nrm([-hd[1],hd[0],0]);
  for(const [x,y,z,q] of HEU){const p=add(add(add(h,sc(hd,x*0.27)),sc(hs,y*0.13)),[0,0,z*0.12]);put(p,shade([x,y,z],SAND,1.3),1.15);}
  // oreilles + œil
  for(let i=0;i<NEY;i++){const s=i%2?1:-1;put(add(add(h,sc(hd,0.02)),add(sc(hs,0.07),[0,0,0.11*s])),[0.12,0.09,0.07],1.5);}
  // pattes longues avec genou
  for(const [k,u,a] of LGU){const front=k<2,side=k%2?1:-1;const hx=front?0.68:-0.70;const hz=0.24*side;
    const knee=[hx+(front?0.02:-0.05),0.72,hz],top=[hx,1.45,hz],bot=[hx+(front?0.03:-0.02),0,hz];
    const p=u<0.5?lerp3(top,knee,u*2):lerp3(knee,bot,(u-0.5)*2);const r0=u<0.5?mix(0.13,0.075,u*2):(Math.abs(u-0.5)<0.03?0.09:mix(0.065,0.08,(u-0.5)*2));
    put(add(p,[Math.cos(a)*r0,0,Math.sin(a)*r0]),shade(nrm([Math.cos(a),0,Math.sin(a)]),u>0.96?[0.35,0.28,0.2]:SAND,1.5),1.2);}
  // queue
  for(const [u,a] of TLU){const sw=0.06*Math.sin(t*1.8+u*2);const p=[-1.0-0.05*u,1.95-0.75*u,sw*u];const r0=u>0.85?0.04:0.015;put(add(p,[Math.cos(a)*r0,0,Math.sin(a)*r0]),shade([0,0,1],SAND,1.1),1.0);}
  upd(CAM);}

/* flux d'eau : point d'eau → bouche → cou → corps (sang) */
const NFL=1600;const FLOW=dyn(NFL,1.2);const FU=[];{const R=mulberry32(44);for(let i=0;i<NFL;i++)FU.push([R(),R()*2-1,R()*2-1,R()*2-1]);}
/* globules rouges ovales */
const NCE=11,PER=900;const CELL=dyn(NCE*PER,1.25);const CU=[];{const R=mulberry32(66);for(let i=0;i<NCE;i++)CU.push([R()*2-1,R()*2-1,R()*2-1,R()*TAU,R()*TAU,R()]);}

/* ---------- caméra ---------- */
const SHOTS=[
 [0,4.45,[1.2,2.5,6.6,0.4,2.55,0],[0.9,2.55,5.7,0.3,2.6,0]],
 [4.45,8.45,[1.3,3.0,5.4,-0.05,2.55,0],[1.0,3.0,4.8,-0.05,2.6,0]],
 [8.45,13.45,[1.8,2.9,10.8,1.8,2.15,0],[1.85,2.8,10.1,1.8,2.1,0]],
 [13.45,17.95,[0.3,1.9,4.2,0.1,1.95,0],[0.2,1.9,3.7,0.1,1.95,0]],
 [17.95,21.25,[3.6,3.2,4.6,0.0,2.45,0.1],[3.3,3.2,4.1,0.0,2.5,0.1]],
 [21.25,24.01,[1.2,2.8,8.4,0.5,2.8,0],[1.3,2.7,7.9,0.5,2.75,0]]];
function camAt(t){let s=SHOTS.find(q=>t>=q[0]&&t<q[1])||SHOTS[SHOTS.length-1];const k=sm(lin(t,s[0],s[1]))*0.85+lin(t,s[0],s[1])*0.15;
  const v=s[2].map((x,i)=>mix(x,s[3][i],k));cam.position.set(v[0],v[1],v[2]);cam.lookAt(v[3],v[4],v[5]);cam.updateMatrixWorld();}

function stateScene(t){
  IDLE=1;HUMP=1;FLOP=0;DRINK=0;WATER=0;FATK=0;INNER=1;CAMK=1;
  if(t<4.45){INNER=0;WATER=1-sm(lin(t,2.6,3.2));FATK=sm(lin(t,2.6,3.4));}          // gourde → MYTHE → ambre
  else if(t<8.45){INNER=0.05;FATK=1;}                                                       // graisse en coupe
  else if(t<13.45){DRINK=sm(lin(t,8.45,9.4));INNER=mix(0.05,0.6,sm(lin(t,9,10)));FATK=1;} // boit
  else if(t<17.95){INNER=1;CAMK=0.35;}
  else if(t<21.25){const k=sm(lin(t,18.3,20.2));HUMP=mix(1,0.45,k);FLOP=k;INNER=0.55;FATK=1;}  // fond et retombe
  else{const k=sm(lin(t,21.4,22.6));HUMP=mix(0.45,1,k);FLOP=1-k;INNER=1;}
  buildCamel(t);
  // point d'eau
  {const v=(t>=8.45&&t<13.45)?1:0.0;for(let i=0;i<NPO;i++){const [a,ru,q]=POU[i];const rip=0.015*Math.sin(ru*20-t*4);
    POOL.p.set([PC[0]+Math.cos(a)*ru*0.7,PC[1]+rip,PC[2]+Math.sin(a)*ru*0.55],i*3);const k=v*(0.4+0.3*q)*(ru>0.95?1.6:1);POOL.c.set([0.18*k,0.55*k,1.0*k],i*3);}upd(POOL);}
  // flux
  {const on=(t>=9.4&&t<13.45)?(1-lin(t,13.0,13.45)):0;const P=neckPts(t);const h=headC(t);
    for(let i=0;i<NFL;i++){const [q,dx,dy,dz]=FU[i];let p=[0,-9,0],a=0;
      if(on>0){const age=((t-9.4)*0.45+q)%1;
        if(age<0.12){const k=age/0.12;p=lerp3([PC[0]-0.3,0.05,PC[2]*0.4],add(h,[0,-0.05,0]),k);}
        else if(age<0.50){const k=(age-0.12)/0.38;const b=bez(...P,1-k);p=add(b,[dx*0.05,dy*0.05,dz*0.05]);}
        else{const k=(age-0.5)/0.5;const sp=sm(k);p=[0.6-sp*0.9+dx*0.85*sp,1.78+dy*0.38*sp,dz*0.34*sp];}
        a=on*(age<0.5?0.85:0.75*(1-0.5*lin(age,0.85,1)));}
      FLOW.p.set(p,i*3);FLOW.c.set([0.35*a,1.0*a,1.7*a],i*3);}upd(FLOW);}
  // globules
  {const on=(t>=13.45&&t<17.95)?1:0;let n=0;
    for(let c=0;c<NCE;c++){const [x0,y0,z0,r1,r2,q]=CU[c];const ctr=[0.15+x0*0.55+0.05*Math.sin(t*0.7+c),1.45+y0*0.45+0.06*Math.sin(t*0.9+c*2),2.75+z0*0.35];
      const ra=r1+t*0.35*(q-0.5),rb=r2+t*0.2;const squish=1+0.12*Math.sin(t*2.2+c);
      for(let i=0;i<PER;i++){const u=(i/PER)*TAU*7,ru=Math.sqrt(((i*0.618)%1));let lx=Math.cos(u)*ru*0.16*squish,ly=Math.sin(u)*ru*0.09/squish;
        const lz=(0.035*(1-ru*ru)+0.012)*((i%2)?1:-1)*(ru<0.5?0.4:1);
        let x=lx*Math.cos(ra)-ly*Math.sin(ra),y=lx*Math.sin(ra)+ly*Math.cos(ra),z=lz;const y2=y*Math.cos(rb)-z*Math.sin(rb),z2=y*Math.sin(rb)+z*Math.cos(rb);
        CELL.p.set(on?[ctr[0]+x,ctr[1]+y2,ctr[2]+z2]:[0,-9,0],n*3);const k=on*(ru>0.8?0.9:(ru<0.45?0.22:0.45))*(0.7+0.3*q);CELL.c.set([1.15*k,0.16*k,0.18*k],n*3);n++;}}
    upd(CELL);}
  // dunes
  for(let i=0;i<NG;i++){const g=GP[i];const y=duneAt(g[0],g[1]);const dist=Math.hypot(g[0]-cam.position.x,g[1]-cam.position.z);const k=(0.40+0.2*g[2])*clamp(1.6-dist*0.10,0.25,1.2)*(0.8+0.6*clamp(y+0.4,0,1));
    GROUND.p.set([g[0],y+(g[2]-.5)*0.01,g[1]],i*3);GROUND.c.set([0.70*k,0.48*k,0.28*k],i*3);GROUND.z[i]=2.0;}upd(GROUND);
  // sable en suspension
  for(let i=0;i<NM;i++){const d=MD[i];const x=1+d[0]*6+0.25*Math.sin(t*0.3+i)+t*0.04,y=0.2+(d[1]+1)*1.6,z=d[2]*4;const a=0.035+0.05*d[3];
    MOTE.p.set([x,y,z],i*3);MOTE.c.set([0.85*a,0.62*a,0.40*a],i*3);}upd(MOTE);
  camAt(t);
  bloom.strength=0.75;
}

B.forEach(b=>{const d=document.createElement('div');d.className='blk';d.style.top=b.y+'px';b.el=d;b.lines=[];

const $=id=>document.getElementById(id);
const ENT=0.28,EXT=0.24;
function styleText(t){
  for(const b of B){const el=b.el;let a=b.a,z=b.z;
    if(t<a-0.02||t>z+0.02){el.style.opacity=0;continue;}
    el.style.opacity=1;
    b.lines.forEach((L,li)=>{let op=1,sx=1,sy=1,rot=0;const la=a+li*(b.stg||0.08);
      if((a>0)&&!b.stamp&&!b.btn){if(t<la){op=0;}else if(t<la+ENT+0.3){const p=lin(t,la,la+ENT);const e=springE(p);sy=mix(1.45,1,e);sx=mix(0.94,1,e);op=lin(p,0,0.3);}}
      if(b.stamp===1){const k=lin(t,a,a+0.16);sx=sy=mix(1.3,1.0,eback(k));op=lin(t,a,a+0.04);rot=-6;}
      if(b.btn){const k=lin(t,a,a+0.32);sx=sy=mix(0.6,1.0,eback(k))*(1+0.035*Math.sin(Math.max(0,t-a-0.5)*6.0));op=lin(t,a,a+0.06);}
      if(t>z-EXT){const p=lin(t,z-EXT,z);op*=1-p;sy*=mix(1,0.6,ein(p));sx*=mix(1,1.04,p);}
      L.style.opacity=op.toFixed(3);L.style.transform=`rotate(${rot}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;});}
  const so=(id,a,z)=>{$(id).style.opacity=(lin(t,a,a+0.2)*(1-lin(t,z-0.24,z))).toFixed(3);};
  so('srcA',5.2,8.35);so('srcB',8.9,13.35);so('srcC',13.9,17.85);
  $('pillW').style.opacity=(t<2.55?(1-lin(t,2.35,2.55)):lin(t,23.9,24.0)).toFixed(3);
  $('sim').style.opacity=(0.95*(1-lin(t,21.0,21.25)+lin(t,23.9,24.0))).toFixed(3);
  {const g=eio(lin(t,21.25,21.8))*(1-eio(lin(t,23.55,23.9)));const w=238+262*g,h=w*379/1160;const top=1473.6-h;
   for(const e of [$('sig'),$('sigShine')]){e.style.width=w.toFixed(1)+'px';e.style.left=(930-w).toFixed(1)+'px';e.style.top=top.toFixed(1)+'px';}$('sigShine').style.height=h.toFixed(1)+'px';
   $('sigShine').style.opacity=g.toFixed(3);$('sigShine').style.backgroundPosition=`${(100-lin(t,21.8,22.6)*100).toFixed(1)}% 0`;
   $('at').style.opacity=(lin(t,21.85,22.1)*(1-lin(t,23.4,23.65))).toFixed(3);$('at').style.top=(top-64)+'px';}
}
