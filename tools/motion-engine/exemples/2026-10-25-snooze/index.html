<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ============================== utilitaires déterministes ============================== */
const W=1080,H=1920,RW=720,RH=1280,DUR=21.4;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-clamp(x),3);
const ein=x=>Math.pow(clamp(x),3);
const eback=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const pulse=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
const C=c=>new THREE.Color(c);
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const TAU=Math.PI*2;

/* ============================== rendu ============================== */
const r=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
r.setPixelRatio(1);r.setSize(RW,RH,false);r.domElement.id='gl';document.body.prepend(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=0.86;
const scene=new THREE.Scene();
const MORN=C('#C9D5F1'),NIGHT=C('#070A1E');
scene.background=MORN.clone();scene.fog=new THREE.Fog(MORN.clone(),48,160);
const cam=new THREE.PerspectiveCamera(34,RW/RH,0.3,400);scene.add(cam);
{const pm=new THREE.PMREMGenerator(r);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.75;}

function canvasTex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;const t=new THREE.CanvasTexture(c);
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.userData.canvas=c;
  t.userData.redraw=(...a)=>{const g=c.getContext('2d');g.clearRect(0,0,w,h);draw(g,w,h,...a);t.needsUpdate=true;};t.userData.redraw();return t;}
const addMat=(o)=>new THREE.MeshBasicMaterial(Object.assign({transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,fog:false},o));
const softTex=canvasTex(128,128,(g)=>{const rg=g.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(0.4,'rgba(255,255,255,.45)');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,128,128);});
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ============================== lumières : matin bleu, découpes violette et cyan ============================== */
const sun=new THREE.DirectionalLight('#D6E4FF',1.35);sun.position.set(-22,30,-14);scene.add(sun);
const hemi=new THREE.HemisphereLight('#EEF3FF','#7685B8',0.5);scene.add(hemi);
const rimV=new THREE.PointLight('#9C7BFF',0,0,0);rimV.position.set(14,6,-10);scene.add(rimV);
const rimC=new THREE.PointLight('#5FE3FF',0,0,0);rimC.position.set(-10,5,12);scene.add(rimC);
const screenLight=new THREE.PointLight('#BFC8FF',0,22,1.2);screenLight.position.set(0,3,0);scene.add(screenLight);

/* ============================== couette (plis doux seedés) ============================== */
const duvH=(x,z)=>{const d=Math.max(Math.abs(x)-3.0,0)**2+Math.max(Math.abs(z)-7.0,0)**2;const near=Math.exp(-d/6);
  const f=0.55*Math.sin(x*0.21+z*0.09+0.7)+0.38*Math.sin(x*0.07-z*0.18+2.1)+0.22*Math.sin(x*0.43+z*0.31)+0.9*Math.sin(z*0.05+x*0.02)*Math.min(1,Math.hypot(x,z)/30);
  return -0.12+ (1-near)*f*1.6 + near*0.05*Math.sin(x*1.3+z*0.7) - 0.15*near;};
const duvG=new THREE.PlaneGeometry(220,220,170,170);duvG.rotateX(-Math.PI/2);
{const p=duvG.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i)-40;p.setZ(i,z);p.setY(i,duvH(x,z));}duvG.computeVertexNormals();}
const weave=canvasTex(256,256,(g,w,h)=>{const R=mulberry32(5);g.fillStyle='#8080ff';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const v=110+R()*36;g.fillStyle=`rgb(${v},${v},255)`;g.fillRect(R()*w,R()*h,1+R()*2,1);}},false);
weave.wrapS=weave.wrapT=THREE.RepeatWrapping;weave.repeat.set(60,60);
const duvMat=new THREE.MeshPhysicalMaterial({color:'#E3EAFA',roughness:0.95,sheen:1,sheenColor:C('#FFFFFF'),sheenRoughness:0.5,normalMap:weave,normalScale:new THREE.Vector2(0.25,0.25),envMapIntensity:0.35});
const duvet=new THREE.Mesh(duvG,duvMat);scene.add(duvet);
const shadowMat=o=>new THREE.MeshBasicMaterial({map:softTex,color:'#26305E',transparent:true,opacity:o,depthWrite:false,fog:false});
const shPhone=new THREE.Mesh(new THREE.PlaneGeometry(11,19),shadowMat(0.55));shPhone.rotation.x=-Math.PI/2;shPhone.position.set(0.6,0.02,0.5);scene.add(shPhone);

/* ============================== téléphone ============================== */
const PH_T=0.8;   // dessus de l'écran (y)
const phone=new THREE.Group();scene.add(phone);
const chassisMat=new THREE.MeshPhysicalMaterial({color:'#2B3048',metalness:0.85,roughness:0.28,clearcoat:1,clearcoatRoughness:0.1,envMapIntensity:1.3});
{const b=new THREE.Mesh(new RoundedBoxGeometry(7.2,PH_T,15.0,5,0.38),chassisMat);b.position.y=PH_T/2;phone.add(b);
 const bez=new THREE.Mesh(new THREE.PlaneGeometry(7.0,14.8),new THREE.MeshPhysicalMaterial({color:'#05060C',roughness:0.15,clearcoat:1,envMapIntensity:1}));
 bez.rotation.x=-Math.PI/2;bez.position.y=PH_T+0.002;phone.add(bez);
 // boutons latéraux
 const kb=new THREE.Mesh(new RoundedBoxGeometry(0.12,0.3,1.6,2,0.05),chassisMat);kb.position.set(-3.62,0.42,-3.0);phone.add(kb);}
/* écran : canvas + onde de réfraction liquide + bombement de la vitre (innovation 1) */
const SCW=720,SCH=1558,SW=6.7,SH=14.5;
const BTN={cx:360,cy:1000,w:500,h:132};
const PRESSES=[1.5,3.4,3.8,4.2];
const screenTex=canvasTex(SCW,SCH,(g,w,h,t)=>drawScreen(g,w,h,t||0));
const NRIP=12;
const scrU={tMap:{value:screenTex},uT:{value:0},uRip:{value:Array.from({length:NRIP},()=>new THREE.Vector4(0,0,-99,0))},
  uBulge:{value:new THREE.Vector4(0,0,0,0.8)},uK:{value:1},uRefl:{value:1},uNight:{value:0}};
const scrMat=new THREE.ShaderMaterial({uniforms:scrU,toneMapped:true,
 vertexShader:`uniform vec4 uBulge;varying vec2 vUv;varying vec2 vP;varying vec3 vN,vV;
 void main(){vUv=uv;vec2 p=vec2((uv.x-0.5)*${SW.toFixed(2)},(0.5-uv.y)*${SH.toFixed(2)});vP=p;vec3 pos=position;
  float b=uBulge.z*exp(-dot(p-uBulge.xy,p-uBulge.xy)/(uBulge.w*uBulge.w));pos.z+=b;
  vec4 wp=modelMatrix*vec4(pos,1.0);vN=normalize(mat3(modelMatrix)*normal);vV=normalize(cameraPosition-wp.xyz);gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:`uniform sampler2D tMap;uniform float uT,uK,uRefl,uNight;uniform vec4 uRip[${NRIP}];uniform vec4 uBulge;varying vec2 vUv;varying vec2 vP;varying vec3 vN,vV;
 void main(){vec2 off=vec2(0.0);float shade=0.0;
  for(int i=0;i<${NRIP};i++){vec4 R=uRip[i];float age=uT-R.z;if(age<0.0||age>1.6)continue;vec2 d=vP-R.xy;float dist=length(d)+1e-4;
   float front=age*7.5;float x=dist-front;float env=R.w*exp(-age*2.6)*exp(-x*x/0.9);
   float h=sin(x*9.0)*env;float dh=cos(x*9.0)*env;off+=d/dist*h*0.16;shade+=dh*0.35;}
  float bd=length(vP-uBulge.xy);float bk=uBulge.z*exp(-bd*bd/(uBulge.w*uBulge.w));off+=-(vP-uBulge.xy)*bk*0.35;shade+=bk*0.25;
  vec2 o=off/vec2(${SW.toFixed(2)},-${SH.toFixed(2)});
  vec3 c;c.r=texture2D(tMap,vUv+o*1.0).r;c.g=texture2D(tMap,vUv+o*1.22).g;c.b=texture2D(tMap,vUv+o*1.45).b;
  c*=uK;
  // reflet du matin sur la vitre (Fresnel + bande diagonale) et lumière de l'onde
  float fr=pow(1.0-max(dot(vN,vV),0.0),4.0);float band=smoothstep(0.22,0.0,abs(vUv.x*0.8+vUv.y*0.55-0.95));
  vec3 sky=mix(vec3(0.75,0.82,1.0),vec3(0.2,0.25,0.5),uNight);
  c+=sky*(0.025+fr*0.35+band*0.05)*uRefl;
  c+=vec3(0.8,0.85,1.0)*max(shade,0.0)*0.35+vec3(0.55,0.45,1.0)*max(-shade,0.0)*0.12;
  gl_FragColor=vec4(c,1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
 }`});
const screen=new THREE.Mesh(new THREE.PlaneGeometry(SW,SH,48,104),scrMat);screen.rotation.x=-Math.PI/2;screen.position.y=PH_T+0.006;phone.add(screen);
const cz=y=>(y/SCH-0.5)*SH,cxw=x=>(x/SCW-0.5)*SW;
const BTN_W=V3(0,PH_T+0.01,cz(BTN.cy));
/* anneau rouge néon (3D, HDR → bloom) */
const ringTex=canvasTex(512,160,(g,w,h)=>{g.strokeStyle='#fff';g.lineWidth=7;g.filter='blur(3px)';roundRect(g,20,20,w-40,h-40,(h-40)/2);g.stroke();g.filter='none';g.lineWidth=3.5;roundRect(g,20,20,w-40,h-40,(h-40)/2);g.stroke();});
const ring=new THREE.Mesh(new THREE.PlaneGeometry(cxw(BTN.cx+BTN.w/2+40)-cxw(BTN.cx-BTN.w/2-40),(BTN.h+80)/SCH*SH*1.0),addMat({map:ringTex,color:C('#FF3B5C')}));
ring.rotation.x=-Math.PI/2;ring.position.set(0,PH_T+0.03,BTN_W.z);phone.add(ring);

/* ============================== la règle de 30 min (tiroir de verre) ============================== */
const RAIL_IN=2.2,RAIL_OUT=5.15,RL=7.6,RWD=2.6;
const rail=new THREE.Group();scene.add(rail);
const glassMat=(col,att,em,emI)=>new THREE.MeshPhysicalMaterial({color:col,transmission:1,thickness:1.1,ior:1.46,roughness:0.06,attenuationColor:C(att),attenuationDistance:1.6,
  clearcoat:1,clearcoatRoughness:0.04,specularIntensity:1,envMapIntensity:1.4,emissive:C(em),emissiveIntensity:emI});
const railMat=glassMat('#EAF4FF','#BFEFFF','#3FE0FF',0.04);
{const base=new THREE.Mesh(new RoundedBoxGeometry(RWD,0.26,RL+0.2,3,0.1),railMat);base.position.y=0.17;rail.add(base);
 for(const s of [-1,1]){const wl=new THREE.Mesh(new RoundedBoxGeometry(0.16,0.5,RL+0.2,2,0.06),railMat);wl.position.set(s*(RWD/2-0.08),0.4,0);rail.add(wl);}}
// liseré cyan sur l'arête + graduations 0-30
const gradTex=canvasTex(256,1024,(g,w,h,lit30)=>{lit30=lit30||0;g.fillStyle='rgba(0,0,0,0)';g.fillRect(0,0,w,h);
  for(let m=0;m<=30;m+=5){const y=40+(m/30)*(h-80);const big=m%10===0;g.fillStyle=m===30?`rgba(255,255,255,${0.6+0.4*lit30})`:'rgba(220,250,255,.85)';g.fillRect(w-(big?120:80),y-3,big?120:80,6);}
  g.font='bold 74px IDBd';g.textAlign='left';g.textBaseline='middle';g.fillStyle='rgba(230,252,255,.95)';g.fillText('0',14,40+10);
  g.fillStyle=`rgba(255,255,255,${0.7+0.3*lit30})`;g.fillText('30',8,h-40-12);});
const gradMat=addMat({map:gradTex,color:C('#9AF3FF').multiplyScalar(1.4)});gradMat.blending=THREE.NormalBlending;gradMat.depthTest=true;
const grad=new THREE.Mesh(new THREE.PlaneGeometry(1.0,RL),gradMat);grad.rotation.x=-Math.PI/2;grad.rotation.z=Math.PI;grad.position.set(RWD/2+0.5,0.66,0);grad.renderOrder=4;
// graduations à l'extérieur de la règle (posées sur la couette, lisibles)
rail.add(grad);
const edge=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.035,RL+0.2),addMat({color:C('#5FE8FF').multiplyScalar(1.6)}));edge.position.set(RWD/2,0.66,0);rail.add(edge);
const shRail=new THREE.Mesh(new THREE.PlaneGeometry(4.2,10.5),shadowMat(0.35));shRail.rotation.x=-Math.PI/2;shRail.position.set(0,-0.08,0);rail.add(shRail);

/* ============================== blocs de 10 min ============================== */
const BL=RL/3-0.06,BH=1.05,BWD=2.0,BY=0.3+BH/2;
const SLOT=[RL/3,0,-RL/3];       // 0 min à +Z, 30 min à −Z
const violetMat=glassMat('#D9CCFF','#7B5CFF','#5B3CFF',0.32);
const redMat=glassMat('#FFD0D8','#FF3B5C','#C0102E',0.55);
const fresV=new THREE.ShaderMaterial({uniforms:{uCol:{value:C('#B49CFF')},uK:{value:1}},transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,
 vertexShader:`varying vec3 vN,vV;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vN=normalize(mat3(modelMatrix)*normal);vV=normalize(cameraPosition-wp.xyz);gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:`uniform vec3 uCol;uniform float uK;varying vec3 vN,vV;void main(){float f=pow(1.0-abs(dot(normalize(vN),vV)),2.5);gl_FragColor=vec4(uCol*f*1.3*uK,1.0);}`});
const fresR=fresV.clone();fresR.uniforms.uCol.value=C('#FF5A76');
const tickTex=canvasTex(128,256,(g,w,h)=>{for(let i=1;i<10;i++){const y=i/10*h;g.fillStyle='rgba(255,255,255,.95)';g.fillRect(i===5?20:44,y-2,i===5?88:40,4);}});
function makeBlock(len,mat,fres){const g=new THREE.Group();const geo=new RoundedBoxGeometry(BWD,BH,len,3,0.2);
  const m=new THREE.Mesh(geo,mat);g.add(m);const f=new THREE.Mesh(geo,fres);f.scale.setScalar(1.012);f.renderOrder=6;g.add(f);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(3.4,len+1.6),shadowMat(0.35));sh.rotation.x=-Math.PI/2;sh.renderOrder=1;g.userData.sh=sh;scene.add(sh);
  g.userData.m=m;g.userData.f=f;scene.add(g);return g;}
const blocks=[0,1,2].map(()=>makeBlock(BL,violetMat,fresV));
for(const b of blocks){const tk=new THREE.Mesh(new THREE.PlaneGeometry(BWD*0.55,BL*0.92),new THREE.MeshBasicMaterial({map:tickTex,transparent:true,depthWrite:false,color:C('#ffffff').multiplyScalar(1.3),toneMapped:false}));
  tk.rotation.x=-Math.PI/2;tk.position.y=BH/2+0.004;tk.renderOrder=7;b.add(tk);b.userData.tk=tk;}
// tranche 6/30 (20 % exacts de la règle) + reste du 1er bloc
const SL=RL*0.2;                       // 1,52 cm
const RESTL=BL-SL;
const slice=makeBlock(SL-0.03,redMat,fresR);
const rest=makeBlock(RESTL-0.03,violetMat,fresV);
const sixTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#fff';g.font='200px IDBk';g.textAlign='center';g.textBaseline='middle';g.fillText('6',w/2,h/2+12);});
