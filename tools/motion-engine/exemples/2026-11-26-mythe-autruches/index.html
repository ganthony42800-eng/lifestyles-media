const RW=720,RH=1280;

/* ---------- soleil bas + étoiles ---------- */
const SUNC=[1.6,0.45,-14];const NS=2600;const SUN=dyn(NS,2.6);{const R=mulberry32(9);for(let i=0;i<NS;i++){const a=R()*TAU,rr=Math.sqrt(R())*1.5;

  const s=0.55+0.45*Math.cbrt(R());BD.push([BU[0]+x*BUR*s*1.1,BU[1]+y*BUR*s*0.85,BU[2]+z*BUR*s,R()]);}}

const OST=dyn(NBO+NNE+NHE+NBK+NEY+NLG,1.15);const OR=mulberry32(2026);

const BKU=[];for(let i=0;i<NBK;i++)BKU.push([OR(),OR()*TAU,OR()]);
const EYU=[];for(let i=0;i<NEY;i++){const th=Math.acos(2*OR()-1),ph=OR()*TAU;EYU.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph),i%2]);}

/* postures : BC centre du corps, tilt, S épaule, C contrôle, H tête */
const P={
 up:{BC:[0,1.05,0],tilt:0.10,S:[0.42,1.22,0],C:[0.55,1.68,0],H:[0.62,2.05,0],leg:1},
 hole:{BC:[0,1.0,0],tilt:-0.22,S:[0.45,1.08,0],C:[1.06,1.05,0],H:[1.05,-0.03,0],leg:1},
 flat:{BC:[0,0.34,0],tilt:0.0,S:[0.47,0.38,0],C:[0.85,0.05,0],H:[1.48,0.07,0],leg:0},
 run:{BC:[0,1.05,0],tilt:0.06,S:[0.45,1.16,0],C:[0.72,1.48,0],H:[0.86,1.78,0],leg:1},
 bush:{BC:[0,1.0,0],tilt:-0.10,S:[0.45,1.12,0],C:[0.95,1.30,0],H:[1.30,0.70,0],leg:1}};
function blend(a,b,k){return {BC:lerp3(a.BC,b.BC,k),tilt:mix(a.tilt,b.tilt,k),S:lerp3(a.S,b.S,k),C:lerp3(a.C,b.C,k),H:lerp3(a.H,b.H,k),leg:mix(a.leg,b.leg,k)};}

  if(t<8.45){const p=blend(P.hole,P.hole,0);if(t>=4.45){p.H=[1.05+0.05*Math.sin((t-4.45)*2.4),-0.02+0.015*Math.sin((t-4.45)*3.1),0.04*Math.sin((t-4.45)*1.9)];}return p;}
  if(t<12.45){const k=eio(lin(t,8.6,9.6));const p=blend(P.hole,P.flat,k);if(k<0.5)p.H=lerp3(p.H,[1.05,0.25,0],Math.sin(k*Math.PI));return p;}

  // œil : grand, ambre, s'illumine pendant « ≈ 5 cm »
  for(const [ex,ey,ez,side] of EYU){const k=1+EYEK*2.2;const ctr=add(add(add(HC,sc(T,0.025)),sc(up,0.022)),[0,0,side?0.062:-0.062]);
    const pos=add(ctr,[ex*0.017,ey*0.017,ez*0.006]);const core=Math.hypot(ex,ey)<0.45;put(pos,core?[0.05*k,0.04*k,0.06*k]:[0.95*k*0.5,0.55*k*0.5,0.12*k*0.5],0.9);}
  // pattes
  const legK=p.leg;const l1=0.50,l2=0.56;
  for(let side=0;side<2;side++){const zz=side?0.13:-0.13;const [hx,hy]=rot(-0.05,-0.24);const hip=[p.BC[0]+hx,p.BC[1]+hy,zz];
    let foot;if(RUN>0){const ph=t*13+(side?Math.PI:0);foot=[hip[0]+0.08+0.34*Math.cos(ph),Math.max(0,0.20*Math.sin(ph)),zz];}
    else foot=[hip[0]+(side?0.10:-0.04),0,zz];
    if(legK<0.99)foot=lerp3([hip[0]+0.15,Math.max(0,hip[1]-0.25),zz],foot,legK);
    const knee=ik(hip,foot,l1,l2);LEGS[side]={hip,knee,foot};}
  for(const [side,seg,u,a] of LGU){const L=LEGS[side];let A,Bp,rr;
    if(seg===0){A=L.hip;Bp=L.knee;rr=mix(0.075,0.04,u);}else if(seg===1){A=L.knee;Bp=L.foot;rr=mix(0.035,0.026,u);}else{A=L.foot;Bp=add(L.foot,[0.15,0,(u-0.5)*0.05]);rr=0.018;}
    const pos=add(lerp3(A,Bp,u),[Math.cos(a)*rr,Math.sin(a)*rr,Math.sin(a+1)*rr*0.6]);
    const base=seg===0?[0.55,0.40,0.36]:[0.82,0.60,0.52];put(pos,sc(shade(nrm([Math.cos(a),Math.sin(a),0.3]),base,0.8),legK),1.0);}
  for(let i=n;i<OST.n;i++)OST.c.set([0,0,0],i*3);upd(OST);
}

const SHOTS=[
 [0,4.45,[0.6,1.05,6.4,0.5,0.95,0],[0.6,0.85,4.9,0.55,0.85,0]],
 [4.45,8.45,[2.45,0.62,1.75,0.95,0.15,0],[2.10,0.50,1.40,0.98,0.10,0]],

function camAt(t){let s=SHOTS.find(q=>t>=q[0]&&t<q[1])||SHOTS[SHOTS.length-1];const k=sm(lin(t,s[0],s[1]))*0.85+lin(t,s[0],s[1])*0.15;
  const v=s[2].map((x,i)=>mix(x,s[3][i],k));cam.position.set(v[0],v[1],v[2]);cam.lookAt(v[3],v[4],v[5]);cam.updateMatrixWorld();}

function stateScene(t){
  HIDE_Y=t<4.45?0.035:-9;               // accroche : de loin, la tête « disparaît » dans le sol
  FLATK=sm(lin(t,9.2,10.4))*(t<12.45?1:0);
  EYEK=sm(lin(t,15.6,16.1))*(1-sm(lin(t,17.6,17.95)));
  RUN=(t>=12.45&&t<15.25)?1:0;
  BUSHK=sm(lin(t,18.3,18.9))*(t<21.25?1:0);
  HOLEK=RUN?0:1;
  buildOstrich(t);
  // sol
  const v=RUN?9.5:0;
  for(let i=0;i<NG;i++){const g=GP[i];let x=g[0];if(RUN){x=((g[0]-v*(t-12.45))%14+14)%14-7;}
    const y=dune(x,g[1])+holeY(x,g[1],HOLEK)+(g[2]-.5)*0.008;GROUND.p.set([x,y,g[1]],i*3);
    const dist=Math.hypot(x-cam.position.x,g[1]-cam.position.z);const k=(0.30+0.16*g[2])*clamp(1.4-dist*0.07,0.3,1.2);
    const pit=HOLEK*(Math.hypot(x-HP[0],g[1]-HP[2])<0.32?0.55:1);
    const streak=RUN?(1+0.4*Math.sin(x*3+g[2]*9)):1;
    GROUND.c.set([SAND[0]*k*pit*streak,SAND[1]*k*pit*streak,SAND[2]*k*pit*streak],i*3);GROUND.z[i]=2.0;}
  upd(GROUND);
  // poussière (vent ; nuage derrière les pattes pendant le sprint)
  for(let i=0;i<NM;i++){const d=MD[i];let x=((d[0]+t*0.25*(0.5+d[3])+(RUN?-(t-12.45)*6:0))%10+10)%10-5;let y=d[1]+0.08*Math.sin(t*0.8+i);let z=d[2];
    let a=0.05+0.06*d[3];if(RUN&&i<260){const age=((t*1.6+d[3])%1);x=-0.4-age*2.4+d[0]*0.08;y=0.05+age*0.45*d[3];z=(d[3]-.5)*0.6;a=0.22*(1-age);}
    MOTE.p.set([x,y,z],i*3);MOTE.c.set([0.75*a,0.55*a,0.32*a],i*3);}
  upd(MOTE);
  // œufs (retournés par le bec pendant le plan du nid)
  const ev=(t<12.45&&!RUN)?1:0;
  for(let e=0;e<EGGS.length;e++){const ang=t>=4.45&&t<8.45?0.6*Math.sin((t-4.45)*2.0+e*1.7):0;const ca=Math.cos(ang),sa=Math.sin(ang);
    for(let i=0;i<NEP;i++){const u=EGU[e*NEP+i];let x=u[0]*0.072,y=u[1]*0.056,z=u[2]*0.056;const xr=x*ca-y*sa,yr=x*sa+y*ca;
      const pos=[EGGS[e][0]+xr,EGGS[e][1]+yr,EGGS[e][2]+z];const col=shade(u,[0.95,0.90,0.78],0.6);
      EGG.p.set(pos,(e*NEP+i)*3);EGG.c.set(sc(col,ev*(t<4.45?0:1)*0.5),(e*NEP+i)*3);}}
  upd(EGG);
  // buisson
  const bv=sm(lin(t,17.95,18.3))*(1-sm(lin(t,21.0,21.25)));
  for(let i=0;i<NBU;i++){const d=BD[i];const w=0.004*Math.sin(t*2+i);BUSH.p.set([d[0]+w,d[1],d[2]],i*3);const nv=nrm([d[0]-BU[0],d[1]-BU[1],d[2]-BU[2]]);
    const col=shade(nv,[0.20+0.08*d[3],0.36+0.10*d[3],0.14],0.7);BUSH.c.set(sc(col,bv*1.3),i*3);}
  upd(BUSH);
  camAt(t);
  bloom.strength=0.75+0.5*EYEK;
}
