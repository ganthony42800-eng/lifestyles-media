<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const RW=720,RH=1280;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ein=x=>Math.pow(clamp(x),3);
const eback=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const springE=p=>p>=1?1:(p<=0?0:1-Math.exp(-5.2*p)*Math.cos(8.6*p));
const TAU=Math.PI*2;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];const sc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};const lerp3=(a,b,k)=>[mix(a[0],b[0],k),mix(a[1],b[1],k),mix(a[2],b[2],k)];

const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1);r.setSize(RW,RH,false);r.domElement.id='gl';document.body.prepend(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;
const S=new THREE.Scene();S.background=new THREE.Color('#06070D');
const cam=new THREE.PerspectiveCamera(55,RW/RH,0.02,80);
const comp=new EffectComposer(r);comp.setPixelRatio(1);comp.setSize(RW,RH);
comp.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(RW,RH),0.8,0.55,0.14);comp.addPass(bloom);
comp.addPass(new OutputPass());

const U={uH:{value:RH}};
const VS=`uniform float uH;attribute vec3 aCol;attribute float aSz;varying vec3 vC;
 void main(){vC=aCol;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=clamp(aSz*uH*0.0050/(-mv.z),1.0,16.0);}`;
const FS=`varying vec3 vC;void main(){vec2 q=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(q));gl_FragColor=vec4(vC*a,1.0);}`;
const mat=()=>new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
function dyn(n,sz){const g=new THREE.BufferGeometry();const p=new Float32Array(n*3),c=new Float32Array(n*3),z=new Float32Array(n).fill(sz||1);
  g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('aCol',new THREE.BufferAttribute(c,3));g.setAttribute('aSz',new THREE.BufferAttribute(z,1));
  const o=new THREE.Points(g,mat());o.frustumCulled=false;S.add(o);return {g,p,c,z,o,n};}
const upd=D=>{D.g.attributes.position.needsUpdate=true;D.g.attributes.aCol.needsUpdate=true;D.g.attributes.aSz.needsUpdate=true;};


/* Hors-série « Teste ton cerveau » — l'angle mort. Accroche : un œil géant en particules regarde un point rose (« Ce point va
   DISPARAÎTRE ») → test réel à faire sur son téléphone (œil gauche fermé, fixer la croix, approcher) → œil en coupe : rayons de
   lumière, celui qui tombe sur le départ du nerf optique s'éteint (aucun capteur) → le trou se remplit (le cerveau bouche) →
   retour au test, envoi ciblé. Sources : Britannica (blind spot), Wikipedia (12-15° temporal ; distance ≈ 3 × écart). */
const DUR=22;
const LD=nrm([-0.3,0.7,0.6]);
const BG=dyn(1800,1.5);{const R=mulberry32(7);for(let i=0;i<1800;i++){const p=[(R()*2-1)*14,(R()*2-1)*14,-6-R()*10];BG.p.set(p,i*3);const k=0.03+0.25*R()**5;BG.c.set([k*0.9,k*0.85,k],i*3);}upd(BG);}
const OR=mulberry32(2711);
const D=nrm([-0.30,0.08,-1]);                 // direction du disque optique (nasal, arrière)
const DISC_A=0.24;
function sphU(n){const a=[];for(let i=0;i<n;i++){const th=Math.acos(2*OR()-1),ph=OR()*TAU;a.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph),OR()]);}return a;}
const NSC=7000,NRE=7500,NIR=3000,NLE=1100,NNV=2600,NRG=500;
const SCU=sphU(NSC);
const REU=[];while(REU.length<NRE){const [x,y,z,q]=sphU(1)[0];if(z<0.35)REU.push([x,y,z,q]);}
const IRU=[];for(let i=0;i<NIR;i++)IRU.push([OR()*TAU,OR(),OR()]);
const LEU=sphU(NLE);
const NVU=[];for(let i=0;i<NNV;i++)NVU.push([OR(),OR()*TAU,OR()]);
const RGU=[];for(let i=0;i<NRG;i++)RGU.push([OR()*TAU,OR()]);
const EYE=dyn(NSC+NRE+NIR+NLE+NNV+NRG,1.2);
let EK=1,YAW=0,CUT=0,GLOW=0,FILL=0,CUTDIR=[1,0,0],BR=2.2,SZ=2.3;
const rotY=(p,a)=>[p[0]*Math.cos(a)+p[2]*Math.sin(a),p[1],-p[0]*Math.sin(a)+p[2]*Math.cos(a)];
function angTo(u,v){return Math.acos(clamp(u[0]*v[0]+u[1]*v[1]+u[2]*v[2],-1,1));}
function buildEye(t){let n=0;const RS=1.2;
  const put=(pl,c,s,nocut)=>{const p=rotY(pl,YAW);let k=EK;
    if(CUT>0&&!nocut){const d=p[0]*CUTDIR[0]+p[2]*CUTDIR[2];if(d>0.12)k*=1-CUT;}
    EYE.p.set(p,n*3);EYE.c.set(sc(c,k*BR),n*3);EYE.z[n]=(s||1.2)*SZ;n++;};
  const lit=(nv,base,amb)=>{const d=Math.max(0,nv[0]*LD[0]+nv[1]*LD[1]+nv[2]*LD[2]);return sc(base,(amb||0.35)+0.8*d);};
  // sclère (on évite la cornée devant)
  for(const [x,y,z,q] of SCU){if(z>0.82)continue;put([x*RS,y*RS,z*RS],lit([x,y,z],[0.42,0.46,0.56],0.3),1.2);}
  // cornée : calotte bombée, très discrète
  for(const [x,y,z,q] of SCU){if(z<=0.86)continue;const zz=RS*z+0.16*(z-0.86)/0.14;put([x*RS,y*RS,zz],[0.10,0.14,0.20],1.0);}
  // rétine (rose) — trou au disque optique, rempli par FILL
  const RR=RS*0.94;
  for(const [x,y,z,q] of REU){const a=angTo([x,y,z],D);let c=[1.0,0.30,0.55];let k=(0.55+0.5*q)*(CUT>0?mix(0.5,1.25,CUT):0.5);
    if(a<DISC_A){k*=FILL;c=lerp3([1.0,0.30,0.55],[1.0,0.45,0.7],0.5);}
    put([x*RR,y*RR,z*RR],sc(c,k),1.15);}
  // anneau du disque (or) quand GLOW
  for(const [ph,q] of RGU){const ax=D;const u=nrm([ax[1],-ax[0],0]);const v=[ax[1]*u[2]-ax[2]*u[1],ax[2]*u[0]-ax[0]*u[2],ax[0]*u[1]-ax[1]*u[0]];
    const ra=DISC_A*(1.0+0.05*q);const dir=nrm(add(sc(ax,Math.cos(ra)),add(sc(u,Math.sin(ra)*Math.cos(ph)),sc(v,Math.sin(ra)*Math.sin(ph)))));
    put(sc(dir,RR),sc([1.4,0.95,0.35],GLOW*(0.6+0.6*q)*(0.8+0.2*Math.sin(t*6))),1.6,1);}
  // iris (anneau strié) + pupille vide
  for(const [ph,u,q] of IRU){const r0=mix(0.26,0.56,Math.sqrt(u));const stri=0.6+0.4*Math.sin(ph*38+q*3);const z=Math.sqrt(Math.max(0,1-(r0/RS)**2))*RS*0.985;
    const c=lerp3([0.15,1.0,0.85],[0.25,0.55,1.25],u);put([Math.cos(ph)*r0,Math.sin(ph)*r0,z],sc(c,stri*(0.55+0.35*(1-u))*(CUT>0?1:1.8)),1.3);}
  // cristallin
  for(const [x,y,z,q] of LEU){put([x*0.42,y*0.42,0.80+z*0.18],[0.16,0.22,0.30],1.0);}
  // nerf optique (part du disque vers l'arrière)
  for(const [u,ph,q] of NVU){const base=sc(D,RS*0.96);const len=u*1.9;const a=nrm([D[1],-D[0],0]);const b=[D[1]*a[2]-D[2]*a[1],D[2]*a[0]-D[0]*a[2],D[0]*a[1]-D[1]*a[0]];
    const r0=0.20+0.03*u;const p=add(add(base,sc(D,len)),add(sc(a,Math.cos(ph)*r0),sc(b,Math.sin(ph)*r0)));
    put(p,sc([1.0,0.70,0.30],(0.35+0.4*q)*(1-0.6*u)*(0.7+0.6*GLOW)*mix(0.18,1,CUT)),1.2,1);}
  upd(EYE);}
/* rayons de lumière : A → fovéa (s'allume), B → disque optique (s'éteint) */
const NRY=1600;const RAY=dyn(NRY,1.4);const RU=[];{const R=mulberry32(91);for(let i=0;i<NRY;i++)RU.push([R(),R()*2-1,R()*2-1,i%2]);}
let RAYON=0;
function buildRays(t){const RR=1.2*0.94;const fov=[0,0,-RR];const disc=sc(D,RR);
  for(let i=0;i<NRY;i++){const [q,dx,dy,b]=RU[i];let p=[0,-30,0],a=0;
    if(RAYON>0){const age=((t*0.55+q)%1);const tgt=b?disc:fov;const st=b?[-0.9+dx*0.25,0.55+dy*0.25,4.2]:[0.5+dx*0.25,-0.45+dy*0.25,4.2];
      const pu=[dx*0.12,dy*0.12,1.05];
      if(age<0.55){p=lerp3(st,pu,age/0.55);a=0.9;}else{const k=(age-0.55)/0.45;p=lerp3(pu,tgt,k);a=b?0.9*(1-sm(lin(k,0.75,1))):(0.9+1.4*sm(lin(k,0.85,1)));}
      p=rotY(p,YAW);a*=RAYON;}
    RAY.p.set(p,i*3);const c=b?[1.0,0.85,0.6]:[0.9,1.0,1.1];RAY.c.set(sc(c,a*0.9),i*3);RAY.z[i]=2.6;}
  upd(RAY);}
/* caméra par plans */
const SHOTS=[
 [0,2.6,[0,-1.5,7.4,0,-1.5,0],[0,-1.5,6.7,0,-1.5,0]],
 [2.6,10.3,[0,-1.5,6.7,0,-1.5,0],[0,-1.5,6.6,0,-1.5,0]],
 [10.3,15.6,[7.0,0.2,1.8,0,0.05,-0.5],[7.0,0.2,-0.6,0,0.05,-0.6]],
 [15.6,19.2,[6.2,0.1,-1.6,0,-0.05,-0.6],[5.8,0.1,-2.0,0,-0.05,-0.6]],
 [19.2,22.01,[0,-1.5,7.6,0,-1.5,0],[0,-1.5,7.1,0,-1.5,0]]];
function camAt(t){let s=SHOTS.find(q=>t>=q[0]&&t<q[1])||SHOTS[SHOTS.length-1];const k=sm(lin(t,s[0],s[1]))*0.85+lin(t,s[0],s[1])*0.15;
  const v=s[2].map((x,i)=>mix(x,s[3][i],k));cam.position.set(v[0],v[1],v[2]);cam.lookAt(v[3],v[4],v[5]);cam.updateMatrixWorld();
  const d=nrm([v[0]-v[3],0,v[2]-v[5]]);CUTDIR=d;}
function stateScene(t){
  EK=1;YAW=0;CUT=0;GLOW=0;FILL=0;RAYON=0;
  if(t<2.6){YAW=0.32*sm(lin(t,0.6,1.6));EK=1;}
  else if(t<10.3){YAW=0.32;EK=1-sm(lin(t,2.6,3.3));}
  else if(t<15.6){CUT=1;EK=sm(lin(t,10.3,10.8));RAYON=sm(lin(t,10.9,11.5));GLOW=sm(lin(t,12.6,13.3));}
  else if(t<19.2){CUT=1;GLOW=1-sm(lin(t,17.4,18.4));FILL=sm(lin(t,16.6,18.2));RAYON=0.5*(1-lin(t,15.6,16.4));}
  else{EK=sm(lin(t,19.2,19.7));YAW=0.32;FILL=1;}
  BG.o.visible=!(t>=3.0&&t<10.3);camAt(t);buildEye(t);buildRays(t);
  bloom.strength=0.7;}
/* textes */
const B=[
 {id:'h1',a:0,z:2.55,y:1090,L:[['sb','font-size:60px','Ce point rose va'],['bk','font-size:112px','<span class="ma">DISPARAÎTRE.</span>']]},
 {id:'i1',a:2.65,z:10.2,y:250,stg:0.9,L:[['bd','font-size:56px','<span class="cy">1.</span> Ferme l’œil <span class="go">gauche</span>'],['bd','font-size:56px','<span class="cy">2.</span> Fixe la <span class="cy">croix</span> de l’œil droit'],['bd','font-size:56px','<span class="cy">3.</span> Approche-toi <span class="go">lentement</span>']]},
 {id:'i2',a:5.6,z:10.2,y:1150,L:[['md','font-size:46px','Œil à ≈&nbsp;15-20&nbsp;cm de l’écran :'],['md','font-size:46px','avance et recule doucement.']]},
 {id:'i3',a:7.7,z:10.2,y:1275,L:[['bk','font-size:76px','Il a <span class="ma">disparu</span>&#8239;?']]},
