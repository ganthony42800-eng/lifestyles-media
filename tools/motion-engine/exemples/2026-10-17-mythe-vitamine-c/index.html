<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================== utilitaires déterministes ============================== */
const W=1080,H=1920,RW=720,RH=1280,SURF=9.0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-clamp(x),3);
const ein=x=>Math.pow(clamp(x),3);
const win=(t,a,b,f=0.15)=>clamp(Math.min((t-a)/f,(b-t)/f)+0.0001); // fenêtre douce

/* ============================== rendu ============================== */
const r=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
r.setPixelRatio(1); r.setSize(RW,RH,false); r.domElement.id='gl'; document.body.prepend(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0; r.transmissionResolutionScale=1.0;
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(r);
const envS=new THREE.Scene(); envS.background=new THREE.Color('#020308');
{const panel=(w,h,col,k,pos,look)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(col).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(...look);envS.add(m);};
 panel(6,9,'#ffffff',2.2,[-9,7,6],[0,0,0]);      // boîte à lumière clé
 panel(2.2,14,'#9FE8FF',4.5,[2,2,-10],[0,0,0]);  // bande de contre-jour cyan
 panel(1.2,12,'#ffffff',1.1,[9,1,3],[0,0,0]);    // liseré droit
 panel(10,3,'#9682FF',0.7,[0,10,0],[0,0,0]);     // plafond violet doux
 panel(30,30,'#0a0c1c',1,[0,-8,0],[0,0,0]);}
scene.environment=pm.fromScene(envS,0.02).texture; scene.environmentIntensity=1.0;
const cam=new THREE.PerspectiveCamera(40,RW/RH,0.004,200);

const NOISE=`
float hash3(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vnoise(p);p*=2.03;a*=0.5;}return s;}
`;

/* ---------- fond : dégradé nuit (air) / eau profonde + rayons (sous l'eau) ---------- */
const bgU={uUW:{value:0},uT:{value:0},uWarm:{value:0},uCold:{value:0}};
const bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:bgU,depthWrite:false,depthTest:false,
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.9999,1.0);}`,
 fragmentShader:NOISE+`varying vec2 vUv;uniform float uUW,uT,uWarm,uCold;
 void main(){vec2 p=vUv;vec2 q=(p-vec2(0.5,0.47))*vec2(1.0,1.75);
  // air : nuit bleu-violet + contre-jour froid derrière le verre
  vec3 air=mix(vec3(0.030,0.034,0.10),vec3(0.006,0.007,0.022),smoothstep(0.0,0.95,length(q)));
  float back=exp(-pow(length((p-vec2(0.5,0.5))*vec2(1.6,1.0))/0.30,2.0));
  air+=vec3(0.05,0.17,0.24)*back*(1.0+1.8*uCold);
  air+=vec3(0.035,0.02,0.07)*exp(-pow(length((p-vec2(0.2,0.8))*vec2(1.0,1.6))/0.35,2.0));
  // eau : dégradé vertical + rayons volumétriques qui défilent
  vec3 top=mix(vec3(0.05,0.24,0.32),vec3(0.20,0.15,0.08),uWarm);vec3 deep=mix(vec3(0.008,0.03,0.055),vec3(0.03,0.02,0.02),uWarm*0.6);
  vec3 wat=mix(deep,top,pow(p.y,1.6));
  float x=p.x+(1.0-p.y)*0.32;float rays=0.0;
  rays+=pow(0.5+0.5*sin(x*21.0+uT*0.35),6.0)*0.6;rays+=pow(0.5+0.5*sin(x*37.0-uT*0.22+1.7),8.0)*0.45;
  rays*=smoothstep(0.05,1.0,p.y)*(0.6+0.4*vnoise(vec3(x*6.0,p.y*2.0,uT*0.3)));
  wat+=mix(vec3(0.25,0.60,0.70),vec3(0.6,0.45,0.25),uWarm)*rays*0.16;
  wat*=0.82+0.18*vnoise(vec3(p*vec2(3.0,5.0),uT*0.15));
  gl_FragColor=vec4(mix(air,wat,uUW),1.0);}`}));
bg.frustumCulled=false; bg.renderOrder=-100; scene.add(bg);

/* ---------- lumières ---------- */
const key=new THREE.SpotLight('#ffffff',3.2,0,0.55,0.9,0); key.position.set(-9,17,11); key.target.position.set(0,8,0); scene.add(key,key.target);
const rim=new THREE.DirectionalLight('#9FE8FF',2.2); rim.position.set(1,7,-10); scene.add(rim);
const fill=new THREE.DirectionalLight('#9682FF',0.45); fill.position.set(8,4,6); scene.add(fill);
const tabLight=new THREE.PointLight('#FF9A4D',0,5,2); scene.add(tabLight);

/* ---------- verre (lathe) avec givre ---------- */
const frostU={uFrostLevel:{value:-5},uFrostAmt:{value:0}};
const outside=new THREE.Group(); scene.add(outside);
const prof=[[0,0],[2.72,0],[2.86,0.08],[2.9,0.25],[2.9,10.2],[2.88,10.28],[2.8,10.32],[2.72,10.28],[2.7,10.2],[2.7,0.95],[2.6,0.82],[0,0.8]].map(a=>new THREE.Vector2(a[0],a[1]));
const glassMat=new THREE.MeshPhysicalMaterial({color:'#ffffff',transmission:1,roughness:0.0,ior:1.5,thickness:0.35,
  attenuationColor:new THREE.Color('#CFEFFF'),attenuationDistance:4,clearcoat:1,clearcoatRoughness:0.03,specularIntensity:1,envMapIntensity:1.4,depthWrite:false,side:THREE.DoubleSide});
glassMat.onBeforeCompile=s=>{Object.assign(s.uniforms,frostU);
 s.fragmentShader=s.fragmentShader.replace('void main() {',NOISE+'uniform float uFrostLevel,uFrostAmt;\nfloat gFm=0.0;float gCr=0.0;\nvoid main() {')
 .replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
   { float n=fbm(vWorldPosition*2.2); gFm=uFrostAmt*smoothstep(uFrostLevel+0.5,uFrostLevel-0.5,vWorldPosition.y+(n-0.5)*1.6);
     float c=fbm(vWorldPosition*vec3(11.0,7.0,11.0)); gCr=pow(smoothstep(0.45,0.75,c),2.0)+0.12*pow(abs(sin((vWorldPosition.x+vWorldPosition.z)*23.0+n*9.0)),24.0);
     roughnessFactor=mix(roughnessFactor,0.55,gFm);}`)
 .replace('#include <opaque_fragment>',`outgoingLight=mix(outgoingLight,outgoingLight*0.55+vec3(0.80,0.93,1.0)*(0.20+0.65*gCr),gFm*0.88);
   #include <opaque_fragment>`);};
const glass=new THREE.Mesh(new THREE.LatheGeometry(prof,160),glassMat); outside.add(glass);

/* ---------- eau : corps + surface à ondes ---------- */
const waterMat=new THREE.MeshPhysicalMaterial({color:'#ffffff',transmission:1,roughness:0.03,ior:1.333,thickness:5,
  attenuationColor:new THREE.Color('#2A8FB0'),attenuationDistance:9,envMapIntensity:1.0,depthWrite:false});
const waterBody=new THREE.Mesh(new THREE.CylinderGeometry(2.68,2.68,SURF-0.82,128,1,true),waterMat); waterBody.position.y=(SURF+0.82)/2; outside.add(waterBody);
const impU={uImp:{value:[new THREE.Vector4(0,0.25,0.10,0.10),new THREE.Vector4(0,0,19.62,0.05),new THREE.Vector4(0,0,99,0)]},uT:{value:0}};
const surfMat=new THREE.MeshPhysicalMaterial({color:'#ffffff',transmission:1,roughness:0.06,specularIntensity:0.6,ior:1.333,thickness:0.4,envMapIntensity:1.0,depthWrite:false,
  attenuationColor:new THREE.Color('#2A8FB0'),attenuationDistance:9,side:THREE.DoubleSide});
const WAVE=`uniform vec4 uImp[3];uniform float uT;
float wave(vec2 p){float h=0.0;for(int i=0;i<3;i++){vec4 I=uImp[i];float dt=uT-I.z;if(dt>0.0&&I.w>0.0){float rr=length(p-I.xy);float fr=7.0*dt;
 float env=exp(-pow((rr-fr*0.9)/(0.5+dt*1.6),2.0))*exp(-dt*1.4)*I.w;h+=env*sin(13.0*(rr-fr));}}
 h+=0.007*sin(p.x*3.1+uT*1.7)+0.006*sin(p.y*2.7-uT*1.3)+0.004*sin((p.x+p.y)*5.3+uT*2.3);return h;}`;
surfMat.onBeforeCompile=s=>{Object.assign(s.uniforms,impU);
 s.vertexShader=s.vertexShader.replace('void main() {',WAVE+'\nvoid main() {')
 .replace('#include <beginnormal_vertex>',`float e0=0.02;float h0=wave(position.xz);vec3 objectNormal=normalize(vec3(-(wave(position.xz+vec2(e0,0.0))-h0)/e0,1.0,-(wave(position.xz+vec2(0.0,e0))-h0)/e0));`)
 .replace('#include <begin_vertex>','vec3 transformed=vec3(position);transformed.y+=h0;');};
const surfGeo=new THREE.RingGeometry(0.005,2.69,180,44); surfGeo.rotateX(-Math.PI/2);
const surf=new THREE.Mesh(surfGeo,surfMat); surf.position.y=SURF; outside.add(surf);
const menisc=new THREE.Mesh(new THREE.TorusGeometry(2.69,0.035,10,200),new THREE.MeshBasicMaterial({color:'#bfefff',transparent:true,opacity:0.22,toneMapped:false,depthWrite:false}));
menisc.rotation.x=Math.PI/2;menisc.position.y=SURF+0.01;outside.add(menisc);

/* ---------- filet d'eau (19,4 → 20,0) ---------- */
const stream=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,12,32,40,true),new THREE.MeshPhysicalMaterial({color:'#fff',transmission:1,roughness:0.02,ior:1.333,thickness:0.3,envMapIntensity:1.6,depthWrite:false}));
stream.material.onBeforeCompile=s=>{s.uniforms.uT=impU.uT;s.vertexShader=s.vertexShader.replace('void main() {','uniform float uT;\nvoid main() {')
 .replace('#include <begin_vertex>','vec3 transformed=vec3(position);float wob=1.0+0.25*sin(position.y*3.0-uT*30.0)+0.12*sin(position.y*7.1-uT*41.0);transformed.xz*=wob;');};
stream.visible=false; scene.add(stream);

/* ---------- comprimé effervescent gravé « VITAMINE C » ---------- */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.userData.redraw=()=>{const g=c.getContext('2d');g.clearRect(0,0,w,h);g.letterSpacing='0px';draw(g,w,h);t.needsUpdate=true;};return t;}
const rng=mulberry32(7);
function powder(g,w,h,base,R){g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<w*h/7;i++){const x=R()*w,y=R()*h,v=R();g.fillStyle=v<.5?`rgba(120,40,0,${.05+v*.12})`:`rgba(255,235,200,${(v-.5)*.22})`;g.fillRect(x,y,1.6,1.6);}}
const bumpTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#808080';g.fillRect(0,0,w,h);for(let i=0;i<40000;i++){const v=Math.floor(90+rng()*90);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(rng()*w,rng()*h,2,2);}});
bumpTex.colorSpace=THREE.NoColorSpace; bumpTex.wrapS=bumpTex.wrapT=THREE.RepeatWrapping;
const faceTex=canvasTex(1024,1024,(g,w,h)=>{const R=mulberry32(7);powder(g,w,h,'#EC7426',R);
  const grd=g.createRadialGradient(512,470,60,512,512,520);grd.addColorStop(0,'rgba(255,190,110,.25)');grd.addColorStop(1,'rgba(150,50,0,.25)');g.fillStyle=grd;g.fillRect(0,0,w,h);
  g.textAlign='center';g.textBaseline='alphabetic';
  const txt=(s,y,size,ls)=>{g.font=`${size}px IDBk`;g.letterSpacing=ls+'px';
    g.fillStyle='rgba(255,226,180,.85)';g.fillText(s,512+4,y+5);   // arête éclairée (bas du creux)
    g.fillStyle='rgba(70,18,0,.95)';g.fillText(s,512-3,y-3);       // ombre (haut du creux)
    g.fillStyle='#9A3A0C';g.fillText(s,512,y);};
  txt('VITAMINE',470,150,2); txt('C',800,300,0);
  g.lineWidth=7;g.strokeStyle='rgba(90,25,0,.55)';g.beginPath();g.arc(512,512,478,0,Math.PI*2);g.stroke();
  g.lineWidth=3;g.strokeStyle='rgba(255,220,170,.5)';g.beginPath();g.arc(512,515,483,0,Math.PI*2);g.stroke();});
const faceBump=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.textAlign='center';g.fillStyle='#000';
  g.font='150px IDBk';g.letterSpacing='2px';g.fillText('VITAMINE',512,470);g.letterSpacing='0px';g.font='300px IDBk';g.fillText('C',512,800);
  g.lineWidth=7;g.strokeStyle='#000';g.beginPath();g.arc(512,512,478,0,Math.PI*2);g.stroke();});
faceBump.colorSpace=THREE.NoColorSpace;
const dissU={uDiss:{value:0}};
function dissolvable(m){m.onBeforeCompile=s=>{s.uniforms.uDiss=dissU.uDiss;
  s.vertexShader=s.vertexShader.replace('void main() {','varying vec3 vObj;\nvoid main() {').replace('#include <begin_vertex>','#include <begin_vertex>\nvObj=position;');
  s.fragmentShader=s.fragmentShader.replace('void main() {',NOISE+'varying vec3 vObj;uniform float uDiss;float gEdge=0.0;\nvoid main() {')
   .replace('#include <clipping_planes_fragment>',`#include <clipping_planes_fragment>
     float dn=fbm(vObj*3.2)*0.55+length(vObj.xy)/1.25*0.5; if(dn<uDiss*1.05) discard; gEdge=1.0-smoothstep(0.0,0.06,dn-uDiss*1.05); gEdge*=step(0.001,uDiss);`)
   .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\ntotalEmissiveRadiance+=vec3(1.0,0.71,0.28)*gEdge*4.0;');};}
const tab=new THREE.Group(); scene.add(tab);
const tabProf=[[0,-0.2],[1.15,-0.2],[1.22,-0.17],[1.25,-0.1],[1.25,0.1],[1.22,0.17],[1.15,0.2],[0,0.2]].map(a=>new THREE.Vector2(a[0],a[1]));
const tabGeo=new THREE.LatheGeometry(tabProf,96); tabGeo.rotateX(Math.PI/2);
const tabMat=new THREE.MeshPhysicalMaterial({color:'#E8732A',roughness:0.9,sheen:0.35,sheenColor:new THREE.Color('#FFD39A'),sheenRoughness:0.6,bumpMap:bumpTex,bumpScale:1.2,envMapIntensity:0.6});
dissolvable(tabMat); tab.add(new THREE.Mesh(tabGeo,tabMat));
const faceGeo=new THREE.CircleGeometry(1.155,96); faceGeo.translate(0,0,0.201);
const faceMat=new THREE.MeshPhysicalMaterial({map:faceTex,roughness:0.88,sheen:0.3,sheenColor:new THREE.Color('#FFD39A'),bumpMap:faceBump,bumpScale:3.0,envMapIntensity:0.6});
dissolvable(faceMat); tab.add(new THREE.Mesh(faceGeo,faceMat));
const backGeo=faceGeo.clone(); backGeo.rotateY(Math.PI); tab.add(new THREE.Mesh(backGeo,tabMat));
const TAB0=new THREE.Vector3(0,10.45,0.25), TABROT0=new THREE.Euler(-0.21,0,0.0);
function tabletState(t){ // position / rotation / dissolution
  const p=TAB0.clone(), rot=TABROT0.clone(); let vis=true, d=0;
  if(t<=0){} else if(t<26){
    if(t<0.15){p.y=TAB0.y-20*t*t;}
    else{const u=t-0.15;p.y=TAB0.y-0.45-1.2*(1-Math.exp(-5*u))-0.9*u;}
    const u=Math.max(0,t-0.1);rot.x=-0.21-0.55*(1-Math.exp(-u*1.4));rot.y=0.44*u;rot.z=0.18*u;p.x=0.15*Math.sin(u*1.3);
    d=0.36*sm(lin(t,0.3,3.2))+0.7*sm(lin(t,3.2,3.62)); vis=t<3.66;
  } else { const k=lin(t,26.6,27.0); p.y=TAB0.y+5.0*Math.pow(1-k,3); rot.x=-0.21+0.5*Math.pow(1-k,2); rot.y=-0.6*Math.pow(1-k,2); vis=t>26.6; }
  return {p,rot,vis,d};}

/* ---------- matière « verre cyan lumineux » (SCIENCE, icône, tubes) ---------- */
function glowGlass(glowColor,glow,opts={}){const u={uGlow:{value:glow}};
  const m=new THREE.MeshPhysicalMaterial(Object.assign({color:'#dffcff',transmission:1,roughness:0.06,ior:1.45,thickness:0.45,
    attenuationColor:new THREE.Color(glowColor),attenuationDistance:0.5,clearcoat:1,clearcoatRoughness:0.05,envMapIntensity:1.6},opts));
  const gc=new THREE.Color(glowColor);
  m.onBeforeCompile=s=>{s.uniforms.uGlow=u.uGlow;s.fragmentShader=s.fragmentShader.replace('void main() {','uniform float uGlow;\nvoid main() {')
   .replace('#include <opaque_fragment>',`{float fr=pow(1.0-abs(dot(normalize(vViewPosition),normal)),2.2);outgoingLight+=vec3(${gc.r.toFixed(3)},${gc.g.toFixed(3)},${gc.b.toFixed(3)})*(0.22+2.2*fr)*uGlow;}
   #include <opaque_fragment>`);};
  m.userData.u=u;return m;}
const under=new THREE.Group(); scene.add(under);

/* SCIENCE en lettres 3D extrudées */
const GL=await (await fetch('glyphes.json')).json();

  icon.position.set(R_POS.x,R_POS.y+0.55*sm(lin(t,22.0,22.6)),R_POS.z);
  // carte
  card.visible=t>23.9&&t<25.62;
  const ck=eout(lin(t,23.95,24.3))*(1-eio(lin(t,25.3,25.6)));const flip=lin(t,24.4,24.9);const fl=flip<1?eio(flip)*1.06-0.06*Math.sin(flip*Math.PI):1;
  const settle=t>24.9?0.06*Math.exp(-(t-24.9)*7)*Math.sin((t-24.9)*30):0;
  card.scale.setScalar(Math.max(ck*0.6,0.001));card.rotation.set(0.05*Math.sin(t*0.7),Math.PI*fl+settle,0.02*Math.sin(t*0.9));
  card.position.set(R_POS.x,R_POS.y-0.4+ (t>25.3?(t-25.3)*(t-25.3)*1.4:0),R_POS.z);
  faceA.visible=Math.cos(card.rotation.y)>0;faceB.visible=!faceA.visible;
  // bloom (flash 16,2)
  const fl2=Math.exp(-Math.pow((t-16.24)/0.09,2));bloom.strength=0.42+0.9*fl2+0.6*Math.exp(-Math.pow((t-4.08)/0.1,2));
  fin.uniforms.uFlash.value.set(0.10,0.42,0.40).multiplyScalar(fl2*0.55);
  fin.uniforms.uT.value=t;fin.uniforms.uFrame.value=Math.round(t*30);
  fin.uniforms.uCross.value=cross;
  // ligne de surface : descend quand on remonte, monte quand on plonge
  const goingUp=(t>13.8&&t<15)||(t>25.2);fin.uniforms.uCrossY.value=goingUp?mix(1.05,-0.05,clamp((cam.position.y-SURF+0.45)/0.9)):mix(-0.05,1.05,clamp((SURF+0.45-cam.position.y)/0.9));
  fin.uniforms.uDrops.value=t>14.55&&t<15.6?1-lin(t,15.0,15.6):0;
  fillBubbles(t);
}

/* ============================== animation du texte ============================== */
function blkState(b,t){for(const [a,z] of b.iv){if(t>=a-0.25&&t<=z+0.6)return {a,z};}return null;}
function styleText(t){
  for(const b of B){const el=b.el;const s=blkState(b,t);if(!s){el.style.opacity=0;continue;}
    const {a,z}=s;let op=1,ty=0,bl=0,clip=0,sc=1;
    if(a>0){const e=eout(lin(t,a,a+0.38));clip=1-e;ty=(1-e)*34;bl=(1-e)*10;op=lin(t,a-0.02,a+0.12);if(b.pop){sc=mix(1.35,1,eout(lin(t,a,a+0.3)));clip=0;op=lin(t,a,a+0.06);bl=(1-eout(lin(t,a,a+0.25)))*14;}}
    if(t>z-0.05){const x=lin(t,z-0.05,z+0.25);ty-=x*48;op*=1-x;bl+=x*8;}
    if(b.id==='mythe'&&t>3.12){op=1-lin(t,3.14,3.24);}
    if(b.anchor){const p=anchorPos(b.anchor);el.style.left=(p.x-450)+'px';el.style.top=(p.y-el.offsetHeight/2)+'px';}
    el.style.opacity=op.toFixed(3);
    el.style.transform=`translateY(${ty.toFixed(1)}px) scale(${sc.toFixed(4)})`;
    el.style.filter=bl>0.05?`blur(${bl.toFixed(2)}px)`:'none';
    el.style.clipPath=clip>0.001?`inset(${(clip*100).toFixed(1)}% -30% -30% -30%)`:'none';}
  // barre rouge sur MYTHE
  const st=document.getElementById('strike');const sk=eio(lin(t,0.4,0.6));
  st.style.opacity=(t<0.4||t>3.24)?0:(1-lin(t,3.14,3.24)).toFixed(3);st.style.transform=`rotate(-2.2deg) scaleX(${sk.toFixed(4)})`;
  // compteur
  setOdo(Math.round(11306*eout(lin(t,4.0,4.85))*100)/100);
  const sp=t>4.0&&t<4.85?(1-lin(t,4.0,4.85)):0;odo.style.filter=sp>0.05?`blur(${(sp*3).toFixed(1)}px)`:'none';
  // 97 qui suit le remplissage
  let n97=0;for(let i=0;i<97;i++){const rw=Math.floor(i/10),c=i%10;if(t>=5.55+rw*0.085+c*0.004+0.06)n97++;}document.getElementById('c97').textContent=n97;
  // signatures
  const big=win(t,25.45,26.6,0.16);document.getElementById('sigS').style.opacity=(1-big).toFixed(3);
  const sb=document.getElementById('sigB');sb.style.opacity=big.toFixed(3);
  const p=lin(t,25.5,26.0);sb.querySelector('img').style.webkitMaskImage=sb.querySelector('img').style.maskImage=`linear-gradient(100deg,#000 ${(p*140-20).toFixed(1)}%,transparent ${(p*140).toFixed(1)}%)`;
  document.getElementById('shine').style.backgroundPosition=`${(100-lin(t,25.55,26.25)*100).toFixed(1)}% 0`;
  // MYTHE ? → MYTHE (boucle)
  const mq=document.getElementById('b_mq');const qm=document.getElementById('qm');const qk=eio(lin(t,26.5,26.9));
  qm.style.maxWidth=(160*(1-qk)).toFixed(1)+'px';qm.style.opacity=(1-qk).toFixed(3);
  const ps=1+0.03*Math.sin((t-25.5)*9)*(1-qk);
  if(t>25.5){mq.style.transform+=` scale(${(mix(0.8,1,qk)*ps).toFixed(4)})`;}
}
function anchorPos(n){
  if(n==='tubeA')return toScreen(new THREE.Vector3(T_A.x,T_A.y+0.42,T_A.z));
  if(n==='labA'){const p=toScreen(new THREE.Vector3(T_A.x+TUBE_L/2-0.2,tubeA.position.y+0.42,T_A.z));p.x-=10;return p;}
  if(n==='labE'){const p=toScreen(new THREE.Vector3(T_A.x+TUBE_L/2-0.35,tubeE.position.y-0.44,T_A.z));p.x-=10;return p;}
  if(n==='ring')return toScreen(R_POS);
  if(n==='gridL'){const p=toScreen(new THREE.Vector3(G_L.x,G_L.y+5*PITCH+0.06,G_L.z));p.y-=46;return p;}
  if(n==='gridR'){const p=toScreen(new THREE.Vector3(G_R.x,G_R.y+5*PITCH+0.06,G_R.z));p.y-=52;return p;}
  return {x:540,y:960};}

/* ============================== particules 2D (entrées / sorties en bulles) ============================== */
function drawSpr(x,y,s,col,a){if(a<=0.01||s<0.4)return;g2.globalAlpha=Math.min(1,a);g2.drawImage(SPR[col],x-s,y-s,s*2,s*2);}
function drawFx(t){g2.clearRect(0,0,W,H);
  for(const b of B){if(!b.pts||!b.pts.length)continue;const s=blkState(b,t);if(!s)continue;const {a,z}=s;
    if(a>0){const e0=a-0.22;if(t>e0&&t<a+0.42){for(const p of b.pts){const e=lin(t,e0+p.r*0.18,a+0.22+p.r*0.18);if(e<=0||e>=1)continue;const k=eout(e);
        const x=p.x+(p.r2-0.5)*70*(1-k),y=p.y+(80+p.r3*90)*(1-k);drawSpr(x,y,2.5+p.r2*5,b.pc,Math.sin(Math.PI*e)*0.9);}}}
    if(z<90&&t>z-0.08&&t<z+0.7&&b.id!=='mythe'){for(const p of b.pts){const e=lin(t,z-0.08+p.r*0.12,z+0.5+p.r*0.12);if(e<=0||e>=1)continue;
        const x=p.x+Math.sin(e*6+p.r2*6)*12+(p.r2-0.5)*40*e,y=p.y-e*(120+p.r3*160);drawSpr(x,y,(2+p.r2*5)*(1-e*0.6),b.pc,(1-e)*0.9);}}}
  // MYTHE pétille dès qu'il est barré
  if(t>0.45&&t<3.25){for(let k=0;k<340;k++){const p=MY_PTS[(k*7)%MY_PTS.length];const b0=0.45+k*0.0082;const e=(t-b0)/0.75;if(e<=0||e>=1)continue;
      drawSpr(p.x+Math.sin(e*7+k)*6,p.y-e*90,2+p.r*3.5,OR,(1-e)*0.85);}}
  if(t>26.7&&t<27.1){for(let k=0;k<120;k++){const p=MY_PTS[(k*11)%MY_PTS.length];const e=((t-26.7)*2.4+p.r)%1;drawSpr(p.x,p.y-e*80,2+p.r*3,OR,(1-e)*0.6);}}
  // MYTHE → bulles qui plongent → SCIENCE (3,2 → 4,1)
  if(t>3.12&&t<4.3){const N=Math.min(MY_PTS.length,SCI_PTS.length);
    for(let i=0;i<N;i++){const p=MY_PTS[i],q=SCI_PTS[i];const d0=3.14+p.x/W*0.16+p.r*0.05;const u=lin(t,d0,d0+0.82);if(u<=0)continue;const k=eio(u);
      const cx=mix(p.x,q.x,0.5)+(p.r2-0.5)*520,cy=Math.max(p.y,q.y)+520+p.r3*420;
      const x=(1-k)*(1-k)*p.x+2*k*(1-k)*cx+k*k*q.x,y=(1-k)*(1-k)*p.y+2*k*(1-k)*cy+k*k*q.y;
      const col=u<0.42?OR:CY;const fade=1-lin(t,3.98+p.r*0.08,4.2+p.r*0.08);
      drawSpr(x,y,2.4+p.r*4.5+Math.sin(Math.PI*u)*3,col,fade*(0.55+0.45*Math.sin(Math.PI*Math.min(u*1.5,1))));}}
  g2.globalAlpha=1;}

/* ============================== entrée publique ============================== */
window.renderAt=(t)=>{sceneState(t);styleText(t);comp.render();drawFx(t);};
window.sceneReady=(async()=>{await document.fonts.load('100px IDBk');await document.fonts.load('100px IDSb');await document.fonts.load('100px IDMd');await document.fonts.ready;
  // re-dessin des textures qui dépendent des polices
  for(const tx of [faceTex,faceBump,cardFront,cardBack])tx.userData.redraw();
  // échantillonnage (sans transformations)
  for(const b of B){b.el.style.opacity=0;b.el.style.transform='none';}
  for(const b of B){if(b.anchor){b.pts=[];continue;}const n=b.np!=null?b.np:Math.min(140,Math.max(50,Math.round(b.el.textContent.length*4)));b.pts=n?samplePts(b.el,n,b.id.length*97+b.y):[];}
  MY_PTS=samplePts(mythe,2600,11);
  // cibles SCIENCE : projection du mot 3D à t=4,1
  cameraAt(4.12);sciGroup.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(sciGroup);
  const c1=toScreen(new THREE.Vector3(bb.min.x,bb.min.y,SCI_POS.z+0.16)),c2=toScreen(new THREE.Vector3(bb.max.x,bb.max.y,SCI_POS.z+0.16));
  const sc=document.createElement('canvas');sc.width=W;sc.height=H;const g=sc.getContext('2d');g.fillStyle='#fff';g.font='200px IDBk';g.letterSpacing='-3px';
  const mw=g.measureText('SCIENCE').width;const fs=200*(c2.x-c1.x)/mw;g.font=`${fs}px IDBk`;g.textBaseline='alphabetic';g.fillText('SCIENCE',c1.x,c1.y);
  const im=g.getImageData(0,0,W,H).data;const pts=[];for(let y=0;y<H;y+=3)for(let x=0;x<W;x+=3)if(im[(y*W+x)*4+3]>140)pts.push({x,y});
  const R1=mulberry32(5);for(let i=pts.length-1;i>0;i--){const j=Math.floor(R1()*(i+1));[pts[i],pts[j]]=[pts[j],pts[i]];}
  SCI_PTS=[];for(let i=0;i<MY_PTS.length;i++)SCI_PTS.push(pts[i%pts.length]);
  window.renderAt(0);})();
</script></body></html>
