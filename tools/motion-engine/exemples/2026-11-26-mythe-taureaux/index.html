<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ép. 15 — taureau en particules dans une arène de nuit : il gratte le sol face à la muleta rouge (MYTHE) → vue partagée
   toi / le taureau (2 types de cônes, le rouge devient olive) ; il charge aussi la capote magenta et or ; test MythBusters :
   3 drapeaux immobiles = rien, agités = charge ; pourquoi rouge : tradition, masque le sang. */
const RW=720,RH=1280;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ein=x=>Math.pow(clamp(x),3);
const eback=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const springE=p=>p>=1?1:(p<=0?0:1-Math.exp(-5.2*p)*Math.cos(8.6*p));
const TAU=Math.PI*2;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];const sc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};const lerp3=(a,b,k)=>[mix(a[0],b[0],k),mix(a[1],b[1],k),mix(a[2],b[2],k)];

const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1);r.setSize(RW,RH,false);r.domElement.id='gl';document.body.prepend(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;
const S=new THREE.Scene();S.background=new THREE.Color('#07050A');
const cam=new THREE.PerspectiveCamera(55,RW/RH,0.02,80);
const comp=new EffectComposer(r);comp.setPixelRatio(1);comp.setSize(RW,RH);
comp.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(RW,RH),0.8,0.55,0.14);comp.addPass(bloom);
comp.addPass(new OutputPass());

const U={uH:{value:RH}};
const VS=`uniform float uH;attribute vec3 aCol;attribute float aSz;varying vec3 vC;
 void main(){vC=aCol;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=clamp(aSz*uH*0.0050/(-mv.z),1.0,16.0);}`;
const FS=`varying vec3 vC;void main(){vec2 q=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(q));gl_FragColor=vec4(vC*a,1.0);}`;
const mat=()=>new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
function dyn(n,sz){const g=new THREE.BufferGeometry();const p=new Float32Array(n*3),c=new Float32Array(n*3),z=new Float32Array(n).fill(sz||1);
  g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('aCol',new THREE.BufferAttribute(c,3));g.setAttribute('aSz',new THREE.BufferAttribute(z,1));
  const o=new THREE.Points(g,mat());o.frustumCulled=false;S.add(o);return {g,p,c,z,o,n};}
const upd=D=>{D.g.attributes.position.needsUpdate=true;D.g.attributes.aCol.needsUpdate=true;D.g.attributes.aSz.needsUpdate=true;};

const LD=nrm([-0.3,0.8,0.55]);      // projecteurs
const RIM=nrm([0.7,0.35,-0.6]);     // contre-jour chaud
const SAND=[0.66,0.48,0.30];
function shade(n,base,rimK){const d=Math.max(0,n[0]*LD[0]+n[1]*LD[1]+n[2]*LD[2]);const rm=Math.pow(Math.max(0,n[0]*RIM[0]+n[1]*RIM[1]+n[2]*RIM[2]),2)*(rimK||1);
  return [base[0]*(0.36+0.85*d)+rm*0.62,base[1]*(0.36+0.85*d)+rm*0.40,base[2]*(0.36+0.85*d)+rm*0.22];}
/* vision du taureau (simulation dichromate : 2 cônes, S ≈ 450 nm et M/L ≈ 553 nm) appliquée côté z>0 pendant la vue partagée */
let SPLIT=0;
function see(pos,c){if(SPLIT<=0||pos[2]<=0)return c;const y=0.567*c[0]+0.433*c[1];const v=[y*0.72,(0.558*c[0]+0.442*c[1])*0.72,0.242*c[1]+0.758*c[2]];return lerp3(c,v,SPLIT);}

/* ---------- arène : sable, barrière, gradins (bokeh) ---------- */
const NG=15000;const GROUND=dyn(NG,1.1);const GP=[];{const R=mulberry32(1515);for(let i=0;i<NG;i++){const a=R()*TAU,rr=6.2*Math.sqrt(R());GP.push([Math.cos(a)*rr+1.2,Math.sin(a)*rr*0.9-0.8,R()]);}}
const NW=5200;const WALL=dyn(NW,1.4);{const R=mulberry32(88);for(let i=0;i<NW;i++){const a=R()*TAU,h=R()*1.05;const x=1.2+Math.cos(a)*6.3,z=-0.8+Math.sin(a)*6.3*0.9;
  const band=h>0.92?1:0;WALL.p.set([x,h,z],i*3);const k=0.30+0.12*R();WALL.c.set(band?[0.7*k*1.4,0.6*k*1.4,0.5*k*1.4]:[0.62*k,0.10*k,0.07*k],i*3);}upd(WALL);}
const WCOL=new Float32Array(WALL.c);
const NCR=2600;const CROWD=dyn(NCR,2.2);{const R=mulberry32(19);for(let i=0;i<NCR;i++){const a=R()*TAU,rr=7.2+R()*4.5;const h=1.5+(rr-7.2)*0.9+R()*0.4;
  CROWD.p.set([1.2+Math.cos(a)*rr,h,-0.8+Math.sin(a)*rr*0.9],i*3);const k=0.04+0.16*R()**3;const w=R();CROWD.c.set([k*(0.9+0.1*w),k*(0.62+0.2*w),k*0.35],i*3);}upd(CROWD);}
const NM=600;const MOTE=dyn(NM,1.3);const MD=[];{const R=mulberry32(55);for(let i=0;i<NM;i++)MD.push([R()*2-1,R()*2-1,R()*2-1,R()]);}

/* ---------- tissus : muleta (rouge), capote (magenta / or), 3 drapeaux ---------- */
function cloth(nw,nh,sz){const D=dyn(nw*nh,sz||1.2);D.nw=nw;D.nh=nh;return D;}
const MUL=cloth(64,44,1.25),CAP=cloth(84,56,1.25);const FL=[cloth(30,20,1.15),cloth(30,20,1.15),cloth(30,20,1.15)];
const POLE=dyn(3*160,1.0);
const FLC=[[0.85,0.07,0.06],[0.10,0.26,0.95],[0.92,0.92,0.95]];
function drawCloth(D,ctr,W,H,vis,colFn,waveA,t,phase,sweepZ){let n=0;
  for(let j=0;j<D.nh;j++)for(let i=0;i<D.nw;i++){const u=i/(D.nw-1),v=j/(D.nh-1);// v=0 en haut
    const z=ctr[2]+(u-0.5)*W+(sweepZ||0)*v*v;const y=ctr[1]-v*H*(1-0.08*Math.sin(t*2+u*3)*waveA);
    const dx=waveA*(0.16*Math.sin(u*5.2+t*7.5+phase)*(0.25+v)+0.06*Math.sin(u*11+v*6-t*11+phase));
    const x=ctr[0]+dx;const nx=nrm([-1,0,-0.6*waveA*Math.cos(u*5.2+t*7.5+phase)]);
    const pos=[x,y,z];const col=shade(nx,colFn(u,v,dx),0.9);D.p.set(pos,n*3);D.c.set(see(pos,sc(col,vis)),n*3);n++;}
  upd(D);}

/* ---------- taureau ---------- */
const NBO=9000,NHU=2400,NNK=1600,NHE=1500,NHO=700,NLG=2400,NTL=300;
const BULL=dyn(NBO+NHU+NNK+NHE+NHO+NLG+NTL,1.2);const OR=mulberry32(1515);
const SPH=n=>{const a=[];for(let i=0;i<n;i++){const th=Math.acos(2*OR()-1),ph=OR()*TAU;a.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph),OR()]);}return a;};
const BOU=SPH(NBO),HUU=SPH(NHU),HEU=SPH(NHE);
const NKU=[];for(let i=0;i<NNK;i++)NKU.push([OR(),OR()*TAU,OR()]);
const HOU=[];for(let i=0;i<NHO;i++)HOU.push([i%2,OR(),OR()*TAU]);
const LGU=[];for(let i=0;i<NLG;i++)LGU.push([i%4,OR()<0.5?0:1,OR(),OR()*TAU]);
const TLU=[];for(let i=0;i<NTL;i++)TLU.push([OR(),OR()*TAU,OR()]);
const BLK=[0.19,0.16,0.16];
function ik(hip,foot,l1,l2,bend){const dx=foot[0]-hip[0],dy=foot[1]-hip[1];let d=Math.hypot(dx,dy);d=Math.min(d,l1+l2-1e-3);
  const a=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));const base=Math.atan2(dy,dx);const ang=base+a*bend;return [hip[0]+Math.cos(ang)*l1,hip[1]+Math.sin(ang)*l1,hip[2]];}
let BX=0,HEADK=1,GALLOP=0,PAW=0;
function buildBull(t){let n=0;const put=(p,c,s)=>{const pos=[p[0]+BX,p[1],p[2]];BULL.p.set(pos,n*3);BULL.c.set(see(pos,c),n*3);BULL.z[n]=s||1.2;n++;};
  const bob=GALLOP*0.05*Math.abs(Math.sin(t*9));const BC=[0,0.98+bob,0];
  for(const [x,y,z,q] of BOU){put([BC[0]+x*0.80,BC[1]+y*0.40,BC[2]+z*0.36],shade([x,y,z],BLK,1.6),1.35);}
  const HU=[0.42,1.20+bob,0];for(const [x,y,z,q] of HUU){put([HU[0]+x*0.36,HU[1]+y*0.24,z*0.34],shade([x,y,z],BLK,1.7),1.35);}
  // tête : abaissée (charge) ou relevée
  const H=lerp3([1.0,1.10+bob,0],[1.08,0.70+bob,0],HEADK);const N0=[0.62,1.08+bob,0];
  const ax=nrm([H[0]-N0[0],H[1]-N0[1],0]);
  for(const [u,a,q] of NKU){const b=lerp3(N0,H,u);const rr=mix(0.24,0.15,u);const nv=[Math.cos(a)*-ax[1],Math.cos(a)*ax[0],Math.sin(a)];put(add(b,sc(nv,rr)),shade(nv,BLK,1.5),1.25);}
  const hd=nrm(lerp3([1,-0.15,0],[0.55,-0.85,0],HEADK));const hu=[-hd[1],hd[0],0];
  for(const [x,y,z,q] of HEU){const pos=add(add(add(H,sc(hd,x*0.22+0.10)),sc(hu,y*0.13)),[0,0,z*0.13]);const muzzle=x>0.55;
    put(pos,shade(nrm(add(add(sc(hd,x),sc(hu,y)),[0,0,z])),muzzle?[0.30,0.24,0.22]:BLK,1.4),1.15);}
  // cornes ivoire
  for(const [side,u,a] of HOU){const sz=side?1:-1;const P0=add(add(H,sc(hu,0.10)),[0,0,0.10*sz]);const P1=add(P0,[0.02,0.03,0.20*sz]);const P2=add(P1,add(sc(hd,0.16),sc(hu,0.20)));
    const b=[0,1,2].map(i=>(1-u)*(1-u)*P0[i]+2*(1-u)*u*P1[i]+u*u*P2[i]);const rr=mix(0.034,0.004,u);
    put(add(b,[Math.cos(a)*rr,Math.sin(a)*rr,Math.sin(a+1)*rr]),u>0.8?[0.35,0.30,0.25]:shade(nrm([Math.cos(a),Math.sin(a),0.4]),[0.92,0.86,0.70],0.8),0.95);}
  // pattes
  const L=[];for(let k=0;k<4;k++){const front=k<2,side=k%2?1:-1;const hip=[front?0.50:-0.52,0.80+bob,0.17*side];
    let foot=[hip[0]+(front?0.04:-0.02),0,hip[2]];
    if(GALLOP>0){const ph=t*9+(front?0:Math.PI*0.9)+(side>0?0.5:0);foot=[hip[0]+0.26*Math.cos(ph),Math.max(0,0.17*Math.sin(ph)),hip[2]];}
    if(PAW>0&&k===0){const ph=(t*3.2)%1;foot=[hip[0]+0.10-0.30*ph,0.10*Math.sin(ph*Math.PI),hip[2]];}
    L.push({hip,knee:ik(hip,foot,0.40,0.42,front?-1:1),foot});}
  for(const [k,seg,u,a] of LGU){const l=L[k];const A=seg?l.knee:l.hip,B=seg?l.foot:l.knee;const rr=seg?mix(0.05,0.04,u):mix(0.10,0.055,u);
    put(add(lerp3(A,B,u),[Math.cos(a)*rr,Math.sin(a)*rr*0.3,Math.sin(a)*rr]),shade(nrm([Math.cos(a),0,Math.sin(a)]),u>0.92&&seg?[0.10,0.09,0.09]:[0.26,0.22,0.21],1.9),1.25);}
  // queue
  for(const [u,a,q] of TLU){const sw=0.06*Math.sin(t*2.2+u*2);const p=[-0.80-0.10*u,1.18-0.72*u,sw*u];const rr=u>0.85?0.05:0.015;put(add(p,[Math.cos(a)*rr,0,Math.sin(a)*rr]),shade([0,0,1],BLK,1.3),1.0);}
  for(let i=n;i<BULL.n;i++)BULL.c.set([0,0,0],i*3);upd(BULL);
  return L;}

/* ---------- caméra : plans ---------- */
const SHOTS=[
 [0,4.45,[0.4,1.70,6.6,0.6,1.12,0],[0.5,1.55,5.9,0.65,1.08,0]],
 [4.45,8.45,[0.45,1.52,0.05,1.95,1.18,0],[0.70,1.47,0.05,1.95,1.18,0]],
 [8.45,12.45,[0.6,1.75,6.6,0.85,1.12,0],[0.75,1.60,6.0,0.95,1.08,0]],
 [12.45,17.95,[0.6,1.95,6.8,0.8,1.08,0],[0.8,1.80,6.2,1.0,1.05,0]],
 [17.95,21.25,[0.75,1.50,2.4,1.95,1.18,0],[0.95,1.40,2.0,1.95,1.15,0]],

function camAt(t){let s=SHOTS.find(q=>t>=q[0]&&t<q[1])||SHOTS[SHOTS.length-1];const k=sm(lin(t,s[0],s[1]))*0.85+lin(t,s[0],s[1])*0.15;
  const v=s[2].map((x,i)=>mix(x,s[3][i],k));cam.position.set(v[0],v[1],v[2]);cam.lookAt(v[3],v[4],v[5]);cam.updateMatrixWorld();}

const MULC=(u,v,dx)=>[0.88,0.06,0.05];
const CAPC=(u,v,dx)=>(v>0.86||dx>0.05)?[0.95,0.70,0.18]:[0.92,0.12,0.55];
function stateScene(t){
  SPLIT=(t>=4.45&&t<8.45)?sm(lin(t,5.0,5.8)):0;
  GALLOP=((t>=9.0&&t<10.6)||(t>=15.0&&t<16.7))?1:0;
  PAW=(t<4.45)?1:0;
  BX=t<8.45?0:t<12.45?0.8*eio(lin(t,9.0,10.6)):t<17.95?0.85*eio(lin(t,15.0,16.7)):0;
  HEADK=(t>=12.45&&t<15.0)||t>=21.25?0.15:1;
  if(t>=14.6&&t<15.0)HEADK=mix(0.15,1,lin(t,14.6,15.0));
  const L=buildBull(t);
  // muleta : plans 1, 2, 5
  const mv=(t<8.45||(t>=17.95&&t<21.25))?1:0;
  drawCloth(MUL,[1.95,1.55,0],1.25,0.88,mv,MULC,t<8.45?1:0.7,t,0,0);
  // capote : plan 3, balayée sur le côté quand le taureau arrive
  const cv=(t>=8.45&&t<12.45)?1:0;
  drawCloth(CAP,[2.05,1.55,0],1.5,1.05,cv,CAPC,1.1,t,1.3,-1.2*eio(lin(t,9.8,10.8)));
  // drapeaux : plan 4 (immobiles puis agités)
  const fv=(t>=12.45&&t<17.95)?1:0;const wav=sm(lin(t,14.6,14.9));
  let pn=0;for(let f=0;f<3;f++){const z0=-1.0+f*1.0;const tilt=wav*0.25*Math.sin(t*6+f*2.1);
    for(let i=0;i<160;i++){const u=i/159;const pos=[2.25+Math.sin(tilt)*u*1.45,u*1.45*Math.cos(tilt),z0-0.18];POLE.p.set(pos,pn*3);POLE.c.set(sc([0.55,0.5,0.45],fv*0.6),pn*3);pn++;}
    const top=[2.25+Math.sin(tilt)*1.45,1.45*Math.cos(tilt),z0-0.18+0.28];
    drawCloth(FL[f],top,0.56,0.38,fv,()=>FLC[f],wav*1.3+0.02,t,f*1.7,0);}
  upd(POLE);
  // mur (vision partagée)
  for(let i=0;i<NW;i++){const p=[WALL.p[i*3],WALL.p[i*3+1],WALL.p[i*3+2]];WALL.c.set(see(p,[WCOL[i*3],WCOL[i*3+1],WCOL[i*3+2]]),i*3);}upd(WALL);
  // sol
  for(let i=0;i<NG;i++){const g=GP[i];const y=(g[2]-.5)*0.01;GROUND.p.set([g[0],y,g[1]],i*3);
    const dist=Math.hypot(g[0]-cam.position.x,g[1]-cam.position.z);const k=(0.26+0.14*g[2])*clamp(1.5-dist*0.09,0.25,1.15);
    const spot=0.6+0.6*Math.exp(-((g[0]-1.2)**2+(g[1])**2)/6);GROUND.c.set(see([g[0],y,g[1]],[SAND[0]*k*spot,SAND[1]*k*spot,SAND[2]*k*spot]),i*3);GROUND.z[i]=2.0;}
  upd(GROUND);
  // poussière : soulevée par le sabot (plan 1) et la charge
  for(let i=0;i<NM;i++){const d=MD[i];let x,y,z,a;
    if(i<320&&(PAW||GALLOP)){const age=((t*1.4+d[3])%1);const src=PAW?[0.45,0,-0.17]:[-0.2+BX,0,0];x=src[0]-age*(0.6+0.5*d[0])-(PAW?0:0.4);y=0.04+age*(0.35+0.25*d[1]);z=src[2]+d[2]*0.35*age;a=0.26*(1-age);}
    else{x=1.2+d[0]*5+0.15*Math.sin(t*0.3+i);y=0.3+(d[1]+1)*1.3;z=d[2]*4;a=0.04+0.05*d[3];}
    MOTE.p.set([x,y,z],i*3);MOTE.c.set([0.80*a,0.60*a,0.38*a],i*3);}
  upd(MOTE);
  camAt(t);
  bloom.strength=0.8+(t>=17.95&&t<21.25?0.25:0);
}
