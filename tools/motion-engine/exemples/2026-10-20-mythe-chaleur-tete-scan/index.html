import * as THREE from 'three';

/* ============================== utilitaires déterministes ============================== */
const W=1080,H=1920,RW=720,RH=1280,SW=270,SHh=480,LOOP=25.4;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-clamp(x),3);
const ein=x=>Math.pow(clamp(x),3);
const pulse=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const C=c=>new THREE.Color(c);
const $=id=>document.getElementById(id);
const NB='&#8239;';
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mixHex(a,b,k){const A=hex2rgb(a),B=hex2rgb(b);return 'rgb('+A.map((v,i)=>Math.round(mix(v,B[i],clamp(k)))).join(',')+')';}
// la typo « chauffe » le long de la table fer : indigo → magenta → orange → couleur finale
function heatCol(h,fin){h=clamp(h);const S=['#1C0B4A','#A0228F','#FF9A1F',fin];const x=h*3;const i=Math.min(2,Math.floor(x));return mixHex(S[i],S[i+1],x-i);}

/* ============================== rendu « champ de température » ============================== */
const r=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
r.setPixelRatio(1);r.setSize(RW,RH,false);r.domElement.id='gl';document.body.prepend(r.domElement);
const scene=new THREE.Scene();
const FOV=34;
const cam=new THREE.PerspectiveCamera(FOV,RW/RH,5,3000);scene.add(cam);
const rtT=new THREE.WebGLRenderTarget(SW,SHh,{type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:true});
const PX=(SHh/2)/Math.tan(FOV/2*Math.PI/180); // pixels capteur par unité à distance 1

const NOISE=`
float hash3(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn3(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm3(vec3 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vn3(p);p*=2.07;a*=.5;}return s;}
`;
const SH={uScanY:{value:999},uMythY:{value:999},uMythK:{value:0}};
const T_VS=`#ifdef MORPH
attribute vec3 p2;attribute vec3 n2;uniform float uMorph;
#endif
varying vec3 vN,vV,vW;
void main(){
#ifdef MORPH
 vec3 p=mix(position,p2,uMorph);vec3 n=normalize(mix(normal,n2,uMorph));
#else
 vec3 p=position;vec3 n=normal;
#endif
 vec4 wp=modelMatrix*vec4(p,1.0);vW=wp.xyz;vec4 mv=viewMatrix*wp;vN=normalize(normalMatrix*n);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`;
const T_FS=NOISE+`uniform float uTemp,uCoat,uScanY,uMythY,uMythK,uTex;varying vec3 vN,vV,vW;
void main(){
 if(uCoat>0.5&&vW.y>uScanY)discard;
 float ndv=max(dot(normalize(vN),normalize(vV)),0.0);
 float sh=mix(0.70,1.0,pow(ndv,0.6));
 float T=uTemp*sh;
 if(uCoat<0.5&&uTemp>0.6&&uTemp<0.93){T-=0.07*smoothstep(12.0,26.0,abs(vW.x))+0.10*(1.0-smoothstep(25.0,95.0,vW.y))-0.03*exp(-pow(vW.x/5.0,2.0))*step(95.0,vW.y);}
 T+=(fbm3(vW*0.075)-0.5)*0.035*uTex;
 // bord de scan : la couture du manteau chauffe un instant (le scan se lit dans le monde)
 if(uCoat>0.5&&uScanY<500.0)T+=0.42*exp(-pow((vW.y-uScanY)/2.2,2.0));
 float m=smoothstep(uMythY-4.0,uMythY+4.0,vW.y)*uMythK;
 T=mix(T,0.95*sh,m);
 gl_FragColor=vec4(T,0.0,0.0,1.0);}`;
function tMat(T,coat=0,tex=1,morph=false){
  const U={uTemp:{value:T},uCoat:{value:coat},uTex:{value:tex},uMorph:{value:0},uScanY:SH.uScanY,uMythY:SH.uMythY,uMythK:SH.uMythK};
  const m=new THREE.ShaderMaterial({uniforms:U,vertexShader:T_VS,fragmentShader:T_FS});if(morph)m.defines={MORPH:1};return m;}

/* ---------- rue (n'existe qu'en thermique) : façade, trottoir ---------- */
const bgMat=new THREE.ShaderMaterial({uniforms:{},vertexShader:`varying vec3 vW;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vW=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:NOISE+`varying vec3 vW;
 float rect(vec2 p,vec4 q,float s){return smoothstep(q.x-s,q.x+s,p.x)*smoothstep(q.z+s,q.z-s,p.x)*smoothstep(q.y-s,q.y+s,p.y)*smoothstep(q.w+s,q.w-s,p.y);}
 void main(){vec2 p=vW.xy;float T=0.205-0.035*smoothstep(0.0,420.0,p.y);
  float row=floor(p.y/7.5);float bx=p.x/22.0+0.5*mod(row,2.0);
  T+=0.016*(hash3(vec3(floor(bx),row,3.0))-0.5);
  float mort=max(smoothstep(0.1,0.0,fract(p.y/7.5)),smoothstep(0.05,0.0,fract(bx)));T-=0.010*mort;
  T+=(fbm3(vec3(p*0.02,1.0))-0.5)*0.03;
  // fenêtres chauffées (gauche), porte entrouverte (droite)
  vec4 w1=vec4(-150.0,120.0,-112.0,182.0),w2=vec4(-150.0,300.0,-112.0,362.0),w3=vec4(150.0,300.0,188.0,362.0);
  float leak=0.0;
  leak+=exp(-pow(length(max(abs(p-vec2(-131.0,151.0))-vec2(19.0,31.0),0.0))/16.0,1.2))*0.12;
  leak+=exp(-pow(length(max(abs(p-vec2(-131.0,331.0))-vec2(19.0,31.0),0.0))/16.0,1.2))*0.10;
  T+=leak;
  T=mix(T,0.66+0.05*fbm3(vec3(p*0.08,2.0)),rect(p,w1,5.0)*0.95);
  T=mix(T,0.60+0.05*fbm3(vec3(p*0.08,5.0)),rect(p,w2,5.0)*0.95);
  
  T=mix(T,0.25,rect(p,vec4(40.0,-5.0,95.0,214.0),4.0));
  T=mix(T,0.40,rect(p,vec4(40.0,-5.0,47.0,212.0),3.0));
  // trottoir enneigé (froid) : plan horizontal
  if(vW.y<0.5){T=0.115+(fbm3(vW*0.03)-0.5)*0.03+0.03*smoothstep(-450.0,-640.0,vW.z);}
  gl_FragColor=vec4(T,0.0,0.0,1.0);}`});
const fac=new THREE.Mesh(new THREE.PlaneGeometry(1400,1100),bgMat);fac.position.set(0,500,-640);scene.add(fac);
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),bgMat);gnd.rotation.x=-Math.PI/2;gnd.position.set(0,0,250);scene.add(gnd);

/* ---------- silhouette (primitives lissées par le flou thermique) ---------- */
const lathePts=a=>a.map(([x,y])=>new THREE.Vector2(x,y));
function morphLathe(A,B,seg=40){const g=new THREE.LatheGeometry(lathePts(A),seg),g2=new THREE.LatheGeometry(lathePts(B),seg);
  g.setAttribute('p2',g2.getAttribute('position').clone());g.setAttribute('n2',g2.getAttribute('normal').clone());return g;}
const COAT_A=[[0,68],[19,68.5],[20.6,78],[19.6,95],[18.4,108],[19.7,124],[21.1,134],[22.4,141],[19.6,146.2],[14.2,149.6],[9.8,151.8],[8.8,153.2]];
const COAT_B=[[0,60],[10,61],[14.2,68],[15.6,82],[15.8,98],[15.2,114],[14.2,126],[12.9,135],[11.6,141.5],[9.4,145.5],[7.2,147.8],[6.6,149.0]];
const SKIN_A=[[0,90],[15,90.5],[16,96],[15,104],[14.3,110],[16.2,124],[17.5,133],[19,140],[16.6,144.6],[11.6,147.6],[6.9,149.6],[0,151]];
const SKIN_B=COAT_B.map(([x,y],i)=>[i===0||i===COAT_B.length-1?0:x*0.86,y+2]);
const P=new THREE.Group();scene.add(P);
const parts={};
function add(name,geo,mat,ry=0){const m=new THREE.Mesh(geo,mat);P.add(m);parts[name]=m;m.userData.mat=mat;return m;}
add('torso',morphLathe(SKIN_A,SKIN_B),tMat(0.90,0,1,true));
add('coat',morphLathe(COAT_A,COAT_B),tMat(0.36,1,1.4,true));
add('head',new THREE.SphereGeometry(1,32,24),tMat(1.0,0,0.5));
add('earL',new THREE.SphereGeometry(1,12,10),tMat(0.84));add('earR',new THREE.SphereGeometry(1,12,10),tMat(0.84));
add('neck',new THREE.CylinderGeometry(5.4,5.8,14,20),tMat(0.90));
const collarG=new THREE.TorusGeometry(8.8,3.6,12,32);collarG.rotateX(Math.PI/2);
add('collar',collarG,tMat(0.38,1,1.4));
const cap=(r,l)=>new THREE.CapsuleGeometry(r,l,6,14);
const LIMB={upA:[4.7,0.87,0],foA:[3.9,0.85,0],hand:[3.3,0.70,0],slU:[7.1,0.35,1],slF:[6.3,0.34,1],thigh:[7.3,0.86,0],shin:[5.3,0.82,0],paT:[8.9,0.33,1],paS:[6.9,0.32,1],shoe:[4.6,0.20,0]};
for(const s of ['L','R'])for(const k in LIMB){const [rad,T,coat]=LIMB[k];const m=add(k+s,cap(rad,1),tMat(T,coat,coat?1.4:1));m.userData.r=rad;}
// bonnet : calotte + bord roulé + pompon
const BON=new THREE.Group();scene.add(BON);
const bonCap=new THREE.Mesh(new THREE.SphereGeometry(1,32,16,0,Math.PI*2,0,Math.PI*0.7),tMat(0.30,0,1.6));BON.add(bonCap);
const rimG=new THREE.TorusGeometry(Math.sin(Math.PI*0.7),0.17,10,40);rimG.rotateX(Math.PI/2);
const bonRim=new THREE.Mesh(rimG,tMat(0.29,0,1.6));bonRim.position.y=Math.cos(Math.PI*0.7)+0.04;BON.add(bonRim);
const bonPom=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12),tMat(0.26,0,1.6));bonPom.position.y=1.12;BON.add(bonPom);
BON.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});

const _a=new THREE.Vector3(),_b=new THREE.Vector3(),_d=new THREE.Vector3(),_up=new THREE.Vector3(0,1,0);
function limb(m,a,b,s=1){_a.set(...a);_b.set(...b);_d.subVectors(_b,_a);const len=_d.length();m.position.addVectors(_a,_b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(_up,_d.normalize());
  // capsule de longueur 1 : on étire le cylindre (pas les calottes) en reconstruisant l'échelle
  const rad=m.userData.r;const cyl=Math.max(0.01,len);m.scale.set(s,1,s);
  if(m.geometry.userData.len!==cyl){m.geometry.dispose();m.geometry=cap(rad,cyl);m.geometry.userData.len=cyl;}
  if(s!==1)m.scale.setScalar(s);}
const L2=(a,b,k)=>a.map((v,i)=>mix(v,b[i],k));
// pose adulte / bébé emmailloté (b = 0 → 1)
const HEAD_A={c:[0,163,0],r:[8.0,11.2,9.4]},HEAD_B={c:[0,160.5,0],r:[10.8,11.4,10.6]};
function pose(b,breath){
  const hc=L2(HEAD_A.c,HEAD_B.c,b),hr=L2(HEAD_A.r,HEAD_B.r,b);
  const H_=parts.head;H_.position.set(...hc);H_.scale.set(...hr);H_.rotation.set(-0.08*(1-b),0,0.05*(1-b));
  for(const [nm,sx] of [['earL',-1],['earR',1]]){const e=parts[nm];e.position.set(sx*hr[0]*0.97,hc[1]-0.8,0.6);e.scale.set(mix(1.4,1.1,b),mix(3.0,2.0,b),mix(2.2,1.6,b));}
  const nk=parts.neck;nk.position.set(0,mix(150,146,b),0);nk.scale.setScalar(mix(1,0.6,b));
  for(const nm of ['torso','coat']){const m=parts[nm];m.userData.mat.uniforms.uMorph.value=b;m.scale.set(1,1+0.004*breath,nm==='coat'?mix(0.66,0.8,b):mix(0.62,0.76,b));}
  const co=parts.collar;co.position.set(0,mix(152.6,147.6,b),0.4);co.scale.set(mix(1,0.78,b),mix(1,0.8,b),mix(0.82,0.86,b));
  const sh=0.5*breath;
  for(const [s,sx] of [['L',-1],['R',1]]){
    // bras : épaule → coude → poignet → main ; bébé : rentrés dans la coque

  const tl=$('tlab');const leftX=k2>0.5?G2.x:G1.x;tl.style.left=(leftX-14)+'px';tl.style.top=(G1.y+fr[0]*474/2+1).toFixed(1)+'px';
  tl.style.opacity=(o1*Math.max(ops[0],0)).toFixed(3);
}
function reticle(t,hs,zoomF){
  // réticule + « POINT CHAUD » sur la tête
  let o=0;if(t<6.05)o=1-lin(t,5.9,6.05);if(t>=14.9&&t<17.6)o=lin(t,14.9,15.2)*(1-lin(t,17.42,17.6));if(t>=24.8)o=lin(t,24.8,25.0);

  rp.setAttribute('d',d);rp.style.opacity=o;lab.style.opacity=(o*0.95).toFixed(3);lab.style.left=(x1+12)+'px';lab.style.top=(y0-6)+'px';}

/* ============================== temps → état du monde ============================== */
const _v=new THREE.Vector3();
function proj(v){_v.copy(v).project(cam);return {x:(_v.x+1)/2*W,y:(1-_v.y)/2*H};}
function hatState(t){ // décalage vertical du bonnet (cm au-dessus de la position portée) ; null = absent
  if(t<17.18)return null;
  if(t<17.4){const u=lin(t,17.18,17.4);return {y:150*(1-u*u),sq:1};}
  if(t<17.95){const v=lin(t,17.4,17.7);return {y:3.0*Math.sin(Math.PI*v)*(1-v),sq:1-0.08*pulse(t,17.42,0.04)};}
  if(t<18.25){return {y:160*ein(lin(t,17.95,18.25)),sq:1};}
  if(t<19.8)return null;
  if(t<20.0){const u=lin(t,19.8,20.0);return {y:130*(1-u*u),sq:1};}
  if(t<23.4){const v=lin(t,20.0,20.3);return {y:2.5*Math.sin(Math.PI*v)*(1-v),sq:1-0.07*pulse(t,20.02,0.04)};}
  if(t<24.0)return {y:170*ein(lin(t,23.4,24.0)),sq:1};
  return null;}
function sceneState(t){
  cameraAt(t);

  const brK=0; const {hc,hr}=pose(b,brK);
  // bonnet
  const hs_=hatState(t);BON.visible=!!hs_;
  if(hs_){BON.position.set(hc[0],hc[1]+0.14*hr[1]+hs_.y,hc[2]);BON.scale.set(hr[0]*1.13*(2-hs_.sq),hr[1]*1.02*hs_.sq,hr[2]*1.13*(2-hs_.sq));BON.rotation.z=hs_.y>5?0.12*Math.sin(t*7):0;}
  const br=breathState(t,hc,hr,b);
  P.updateMatrixWorld(true);
  // scan : descend 6,2 → 7,35 ; remonte 13,6 → 14,8
  let sy=999;
  if(t>=6.2&&t<13.6)sy=mix(182,-6,eio(lin(t,6.2,7.35)));
  if(t>=13.6&&t<14.85)sy=mix(-6,182,eio(lin(t,13.6,14.8)));

  // le mythe : la zone « chaude » envahit le dos (≈ 45 % de la silhouette visible)
  SH.uMythK.value=t<3.0?0:(t<6.2?sm(lin(t,3.1,3.35)):1-sm(lin(t,6.2,6.45)));
  SH.uMythY.value=t<6.2?mix(186,133,eio(lin(t,3.3,4.9))):133;
  if(t>=6.6)SH.uMythK.value=0;
  snowU.uT.value=t;
  // palette : fer → « white hot » (3,0) → fer d'un coup (6,2)
  const pal=t<3.0?0:(t<6.2?lin(t,3.0,3.2):0);postU.uPal.value=pal;
  // étalonnage (NUC) à 0,9 s : la palette se ré-étale, la tête passe au blanc saturé
  const cal=(t>=0.93&&t<24.8)?1:0;postU.uLo.value=mix(0.0,0.02,cal);postU.uHi.value=mix(1.10,0.975,cal);
  postU.uFlash.value=0.07*pulse(t,0.95,0.03)+0.05*pulse(t,8.42,0.03)+0.05*pulse(t,9.62,0.03);
  // zoom numérique par paliers sur la tête (×1,4) : gros pixels 3 images puis lissés
  const head=proj(V3(hc[0],hc[1],hc[2]));
  let zoom=1,pix=0;if(t>=8.4&&t<9.6){zoom=1.4;pix=t<8.5?1:0;}else if(t>=9.6&&t<9.7)pix=1;
  postU.uZoom.value=zoom;postU.uPix.value=pix;postU.uZC.value.set(head.x/W,1-head.y/H);
  postU.uBlur.value=1.75;
  // HUD
  const top=proj(V3(hc[0],hc[1]+hr[1],hc[2])),side=proj(V3(hc[0]+hr[0],hc[1],hc[2]));
  const zc={x:head.x,y:head.y};const Z=p=>({x:zc.x+(p.x-zc.x)*zoom,y:zc.y+(p.y-zc.y)*zoom});
  const hs={x:head.x,y:head.y,rw:Math.abs(side.x-head.x)*zoom,rh:Math.abs(top.y-head.y)*zoom};
  reticle(t,hs,zoom);hudState(t,pal,hs);
  // ligne de scan (UI) : suit la couture du manteau
  const sc=$('scan');if(sy<500){const p=Z(proj(V3(0,sy,8)));sc.style.top=(p.y-1.5).toFixed(1)+'px';
    sc.style.opacity=(clamp((1470-p.y)/60)*(t<13.6?lin(t,6.2,6.26)*(1-lin(t,7.3,7.45)):lin(t,13.6,13.66)*(1-lin(t,14.7,14.85)))).toFixed(3);}else sc.style.opacity=0;
  // signature, pastille, fin
  const big=lin(t,22.85,23.1)*(1-lin(t,24.62,24.8));
  const small=1-big;
  $('sigS').style.opacity=(0.85*small).toFixed(3);$('hdl').style.opacity=(0.9*small).toFixed(3);$('pill').style.opacity=small.toFixed(3);
  $('sigB').style.opacity=big.toFixed(3);$('hdlB').style.opacity=(big*lin(t,23.15,23.35)).toFixed(3);
  $('shine').style.backgroundPosition=`${(100-lin(t,23.1,23.9)*100).toFixed(1)}% 0`;
  const su=$('sub');const so=lin(t,23.3,23.45)*(1-lin(t,24.55,24.72));su.style.opacity=so.toFixed(3);
  su.style.transform=`translateX(-50%) scale(${(mix(0.7,1,eout(lin(t,23.3,23.5)))*(1+0.07*pulse(t,23.95,0.07))).toFixed(3)})`;
  // icône d'envoi
  const sd=$('send');const sdo=t>=21.0&&t<22.8?lin(t,21.0,21.2)*(1-lin(t,22.55,22.75)):0;sd.style.opacity=sdo.toFixed(3);
  if(sdo>0){sd.style.left='540px';sd.style.top='840px';sd.style.transform=`scale(${(1+0.16*pulse(t,21.6,0.06)).toFixed(3)})`;
    const rr=70+26*lin(t,21.6,22.0);$('sr2').setAttribute('r',rr.toFixed(1));$('sr2').setAttribute('opacity',(0.6*(1-lin(t,21.6,22.0))).toFixed(3));}
}
