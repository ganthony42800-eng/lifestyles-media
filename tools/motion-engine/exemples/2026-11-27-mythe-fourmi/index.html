import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';

const RW=720,RH=1280;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ein=x=>Math.pow(clamp(x),3);
const eback=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const springE=p=>p>=1?1:(p<=0?0:1-Math.exp(-5.2*p)*Math.cos(8.6*p));
const TAU=Math.PI*2;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];const sc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};const lerp3=(a,b,k)=>[mix(a[0],b[0],k),mix(a[1],b[1],k),mix(a[2],b[2],k)];

const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1);r.setSize(RW,RH,false);r.domElement.id='gl';document.body.prepend(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;
const S=new THREE.Scene();S.background=new THREE.Color('#030906');
const cam=new THREE.PerspectiveCamera(55,RW/RH,0.02,80);
const comp=new EffectComposer(r);comp.setPixelRatio(1);comp.setSize(RW,RH);
comp.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(RW,RH),0.8,0.55,0.14);comp.addPass(bloom);
comp.addPass(new OutputPass());

const U={uH:{value:RH}};
const VS=`uniform float uH;attribute vec3 aCol;attribute float aSz;varying vec3 vC;
 void main(){vC=aCol;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=clamp(aSz*uH*0.0050/(-mv.z),1.0,16.0);}`;
const FS=`varying vec3 vC;void main(){vec2 q=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(q));gl_FragColor=vec4(vC*a,1.0);}`;
const mat=()=>new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
function dyn(n,sz){const g=new THREE.BufferGeometry();const p=new Float32Array(n*3),c=new Float32Array(n*3),z=new Float32Array(n).fill(sz||1);
  g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('aCol',new THREE.BufferAttribute(c,3));g.setAttribute('aSz',new THREE.BufferAttribute(z,1));
  const o=new THREE.Points(g,mat());o.frustumCulled=false;S.add(o);return {g,p,c,z,o,n};}
const upd=D=>{D.g.attributes.position.needsUpdate=true;D.g.attributes.aCol.needsUpdate=true;D.g.attributes.aSz.needsUpdate=true;};


/* ép. 21 — fourmi en particules ambrées, sol de forêt de nuit. Accroche : la fourmi avance avec une feuille plus grande qu'elle →
   tampon PARFOIS ×100 → fourmi tisserande pendue sous une vitre, un cube doré de 500 mg dans les mâchoires → gros plan sur le cou :
   anneau qui passe du cyan au rouge, flèches de traction, étincelles à la rupture (×3 400-5 000) → loi carré-cube : petit cube / cube ×2
   (face 2×2 = force ×4, volume 2×2×2 = poids ×8) → nuance : une file de fourmis aux charges différentes → ép. 22. */
S.background=new THREE.Color('#07050A');
const ry=(v,a)=>[v[0]*Math.cos(a)+v[2]*Math.sin(a),v[1],-v[0]*Math.sin(a)+v[2]*Math.cos(a)];
const rz=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a),v[2]];
const rx=(v,a)=>[v[0],v[1]*Math.cos(a)-v[2]*Math.sin(a),v[1]*Math.sin(a)+v[2]*Math.cos(a)];
const LD=nrm([0.25,1.0,0.55]);
function shade(n,base){const d=Math.max(0,n[0]*LD[0]+n[1]*LD[1]+n[2]*LD[2]);const k=0.30+0.85*d;return [base[0]*k,base[1]*k,base[2]*k];}
const NOFF=[0,-99,0];

/* ---------- décor : litière de feuilles, bokeh, vitre ---------- */
const NGR=9000;const GR=dyn(NGR,3.0);const GRU=[];{const R=mulberry32(2101);for(let i=0;i<NGR;i++)GRU.push([(R()*2-1)*3.2,-3+R()*4.6,R(),R()]);}
const NBK=160;const BK=dyn(NBK,26);const BKU=[];{const R=mulberry32(2102);for(let i=0;i<NBK;i++)BKU.push([(R()*2-1)*6,R()*3.2-0.4,-3.5-R()*4,R(),R()]);}
const NGL=5200;const GL=dyn(NGL,2.0);const GLU=[];{const R=mulberry32(2103);for(let i=0;i<NGL;i++)GLU.push([(R()*2-1)*2.6,(R()*2-1)*1.8,R()]);}
const GY=1.0;

/* ---------- fourmi (géométrie partagée) ---------- */
const AR=mulberry32(2104);
const ELL=[ // [cx,cy,cz, rx,ry,rz, n, part]  part : 0 gastre,1 pétiole,2 thorax,3 tête
 [-0.31,0.16,0, 0.22,0.145,0.135, 2600,0],[-0.065,0.13,0, 0.045,0.05,0.035, 240,1],
 [0.085,0.15,0, 0.155,0.072,0.062, 1500,2],[0.33,0.18,0, 0.105,0.092,0.088, 1300,3]];
const EU=[];for(const e of ELL){for(let i=0;i<e[6];i++){const th=Math.acos(2*AR()-1),ph=AR()*TAU;EU.push([e,th,ph,AR()]);}}
const LEGS=[[0.17,0.32,0.22],[0.07,0.06,0.0],[-0.01,-0.22,-0.24]]; // [x attache, dx genou, dx pied]
const NLS=110;const LGU=[];for(let l=0;l<3;l++)for(const s of [-1,1])for(let k=0;k<2;k++)for(let i=0;i<NLS;i++)LGU.push([l,s,k,AR()]);
const NAN=90;const ANU=[];for(const s of [-1,1])for(let k=0;k<2;k++)for(let i=0;i<NAN;i++)ANU.push([s,k,AR()]);
const NMD=70;const MDU=[];for(const s of [-1,1])for(let i=0;i<NMD;i++)MDU.push([s,AR()]);
const NEYE=80;const EYEU=[];for(const s of [-1,1])for(let i=0;i<NEYE;i++)EYEU.push([s,AR()*TAU,Math.sqrt(AR())]);
const NANT=EU.length+LGU.length+ANU.length+MDU.length+EYEU.length;
const AMBER=[1.0,0.50,0.16],AMB2=[0.85,0.30,0.08];
function mkA(){return dyn(NANT,1.15);}
/* P : pos, yaw, roll (π = à l'envers), sc, ph (pas), walk (0/1), stretch (cou), glow */
function buildAnt(D,P){
  const {pos,yaw,ph,walk,glow}=P;const roll=P.roll||0;const S0=P.sc||1;const st=P.stretch||0;let n=0;
  const toW=v=>{let w=rx(v,roll);w=ry(w,yaw);return add(pos,sc(w,S0));};
  const put=(p,c,s)=>{D.p.set(toW(p),n*3);D.c.set(sc(c,glow*0.62),n*3);D.z[n]=(s||1.15)*S0;n++;};
  const hx=st; // décalage de la tête (cou étiré)
  for(const [e,th,ph2,q] of EU){const part=e[7];
    let x=Math.cos(th),y=Math.sin(th)*Math.cos(ph2),z=Math.sin(th)*Math.sin(ph2);
    const nn=nrm([x/e[3],y/e[4],z/e[5]]);
    let p=[e[0]+x*e[3]+(part===3?hx:0),e[1]+y*e[4]+(part===0?0.02*Math.sin(x*3):0),e[2]+z*e[5]];
    const base=part===0?lerp3(AMB2,AMBER,0.35+0.4*q):(part===3?lerp3(AMBER,[1.0,0.62,0.25],0.4):AMBER);
    put(p,sc(shade(nn,base),part===0?0.85:1.0),part===1?1.0:1.15);}
  // pattes (trépied alterné)
  for(const [l,s,k,u] of LGU){const L=LEGS[l];const gait=(l===1?1:0)^(s>0?1:0);const sw=walk*Math.sin(ph+(gait?Math.PI:0));
    const lift=walk*Math.max(0,Math.sin(ph+(gait?Math.PI:0)+Math.PI/2))*0.05;
    const hip=[L[0],0.10,s*0.05],knee=[L[0]+L[1]*0.55+sw*0.04,0.21+lift,s*0.22],foot=[L[0]+L[2]+sw*0.09,0.0+lift*0.6,s*0.33];
    const A=k?knee:hip,B2=k?foot:knee;const p=add(sc(A,1-u),sc(B2,u));put(p,sc(AMB2,0.9),0.95);}
  // antennes coudées
  for(const [s,k,u] of ANU){const a0=[0.38+hx,0.25,s*0.04],a1=[0.44+hx,0.37+0.02*Math.sin(ph*0.7+s),s*0.09],a2=[0.58+hx,0.33+0.03*Math.sin(ph*0.9),s*0.14];
    const A=k?a1:a0,B2=k?a2:a1;put(add(sc(A,1-u),sc(B2,u)),sc(AMBER,0.9),0.9);}
  for(const [s,u] of MDU){const m0=[0.41+hx,0.14,s*0.045],m1=[0.49+hx,0.115,s*0.008];put(add(sc(m0,1-u),sc(m1,u)),[0.9,0.4,0.12],1.0);}
  for(const [s,a,rr] of EYEU){put([0.37+hx+Math.cos(a)*rr*0.025,0.2+Math.sin(a)*rr*0.025,s*0.083],[0.05,0.03,0.02],1.0);}
  upd(D);
  return {jaw:toW([0.50+hx,0.115,0]),neckA:toW([0.235,0.16,0]),neckB:toW([0.235+hx,0.16,0]),toW,S0};
}
const AN=[mkA(),mkA(),mkA()];

/* ---------- feuilles portées ---------- */
const NLF=1500;function mkLeaf(){return dyn(NLF,1.3);}const LFU=[];{const R=mulberry32(2105);for(let i=0;i<NLF;i++)LFU.push([R()*2-1,R(),R()]);}
function buildLeaf(D,c,size,tilt,glow,t){let n=0;
  for(const [u,v,q] of LFU){const along=u;const w=Math.sqrt(Math.max(0,1-along*along))*0.42*(0.95+0.05*Math.sin(along*20));
    const side=(v*2-1);const mid=Math.abs(side)<0.06;let p=[along*size,side*w*size,0.03*size*Math.sin(along*3+t)*(1-Math.abs(side))];
    p=rz(p,tilt);p=add(c,p);const k=(mid?1.3:0.75+0.25*q)*(0.8+0.2*Math.sin(along*14+side*9));
    D.p.set(p,n*3);D.c.set(sc([0.22*k,0.78*k,0.30*k],glow*0.55),n*3);n++;}upd(D);}
const LF=[mkLeaf(),mkLeaf(),mkLeaf()];

/* ---------- cube de 500 mg ---------- */
const NCB=1600;const CUBE=dyn(NCB,1.6);const CBU=[];{const R=mulberry32(2106);for(let i=0;i<NCB;i++)CBU.push([R(),R(),R(),R()]);}
function buildCube(D,c,e,glow,t){let n=0;
  for(const [a,b,cc,q] of CBU){let p;if(q<0.55){const ax=Math.floor(q/0.55*12);const s=a;const E=[[s,0,0],[s,1,0],[s,0,1],[s,1,1],[0,s,0],[1,s,0],[0,s,1],[1,s,1],[0,0,s],[1,0,s],[0,1,s],[1,1,s]][ax];p=E;}
    else{p=[a,b,cc];const f=Math.floor((q-0.55)/0.45*6);if(f===0)p[0]=0;else if(f===1)p[0]=1;else if(f===2)p[1]=0;else if(f===3)p[1]=1;else if(f===4)p[2]=0;else p[2]=1;}
    const edge=q<0.55;const k=(edge?1.2:0.35)*(0.85+0.15*Math.sin(t*3+a*9));
    D.p.set(add(c,[(p[0]-0.5)*e,(p[1]-0.5)*e,(p[2]-0.5)*e]),n*3);D.c.set(sc([1.0*k,0.72*k,0.25*k],glow),n*3);n++;}upd(D);}

/* ---------- cou : anneau, flèches de traction, étincelles ---------- */
const NRG=420;const RING=dyn(NRG,1.6);const NAW=1200;const ARW=dyn(NAW,1.5);const NSP=500;const SPK=dyn(NSP,1.8);
const SPU=[];{const R=mulberry32(2107);for(let i=0;i<NSP;i++){const th=Math.acos(2*R()-1),ph=R()*TAU;SPU.push([Math.sin(th)*Math.cos(ph),Math.sin(th)*Math.sin(ph),Math.cos(th),0.4+R()*0.8,R()]);}}

/* ---------- loi carré-cube ---------- */
const NQ=5200;const Q1=dyn(NQ,1.4),Q2=dyn(NQ,1.4);const QU=[];{const R=mulberry32(2108);for(let i=0;i<NQ;i++)QU.push([R(),R(),R(),R()]);}
/* cube d'arête e posé au sol, centre x ; div : subdivisions (1 ou 2) ; face : allumage face avant (cyan) ; vol : remplissage (ambre) 0..1 */
function buildQ(D,x,e,div,face,vol,on,t){let n=0;const z0=0;
  for(const [a,b,c,q] of QU){let p,col;
    if(q<0.40){ // arêtes + lignes de subdivision sur les faces
      const s=a;const g=div>1?(Math.floor(b*3)/2):(Math.floor(b*2));const h=div>1?(Math.floor(c*3)/2):(Math.floor(c*2));
      const ax=Math.floor(q/0.40*3);p=ax===0?[s,g,h]:ax===1?[g,s,h]:[g,h,s];
      if(div===1&&(g===0.5||h===0.5))p=[s,0,0];
      const k=0.9;col=[0.85*k,0.88*k,0.95*k];}
    else if(q<0.62){p=[a,b,1];const k=face*(1-0.65*vol)*(0.9+0.3*Math.pow(0.5+0.5*Math.sin(t*5+a*8+b*8),3));col=[0.2*k,0.85*k,1.15*k];
      if(face<=0.001){D.p.set(NOFF,n*3);n++;continue;}}
    else{p=[a,b,c];const cell=(a<0.5?0:1)+(b<0.5?0:2)+(c<0.5?0:4);const thr=div>1?cell/8:0;const k=sm((vol-thr)*(div>1?8:1.5)/1.0)*1.0;col=[1.0*k,0.62*k,0.18*k];
      if(k<=0.001){D.p.set(NOFF,n*3);n++;continue;}}
    D.p.set(add([x,0,z0],[(p[0]-0.5)*e,p[1]*e,(p[2]-0.5)*e]),n*3);D.c.set(sc(col,on),n*3);n++;}upd(D);}

/* ---------- caméra (plans coupés, interpolation à l'intérieur de chaque plan) ---------- */
const SHOTS=[
 [0,4.4,[0.20,0.50,3.0,0.10,0.62,0],[0.26,0.48,2.75,0.12,0.60,0]],
 [4.4,9.0,[0.80,0.45,2.75,0.12,1.02,0],[0.50,0.42,2.50,0.12,1.00,0]],
 [9.0,13.4,[0.40,0.36,1.30,0.18,0.36,0],[0.32,0.34,1.12,0.18,0.35,0]],
 [13.4,18.0,[0.25,1.0,3.3,-0.04,0.50,0],[0.70,1.05,3.1,-0.04,0.48,0]],
 [18.0,21.25,[-0.2,0.62,2.7,0.0,0.50,0],[0.25,0.60,2.55,0.2,0.48,0]],
 [21.25,24.01,[0.25,0.60,2.55,0.2,0.48,0],[0.45,0.80,3.2,0.35,0.55,0]]];
function camAt(t){const s=SHOTS.find(q=>t>=q[0]&&t<q[1])||SHOTS[SHOTS.length-1];const k=sm(lin(t,s[0],s[1]))*0.85+lin(t,s[0],s[1])*0.15;
  const v=s[2].map((x,i)=>mix(x,s[3][i],k));cam.position.set(v[0],v[1],v[2]);cam.lookAt(v[3],v[4],v[5]);cam.updateMatrixWorld();}

function off(D){D.o.visible=false;}
function stateScene(t){
  const ph=t*7.0;
  for(const D of [...AN,...LF,CUBE,RING,ARW,SPK,Q1,Q2,GL])D.o.visible=false;
  let grOn=1;
  if(t<4.4){
    // accroche : la fourmi avance, une feuille plus grande qu'elle levée au-dessus de la tête
    AN[0].o.visible=true;LF[0].o.visible=true;
    const G=buildAnt(AN[0],{pos:[-0.08+t*0.03,0,0],yaw:0,ph,walk:1,glow:1});
    buildLeaf(LF[0],add(G.jaw,[-0.10,0.30,0]),0.62,0.45+0.04*Math.sin(t*2.2),1.6,t);
  } else if(t<9.0){
    // fourmi tisserande pendue sous une surface lisse, cube doré dans les mâchoires
    AN[0].o.visible=true;CUBE.o.visible=true;GL.o.visible=true;grOn=0.35;
    const sway=0.05*Math.sin((t-4.4)*1.6);
    const G=buildAnt(AN[0],{pos:[0,GY,0],yaw:sway*0.4,roll:Math.PI,ph:ph*0.3,walk:0.15,glow:1});
    const e=0.15;const drop=sm(lin(t,4.5,5.1));
    buildCube(CUBE,add(G.jaw,[0.02+sway*0.3,-e*0.5-0.005-(1-drop)*0.0,0]),e,mix(0.4,1.0,drop),t);
    for(let i=0;i<NGL;i++){const [x,z,q]=GLU[i];const k=0.035+0.09*Math.pow(0.5+0.5*Math.sin(x*4+z*3-t*1.5+q*2),8)+0.03*(Math.abs(Math.sin(x*12))<0.03?1:0);
      GL.p.set([x,GY+0.002,z],i*3);GL.c.set([k*0.55,k*0.85,k*1.1],i*3);}upd(GL);
  } else if(t<13.4){
    // gros plan sur le cou : traction croissante, anneau cyan → rouge, rupture (étincelles, sans montrer la suite)
    AN[0].o.visible=true;RING.o.visible=true;ARW.o.visible=true;SPK.o.visible=true;
    const stretch=0.028*sm(lin(t,9.8,11.4));const brk=t>=11.4?1:0;
    const G=buildAnt(AN[0],{pos:[0,0,0],yaw:0,ph:0,walk:0,stretch,glow:0.55*(brk?mix(1,0.6,sm(lin(t,11.4,12.2))):1)});
    const heat=sm(lin(t,9.8,11.4));const flash=brk*Math.exp(-(t-11.4)*3.0);
    const rc=lerp3([0.25,0.95,1.25],[1.3,0.25,0.12],heat);
    for(let i=0;i<NRG;i++){const a=i/NRG*TAU;const xx=mix(G.neckA[0],G.neckB[0],(i%7)/6);const r=0.05+0.004*Math.sin(a*6+t*9);
      const k=(0.45+0.55*Math.pow(0.5+0.5*Math.sin(a*3-t*6),2))*(1+2.5*flash)*(brk?mix(1,0.3,sm(lin(t,11.6,12.4))):1);
      RING.p.set([xx,0.16+Math.cos(a)*r,Math.sin(a)*r],i*3);RING.c.set(sc(rc,k*0.32),i*3);}upd(RING);
    const pull=sm(lin(t,9.4,10.0))*(brk?(1-sm(lin(t,11.4,11.9))):1);
    for(let i=0;i<NAW;i++){const side=i<NAW/2?-1:1;const j=i%(NAW/2);const lane=j%3;const u=((j/(NAW/2))*3+t*1.2)%1;
      const y0=0.16+(lane-1)*0.06;const x0=side<0?-0.55:0.48+stretch;const L=0.22+0.12*heat;
      let x=x0+side*u*L;let y=y0;const head=u>0.82;if(head){y+= (lane-1)*0+(Math.floor(j/3)%2?1:-1)*(u-0.82)*0.25;}
      const k=pull*(0.15+0.5*u)*0.55;ARW.p.set([x,y,0.02],i*3);ARW.c.set([k*1.2,k*0.55,k*0.2],i*3);}upd(ARW);
    for(let i=0;i<NSP;i++){const [dx,dy,dz,v,q]=SPU[i];const s=Math.max(0,t-11.4);const on=brk&&s<1.2;const d=v*s*0.32;
      const k=on?(1-s/1.2)*0.55:0;SPK.p.set(on?[G.neckA[0]+0.01+dx*d,0.16+dy*d-0.15*s*s,dz*d]:NOFF,i*3);SPK.c.set([k*1.3,k*0.7,k*0.25],i*3);}upd(SPK);
  } else if(t<18.0){
    // loi carré-cube : petit cube (arête 1) / grand cube (arête 2)
    Q1.o.visible=true;Q2.o.visible=true;grOn=0.8;
    const on1=sm(lin(t,13.45,13.9)),grow=eio(lin(t,14.0,14.8));
    const face=sm(lin(t,14.6,15.1)),vol=lin(t,15.2,16.4);
    buildQ(Q1,-0.62,0.32,1,face,sm(lin(t,15.2,15.6)),on1,t);
    buildQ(Q2,0.38,mix(0.32,0.64,grow),grow>0.5?2:1,face,vol,on1,t);
  } else {
    // nuance : une file de fourmis, des charges très différentes
    grOn=1;const fade=t<21.25?1:mix(1,0.6,sm(lin(t,21.25,22.0)));
    const conf=[[-1.05,0.20,0.30,0.0],[-0.15,0.42,0.45,1.7],[0.75,0.62,0.62,3.1]];
    conf.forEach(([x0,lsz,lh,p0],i)=>{AN[i].o.visible=true;LF[i].o.visible=true;
      const G=buildAnt(AN[i],{pos:[x0+(t-18)*0.10,0,-0.15*i],yaw:0,ph:ph+p0,walk:1,sc:0.62,glow:fade});
      buildLeaf(LF[i],add(G.jaw,[-0.04,lh*0.5,0]),lsz,0.45+0.05*Math.sin(t*2+i),fade*1.3,t+i);});
  }
  // sol de litière + bokeh
  for(let i=0;i<NGR;i++){const [x,z,q,w]=GRU[i];const leaf=w<0.18;const k=(leaf?0.10:0.055)*(0.6+0.4*q)*grOn;
    GR.p.set([x,-0.004-0.01*q,z],i*3);GR.c.set(leaf?[k*0.45,k*0.75,k*0.25]:[k*0.9,k*0.55,k*0.30],i*3);}upd(GR);
  for(let i=0;i<NBK;i++){const [x,y,z,q,w]=BKU[i];const k=0.020*(0.5+0.5*Math.sin(t*0.6+q*20))*(w<0.5?1:0.7);
    BK.p.set([x+0.1*Math.sin(t*0.2+q*5),y,z],i*3);BK.c.set(w<0.5?[k*1.0,k*0.6,k*0.2]:[k*0.4,k*0.9,k*0.4],i*3);}upd(BK);
  camAt(t);
  bloom.strength=(t>=9.0&&t<13.4)?0.95:0.8;
}

const TX=document.getElementById('texts');
B.forEach(b=>{const d=document.createElement('div');d.className='blk';d.style.top=b.y+'px';b.el=d;b.lines=[];
  b.L.forEach(([cls,css,html])=>{const ln=document.createElement('div');ln.className='ln '+cls;ln.style.cssText=css;ln.innerHTML=html;d.appendChild(ln);b.lines.push(ln);});TX.appendChild(d);});
const $=id=>document.getElementById(id);
const ENT=0.28,EXT=0.24;
function styleText(t){
  for(const b of B){const el=b.el;let a=b.a,z=b.z;
    if(t<a-0.02||t>z+0.02){el.style.opacity=0;continue;}
    el.style.opacity=1;
    b.lines.forEach((L,li)=>{let op=1,sx=1,sy=1,rot=0;const la=a+li*(b.stg||0.08);
      if((a>0)&&!b.stamp&&!b.btn){if(t<la){op=0;}else if(t<la+ENT+0.3){const p=lin(t,la,la+ENT);const e=springE(p);sy=mix(1.45,1,e);sx=mix(0.94,1,e);op=lin(p,0,0.3);}}
      if(b.stamp===1){const k=lin(t,a,a+0.16);sx=sy=mix(1.3,1.0,eback(k));op=lin(t,a,a+0.04);rot=-6;}
      if(b.btn){const k=lin(t,a,a+0.32);sx=sy=mix(0.6,1.0,eback(k))*(1+0.035*Math.sin(Math.max(0,t-a-0.5)*6.0));op=lin(t,a,a+0.06);}
      if(t>z-EXT){const p=lin(t,z-EXT,z);op*=1-p;sy*=mix(1,0.6,ein(p));sx*=mix(1,1.04,p);}
      L.style.opacity=op.toFixed(3);L.style.transform=`rotate(${rot}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;});}
  const so=(id,a,z)=>{$(id).style.opacity=(lin(t,a,a+0.2)*(1-lin(t,z-0.24,z))).toFixed(3);};
  so('srcA',5.0,9.0);so('srcB',9.4,13.4);so('srcC',13.8,18.0);so('srcD',18.4,21.15);
  $('pillW').style.opacity=(t<2.55?(1-lin(t,2.35,2.55)):lin(t,23.9,24.0)).toFixed(3);
  $('sim').style.opacity=(0.95*(1-lin(t,21.0,21.25)+lin(t,23.9,24.0))).toFixed(3);
  {const g=eio(lin(t,21.25,21.8))*(1-eio(lin(t,23.55,23.9)));const w=238+262*g,h=w*379/1160;const top=1473.6-h;
   for(const e of [$('sig'),$('sigShine')]){e.style.width=w.toFixed(1)+'px';e.style.left=(930-w).toFixed(1)+'px';e.style.top=top.toFixed(1)+'px';}$('sigShine').style.height=h.toFixed(1)+'px';
   $('sigShine').style.opacity=g.toFixed(3);$('sigShine').style.backgroundPosition=`${(100-lin(t,21.8,22.6)*100).toFixed(1)}% 0`;
   $('at').style.opacity=(lin(t,21.85,22.1)*(1-lin(t,23.4,23.65))).toFixed(3);$('at').style.top=(top-64)+'px';}
}
