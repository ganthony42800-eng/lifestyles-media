const RW=720,RH=1280,LOOP=24.0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- bocal (sphère de verre en points, plus dense au bord) + eau + gravier ---------- */

{const R=mulberry32(11);const P=[],C=[],Z=[];
 for(let i=0;i<9000;i++){let x,y,z,l;do{x=R()*2-1;y=R()*2-1;z=R()*2-1;l=Math.hypot(x,y,z)}while(l>1||l<1e-3);x/=l;y/=l;z/=l;

   const rim=Math.pow(1-Math.abs(z),3);if(R()>0.25+0.75*rim)continue;const k=0.5+0.5*R();
   P.push(x*BR,y*BR,z*BR);C.push(0.10*k+0.10*rim,0.24*k+0.18*rim,0.34*k+0.22*rim);Z.push(1.0+R()*0.8);}

 // gravier au fond

   P.push(Math.cos(a)*rr,y,Math.sin(a)*rr);C.push(...(k<0.33?[0.30,0.22,0.10]:k<0.66?[0.10,0.18,0.30]:[0.22,0.22,0.24]));Z.push(1.6+R()*1.4);}
 stat(P,C,Z);}

const MAZE=dyn(2400,1.4);
{const R=mulberry32(21);for(let i=0;i<2400;i++){const w=i<1200;const y=w?mix(-0.50,0.15,R()):mix(-0.15,0.50,R());const x=(w?-0.25:0.25)+(R()-.5)*0.018;MAZE.p.set([x,y,-0.06+(R()-.5)*0.04],i*3);}}

 // yeux : anneau doré + reflet blanc
 for(const s of[-1,1]){for(let i=0;i<220;i++){const a=R()*TAU,rr=0.020+0.010*R();FB.push([0.16+Math.cos(a)*rr,0.035+Math.sin(a)*rr,s*0.078,0.9,0.7,0.3,1.3,3]);}
  for(let i=0;i<40;i++){const a=R()*TAU,rr=Math.sqrt(R())*0.007;FB.push([0.168+Math.cos(a)*rr,0.042+Math.sin(a)*rr,s*0.082,1.0,1.0,1.0,1.8,3]);}}}
const FISH=dyn(FB.length,1);FB.forEach((f,i)=>{FISH.c.set([f[3],f[4],f[5]],i*3);FISH.z[i]=f[6];});FISH.g.attributes.aCol.needsUpdate=true;FISH.g.attributes.aSz.needsUpdate=true;

/* ---------- trajectoire ---------- */
const RED=[-0.32,-0.17,0.30];
function base(t){const w=0.95;return [0.30*Math.sin(w*t+0.6),0.10*Math.sin(1.3*t)+0.02,0.22*Math.cos(w*t+0.6)];}
function maze(t){const u=lin(t,12.7,14.9);const x=mix(-0.52,0.52,eio(u));return [x,0.30*Math.cos(Math.PI*(x+0.25)/0.5),0.05];}
function wP(t){return sm(lin(t,8.7,9.7))*(1-sm(lin(t,11.7,12.4)));}
function wM(t){return sm(lin(t,12.2,12.9))*(1-sm(lin(t,15.0,15.8)));}
function path(t){const b=base(t),m=maze(t),p=wP(t),q=wM(t);const k=1-p-q;
  const wig=0.015*Math.sin(t*9);
  return [b[0]*k+(RED[0]+0.12)*p+m[0]*q, b[1]*k+(RED[1]+0.03+wig)*p+m[1]*q, b[2]*k+RED[2]*p+m[2]*q];}

/* ---------- traînée = mémoire ---------- */
const NTR=3400;const TR=dyn(NTR,2.1);
function memLen(t){
  let L=1.1;                                         // « 3 s » : traînée courte
  L=mix(L,13.0,eio(lin(t,4.5,8.2)));                 // semaines, mois, années
  L=mix(L,2.2,eio(lin(t,8.4,9.2)));                  // palettes
  L=mix(L,2.6,eio(lin(t,12.6,14.9)));                // labyrinthe : on voit le parcours
  L=mix(L,14.0,eio(lin(t,15.2,17.2)));               // des milliers d'études
  L=mix(L,1.6,eio(lin(t,17.9,18.8)));                // petit bocal
  L=mix(L,1.1,eio(lin(t,23.0,24.0)));

/* ---------- poussière ---------- */
{const n=700,a=new Float32Array(n*3);const Rd=mulberry32(3);for(let i=0;i<n;i++){a.set([(Rd()-.5)*14,(Rd()-.5)*20,-2.5-Rd()*9],i*3);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));

const KEYS=[[0,0.00,0.08,3.05,0.00],[2.6,0.05,0.10,3.1,0.0],[4.4,-0.15,0.18,3.35,0.0],[8.4,0.10,0.22,3.45,0.0],[11.0,-0.10,0.12,3.2,-0.02],[12.4,0.0,0.04,3.3,0.0],

  for(let i=0;i<2400;i++){const R=mulberry32(i+9);const k=(0.45+0.4*R())*mz;MAZE.c.set([0.25*k,0.75*k,0.95*k],i*3);}MAZE.g.attributes.aCol.needsUpdate=true;
  // palettes
  const pd=sm(lin(t,8.5,9.0))*(1-sm(lin(t,12.0,12.5)));

    PAD.p.set([b[0],b[1],b[2]],i*3);PAD.c.set(b[3]?[1.0*e*pd*0.9*pulse,0.22*e*pd*0.9*pulse,0.16*e*pd*0.9*pulse]:[0.22*e*pd*0.9,0.42*e*pd*0.9,1.0*e*pd*0.9],i*3);});
  PAD.g.attributes.position.needsUpdate=true;PAD.g.attributes.aCol.needsUpdate=true;

  for(let i=0;i<120;i++){const R=mulberry32(i+300);const age=t-10.3-R()*0.4;const on=age>0&&age<1.8&&pd>0.01;
    FOOD.p.set([RED[0]+0.10+(R()-.5)*0.18,RED[1]+0.45-age*0.22+0.02*Math.sin(age*5+i),RED[2]+(R()-.5)*0.15],i*3);
    const a=on?(1-age/1.8)*0.8:0;FOOD.c.set([1.0*a,0.75*a,0.35*a],i*3);}
  FOOD.g.attributes.position.needsUpdate=true;FOOD.g.attributes.aCol.needsUpdate=true;
  // bulles
  BS.forEach((b,i)=>{const yy=-0.55+((t*0.18*b[3]+b[2])%1.0)*(WL+0.53);const xx=b[0]*Math.sqrt(Math.max(0,1-(yy*yy)/(BR*BR)))+0.01*Math.sin(t*3+b[4]);

  BUB.g.attributes.position.needsUpdate=true;BUB.g.attributes.aCol.needsUpdate=true;
  U.uDim.value=1-0.25*sm(lin(t,17.9,18.4))*(1-sm(lin(t,21.0,21.4)));
  const ly=-0.02+ty;
  cam.position.set(Math.sin(th)*Math.cos(el)*R0,ly+0.30+Math.sin(el)*R0,Math.cos(th)*Math.cos(el)*R0);cam.lookAt(0,ly+0.30,0);cam.updateMatrixWorld();
  bloom.strength=0.85+0.6*flash+0.35*Math.exp(-Math.pow((t-2.62)/0.12,2));
}
