  spider.rotation.y=0.18*Math.sin(t*TAU/LOOP);
  spider.visible=!(t>=17.95&&t<18.45&&Math.sin(t*90)<0.2);
  const agit=sm(lin(t,8.6,9.0))*(1-sm(lin(t,12.0,12.3)))*0.6+jump*1.5;
  const curl=0.55*sm(lin(t,10.7,10.9))*(1-sm(lin(t,12.0,12.6)));
  updateLegs(t,agit,curl);
  // fil : de l'abdomen jusqu'au-dessus du cadre
  const top=spider.position.y+0.50*SC+0.40*SC;for(let k=0;k<NT;k++){const u=k/NT;tp.set([spider.position.x*(1-u)+0.004*Math.sin(u*40+t),top+u*7,0],k*3);}thrGeo.attributes.position.needsUpdate=true;
  // vibrations du dormeur
  WU.uHeart.value=sm(lin(t,8.7,9.1))*(1-sm(lin(t,14.8,15.3)));
  WU.uBreath.value=sm(lin(t,9.4,9.8))*(1-sm(lin(t,14.8,15.3)));
  WU.uSnore.value=sm(lin(t,10.1,10.4))*(1-sm(lin(t,12.2,12.8)));
  // vibration « ambiante » douce au début (le monde = vibrations)
  WU.uHeart.value+=0.0;WU.uBreath.value+=0.55*sm(lin(t,4.6,5.2))*(1-sm(lin(t,8.2,8.6)));
  WU.uGlitch.value=sm(lin(t,17.9,18.3))*(1-sm(lin(t,20.9,21.3)));
  WU.uDim.value=1-0.35*WU.uGlitch.value;
  const ly=0.36+0.08*Math.min(Y,1.0); // la caméra suit en partie l'araignée
  cam.position.set(Math.sin(th)*Math.cos(el)*R0,ly+ty+Math.sin(el)*R0,Math.cos(th)*Math.cos(el)*R0);cam.lookAt(0,ly+ty,0);cam.updateMatrixWorld();
  bloom.strength=0.9+0.5*jump;
}
