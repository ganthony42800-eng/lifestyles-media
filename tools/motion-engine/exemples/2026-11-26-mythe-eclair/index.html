  [17.95,0.25,0.5,4.6,0,0.52,0],[21.2,0,0.6,5.0,0,0.62,0],[24.0,0.30,0.50,4.4,0,0.58,0]];
const CUTS=[0,15.25,17.95,99];
function herm(t,col){let c=0;while(t>=CUTS[c+1])c++;const K=KEYS.filter(k=>k[0]>=CUTS[c]&&k[0]<=CUTS[c+1]).filter((k,i,a)=>!(i===a.length-1&&k[0]===CUTS[c+1]&&a.length>2&&a[i-1][0]!==k[0]&&false));
  // garder les clés du plan courant : la dernière clé au temps de coupe appartient au plan qui se termine
  const KK=[];for(const k of KEYS){if(k[0]<CUTS[c]||k[0]>CUTS[c+1])continue;KK.push(k);}
  // si deux clés au même temps de coupe (début), garder celle qui ouvre le plan
  let L=KK;if(c>0){const i=KEYS.findIndex(k=>k[0]===CUTS[c]);const j=KEYS.length-1-[...KEYS].reverse().findIndex(k=>k[0]===CUTS[c]);L=KEYS.slice(j).filter(k=>k[0]<=CUTS[c+1]);}
  if(c<CUTS.length-2){const end=KEYS.findIndex(k=>k[0]===CUTS[c+1]);L=L.filter(k=>KEYS.indexOf(k)<=end);}
  let i=0;while(i<L.length-2&&t>L[i+1][0])i++;
  const t0=L[i][0],t1=L[i+1][0],p0=L[i][col],p1=L[i+1][col];const sl=(a,b)=>(L[b][col]-L[a][col])/(L[b][0]-L[a][0]);
  const m0=i>0?0.5*(sl(i-1,i)+sl(i,i+1)):0,m1=i+2<L.length?0.5*(sl(i,i+1)+sl(i+1,i+2)):0;
  const h=t1-t0,s=clamp((t-t0)/h),s2=s*s,s3=s2*s;return (2*s3-3*s2+1)*p0+(s3-2*s2+s)*h*m0+(-2*s3+3*s2)*p1+(s3-s2)*h*m1;}

let FLASH=0;
function light(arr,D,amb,fl,near,warm){for(let i=0;i<arr.length;i++){const a=arr[i];let k=amb;let cr=a[3],cg=a[4],cb=a[5];
    const em=(a[6]===2||(warm&&a[6]===2))?1:0;
    const f=fl*(near?near(a):1);
    D.c[i*3]=cr*(em?1:k)+f*0.55*(0.6+cr);D.c[i*3+1]=cg*(em?1:k)+f*0.62*(0.6+cg);D.c[i*3+2]=cb*(em?1:k)+f*0.85*(0.6+cb);}
  D.g.attributes.aCol.needsUpdate=true;}
function stateScene(t){
  // éclairs actifs
  let fl=0,n=0;const tipGlow=[0,0];
  for(const s of STR){fl+=flashE(s,t)*s.g;const I=boltI(s,t);if(I<=0)continue;
    for(const p of s.pts){if(n>=NB)break;const j=mulberry32(n+Math.floor(t*30)*7)();const w=p[3]*I;
      BOLT.p.set([p[0]+(j-.5)*0.006,p[1],p[2]],n*3);BOLT.c.set([0.75*w,0.85*w,1.0*w],n*3);BOLT.z[n]=p[3]>0.5?2.2:1.4;n++;}
    if(s.tg===TIP)tipGlow[0]=Math.max(tipGlow[0],I);if(s.tg===TREE)tipGlow[1]=Math.max(tipGlow[1],I);}
  for(let i=n;i<NB;i++){BOLT.c.set([0,0,0],i*3);}
  BOLT.g.attributes.position.needsUpdate=true;BOLT.g.attributes.aCol.needsUpdate=true;BOLT.g.attributes.aSz.needsUpdate=true;
  FLASH=Math.min(1.0,fl*0.8);
  const amb=0.55+0.15*Math.sin(t*0.7);
  light(TW,TOWER,amb,FLASH*0.9,a=>a[6]===3?1+2.5*tipGlow[0]:1);
  light(CT,CITY,amb,FLASH*0.6);
  light(GR,GROUND,amb,FLASH*0.7,a=>1+1.5*tipGlow[1]*Math.exp(-((a[0]-TREE[0])**2+(a[2]-TREE[2])**2)/0.5));
  light(TR,TREEO,amb*1.2,FLASH*0.9,a=>1+1.8*tipGlow[1]);
  light(HS,HOUSEO,amb*1.2,FLASH*0.8);
  // fenêtre de la maison : chaleur qui respire pendant « rentre »
  // nuages éclairés de l'intérieur près du départ de l'éclair
  const act=STR.filter(s=>flashE(s,t)>0);
  for(let i=0;i<CL.length;i++){const c=CL[i];let e=0;for(const s of act){const p=s.pts[0];const d2=(c[0]-p[0])**2+(c[2]-p[2])**2;e+=flashE(s,t)*s.g*Math.exp(-d2/1.6)*1.6;}
    const k=0.06+0.05*c[3]+e+FLASH*0.12;CLOUD.c.set([0.30*k,0.32*k,0.55*k],i*3);}
  CLOUD.g.attributes.aCol.needsUpdate=true;
  // pluie
  const rain=0.55+0.45*sm(lin(t,15.2,15.8))*(1-sm(lin(t,17.6,18.2)));
  for(let i=0;i<NR;i++){const d=RD[i];const y=2.3-((d[1]+t*1.9*d[3])%1)*3.9;
    for(let k=0;k<RDROP;k++){const idx=(i*RDROP+k)*3;RAIN.p.set([d[0]+0.012*k,y+0.035*k,d[2]],idx);const a=(0.10+FLASH*0.25)*rain*(1-k*0.25);RAIN.c.set([0.45*a,0.55*a,0.75*a],idx);}}
  RAIN.g.attributes.position.needsUpdate=true;RAIN.g.attributes.aCol.needsUpdate=true;
  // zone de danger sous l'arbre (anneau corail qui pulse)
  const dz=sm(lin(t,13.3,13.8))*(1-sm(lin(t,14.9,15.2)));
  for(let k=0;k<NDZ;k++){const R=mulberry32(k+9000);const a=R()*TAU;const ring=(k%3);const rr=0.18+ring*0.14+0.03*Math.sin(t*4-ring);
    const x=TREE_BASE[0]+Math.cos(a)*rr,z=TREE_BASE[2]+Math.sin(a)*rr;DZ.p.set([x,GY+hill(x,z)+0.01,z],k*3);const al=dz*(0.7-ring*0.18)*(0.7+0.3*R());DZ.c.set([1.0*al,0.38*al,0.30*al],k*3);}
  DZ.g.attributes.position.needsUpdate=true;DZ.g.attributes.aCol.needsUpdate=true;
  // fenêtre chaude plus intense pendant « rentre à l'intérieur »
  const home=sm(lin(t,15.5,16.2))*(1-sm(lin(t,17.6,18.0)));
  if(home>0){for(let i=0;i<HS.length;i++)if(HS[i][6]===2){HOUSEO.c[i*3]*=1+home*1.2;HOUSEO.c[i*3+1]*=1+home*1.0;}HOUSEO.g.attributes.aCol.needsUpdate=true;}
  // caméra (secousse légère aux grands impacts)
  const sh=0.012*FLASH;const R=mulberry32(Math.floor(t*30)+5);
  cam.position.set(herm(t,1)+(R()-.5)*sh,herm(t,2)+(R()-.5)*sh,herm(t,3));cam.lookAt(herm(t,4),herm(t,5),herm(t,6));cam.updateMatrixWorld();
  bloom.strength=0.85+0.6*Math.min(1,FLASH);
}
