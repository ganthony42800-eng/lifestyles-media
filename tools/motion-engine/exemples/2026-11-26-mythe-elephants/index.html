/* ép. 15 — taureau en particules dans une arène de nuit : il gratte le sol face à la muleta rouge (MYTHE) → vue partagée

   3 drapeaux immobiles = rien, agités = charge ; pourquoi rouge : tradition, masque le sang. */
const RW=720,RH=1280;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};

const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1);r.setSize(RW,RH,false);r.domElement.id='gl';document.body.prepend(r.domElement);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;
const S=new THREE.Scene();S.background=new THREE.Color('#06070D');
const cam=new THREE.PerspectiveCamera(55,RW/RH,0.02,80);
const comp=new EffectComposer(r);comp.setPixelRatio(1);comp.setSize(RW,RH);
comp.addPass(new RenderPass(S,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(RW,RH),0.8,0.55,0.14);comp.addPass(bloom);
comp.addPass(new OutputPass());

const U={uH:{value:RH}};
const VS=`uniform float uH;attribute vec3 aCol;attribute float aSz;varying vec3 vC;
 void main(){vC=aCol;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=clamp(aSz*uH*0.0050/(-mv.z),1.0,16.0);}`;
const FS=`varying vec3 vC;void main(){vec2 q=gl_PointCoord-0.5;float a=smoothstep(0.5,0.0,length(q));gl_FragColor=vec4(vC*a,1.0);}`;
const mat=()=>new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
function dyn(n,sz){const g=new THREE.BufferGeometry();const p=new Float32Array(n*3),c=new Float32Array(n*3),z=new Float32Array(n).fill(sz||1);
  g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('aCol',new THREE.BufferAttribute(c,3));g.setAttribute('aSz',new THREE.BufferAttribute(z,1));
  const o=new THREE.Points(g,mat());o.frustumCulled=false;S.add(o);return {g,p,c,z,o,n};}
const upd=D=>{D.g.attributes.position.needsUpdate=true;D.g.attributes.aCol.needsUpdate=true;D.g.attributes.aSz.needsUpdate=true;};

/* ép. 16 — éléphant en particules dans la savane au crépuscule, souris lumineuse à ses pieds (MYTHE) → test télé 2006 : souris
   présentées, éléphant qui s'ennuie → ce qui file d'un coup près des pieds le fait sursauter → souris dans la trompe ? il souffle
   (la souris roule dans l'herbe, indemne) → la nuance : pas la souris, la surprise → ép. 17 chameaux. */
const LD=nrm([-0.35,0.8,0.5]);
const RIM=nrm([0.75,0.3,-0.6]);
function shade(n,base,rimK){const d=Math.max(0,n[0]*LD[0]+n[1]*LD[1]+n[2]*LD[2]);const rm=Math.pow(Math.max(0,n[0]*RIM[0]+n[1]*RIM[1]+n[2]*RIM[2]),2)*(rimK||1);
  return [base[0]*(0.34+0.85*d)+rm*0.70,base[1]*(0.34+0.85*d)+rm*0.42,base[2]*(0.34+0.85*d)+rm*0.26];}

/* ---------- décor : sol, herbes, acacia, ciel ---------- */
const NG=16000;const GROUND=dyn(NG,1.1);const GP=[];{const R=mulberry32(1616);for(let i=0;i<NG;i++){GP.push([(R()*2-1)*9+1,(R()*2-1)*7-1.5,R()]);}}
const NGR=5000;const GRASS=dyn(NGR,1.0);const GRP=[];{const R=mulberry32(77);for(let i=0;i<NGR;i++){GRP.push([(R()*2-1)*9+1,(R()*2-1)*7-1.5,0.05+0.22*R()**2,R()*TAU]);}}
const NST=1400;const STAR=dyn(NST,1.6);{const R=mulberry32(5);for(let i=0;i<NST;i++){const a=(R()*0.9-0.45)*Math.PI,h=0.12+R()*0.9;
  const rr=22;STAR.p.set([Math.cos(a)*rr*-1+2,1+h*rr*0.7,Math.sin(a)*rr-10],i*3);const k=0.05+0.5*R()**6;STAR.c.set([k*0.9,k*0.92,k],i*3);}upd(STAR);}
const NAC=3200;const ACA=dyn(NAC,1.5);{const R=mulberry32(31);let n=0;const X=-5.5,Z=-6.5;
  for(;n<700;n++){const u=R();ACA.p.set([X+0.08*(R()-.5),u*2.6,Z+0.08*(R()-.5)],n*3);ACA.c.set([0.05,0.04,0.035],n*3);}
  for(;n<NAC;n++){const a=R()*TAU,rr=2.4*Math.sqrt(R());ACA.p.set([X+Math.cos(a)*rr,2.6+0.35*(R()-.5)+0.15*Math.cos(a*3),Z+Math.sin(a)*rr*0.6],n*3);const k=0.04+0.05*R();ACA.c.set([k*0.6,k*0.75,k*0.45],n*3);}
  upd(ACA);}
const NM=500;const MOTE=dyn(NM,1.3);const MD=[];{const R=mulberry32(55);for(let i=0;i<NM;i++)MD.push([R()*2-1,R()*2-1,R()*2-1,R()]);}
const NHZ=2600;const HAZE=dyn(NHZ,3.2);{const R=mulberry32(9);for(let i=0;i<NHZ;i++){const x=(R()*2-1)*16,z=-9-R()*4;HAZE.p.set([x,R()*1.2,z],i*3);const k=0.03+0.03*R();HAZE.c.set([k*1.5,k*0.75,k*0.5],i*3);}upd(HAZE);}

/* ---------- éléphant ---------- */
const OR=mulberry32(1616);
const SPH=n=>{const a=[];for(let i=0;i<n;i++){const th=Math.acos(2*OR()-1),ph=OR()*TAU;a.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph),OR()]);}return a;};
const NBO=11000,NHE=3000,NEA=3600,NTR=2600,NTU=500,NLG=4400,NTL=260,NEY=40;
const ELE=dyn(NBO+NHE+NEA+NTR+NTU+NLG+NTL+NEY,1.25);
const BOU=SPH(NBO),HEU=SPH(NHE);
const EAU=[];for(let i=0;i<NEA;i++)EAU.push([i%2,Math.sqrt(OR()),OR()*TAU,OR()]);
const TRU=[];for(let i=0;i<NTR;i++)TRU.push([OR(),OR()*TAU]);
const TUU=[];for(let i=0;i<NTU;i++)TUU.push([i%2,OR(),OR()*TAU]);
const LGU=[];for(let i=0;i<NLG;i++)LGU.push([i%4,OR(),OR()*TAU]);
const TLU=[];for(let i=0;i<NTL;i++)TLU.push([OR(),OR()*TAU]);
const GRY=[0.40,0.39,0.42];
let EX=0,TRUNK=0,EARS=0,REAR=0,STEP=0,IDLE=0,BLOW=0;
function bez(P0,P1,P2,P3,u){const v=1-u;return [0,1,2].map(i=>v*v*v*P0[i]+3*v*v*u*P1[i]+3*v*u*u*P2[i]+u*u*u*P3[i]);}
function trunkPts(t){// TRUNK 0 = pendante, 1 = relevée (sursaut / souffle)
  const sw=0.05*Math.sin(t*1.3)*IDLE;
  const P0=[1.78,2.02,0],P1=lerp3([2.05,1.55,0],[2.25,2.35,0],TRUNK),P2=lerp3([2.02,0.75,sw],[2.75,2.65,0],TRUNK),P3=lerp3([2.10+sw,0.22,sw*2],[3.0,3.05,0],TRUNK);
  return [P0,P1,P2,P3];}
function trunkTip(t){const P=trunkPts(t);const r=bez(...P,1);return [r[0]+EX,r[1]+REAR*0.25,r[2]];}
function buildEle(t){let n=0;const rr=REAR;
  const lift=(p)=>{// cabré léger : rotation autour des pattes arrière
    const px=p[0]+0.75,py=p[1];const a=rr*0.10;return [px*Math.cos(a)-py*Math.sin(a)-0.75+EX,px*Math.sin(a)+py*Math.cos(a),p[2]];};
  const put=(p,c,s)=>{ELE.p.set(lift(p),n*3);ELE.c.set(c,n*3);ELE.z[n]=s||1.25;n++;};
  const breath=1+0.012*Math.sin(t*1.6);
  const BC=[0,1.78,0];
  for(const [x,y,z,q] of BOU){const yy=y+0.12*Math.max(0,-x)*Math.max(0,y);put([BC[0]+x*1.18,BC[1]+yy*0.86*breath,BC[2]+z*0.78*breath],shade([x,y,z],GRY,1.5),1.4);}
  const H=[1.30,2.20,0];
  for(const [x,y,z,q] of HEU){put([H[0]+x*0.55,H[1]+y*0.60,H[2]+z*0.50],shade([x,y,z],GRY,1.5),1.3);}
  // oreilles (disques qui battent / s'écartent au sursaut)
  for(const [side,ru,a,q] of EAU){const sz=side?1:-1;const flap=0.25+0.9*EARS+0.12*Math.sin(t*1.7+side)*IDLE;
    const lx=-Math.cos(a)*0.62*ru*0.85,ly=Math.sin(a)*0.70*ru;const ang=flap;
    const p=[1.10+lx*Math.cos(ang),2.25+ly,sz*(0.42+(-lx)*Math.sin(ang)*1.0)];
    const edge=ru>0.93;put(p,shade(nrm([-0.3,0.2,sz]),edge?[0.55,0.47,0.46]:[0.46,0.40,0.43],1.2),1.2);}
  // trompe
  const P=trunkPts(t);
  for(const [u,a] of TRU){const b=bez(...P,u);const b2=bez(...P,Math.min(1,u+0.01));const tg=nrm([b2[0]-b[0],b2[1]-b[1],b2[2]-b[2]]);
    const sd=nrm([-tg[1],tg[0],0]);const r0=mix(0.21,0.07,u);const nv=add(sc(sd,Math.cos(a)),[0,0,Math.sin(a)]);
    const ring=0.85+0.15*Math.sin(u*90);put(add(b,sc(nv,r0)),shade(nv,sc(GRY,ring),1.3),1.15);}
  // défenses
  for(const [side,u,a] of TUU){const sz=side?1:-1;const b=bez([1.62,1.78,0.20*sz],[1.95,1.45,0.28*sz],[2.20,1.45,0.30*sz],[2.30,1.70,0.24*sz],u*0.9);
    const r0=mix(0.05,0.012,u);put(add(b,[Math.cos(a)*r0,Math.sin(a)*r0,Math.sin(a+1)*r0]),shade(nrm([Math.cos(a),Math.sin(a),0.3]),[0.95,0.90,0.78],0.7),0.95);}
  // œil (petit point clair)
  for(let i=0;i<NEY;i++){const s=i%2?1:-1;put([1.62,2.30,0.36*s+(i%7)*0.003],[0.55,0.45,0.30],1.4);}
  // pattes (colonnes) ; STEP = recul d'un pas au sursaut
  for(const [k,u,a] of LGU){const front=k<2,side=k%2?1:-1;const hx=front?0.72:-0.72;const hz=0.42*side;
    let fx=hx;let fy=0;if(front&&STEP>0){const ph=STEP;fx=hx-0.35*ph;fy=0.18*Math.sin(Math.min(1,ph)*Math.PI)*(side>0?1:0);}
    const top=[hx,1.45,hz],bot=[fx,fy,hz];const p=lerp3(top,bot,u);const r0=mix(0.27,0.23,u)+(u>0.94?0.03:0);
    put(add(p,[Math.cos(a)*r0,0,Math.sin(a)*r0]),shade(nrm([Math.cos(a),0,Math.sin(a)]),u>0.95?[0.30,0.29,0.30]:GRY,1.6),1.3);}
  // queue
  for(const [u,a] of TLU){const sw=0.08*Math.sin(t*1.8+u*2);const p=[-1.15-0.08*u,2.05-0.95*u,sw*u];const r0=u>0.88?0.05:0.018;put(add(p,[Math.cos(a)*r0,0,Math.sin(a)*r0]),shade([0,0,1],GRY,1.2),1.0);}
  upd(ELE);}

/* ---------- souris ---------- */
const NMO=900;const MOU=dyn(NMO,1.05);const MU=[];{const R=mulberry32(3);for(let i=0;i<NMO;i++){const th=Math.acos(2*R()-1),ph=R()*TAU;MU.push([Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph),R(),i]);}}
const MCOL=[1.0,0.78,0.52];
let MP=[1.75,0,0.95],MDIR=0,MROLL=0,MVIS=1,MRUN=0;
function buildMouse(t){let n=0;const s=1.0;const ca=Math.cos(MDIR),sa=Math.sin(MDIR);
  const rot=(p)=>{// MDIR : cap ; MROLL : culbute
    let [x,y,z]=p;const cr=Math.cos(MROLL),sr=Math.sin(MROLL);const y2=y*cr-x*sr,x2=x*cr+y*sr;x=x2;y=y2;
    return [MP[0]+x*ca-z*sa,MP[1]+y,MP[2]+x*sa+z*ca];};
  const bob=MRUN?0.012*Math.abs(Math.sin(t*40)):0.006*Math.abs(Math.sin(t*6));
  for(const [x,y,z,q,i] of MU){let p,c;const k=i%9;
    if(k<5){p=[x*0.10,0.06+bob+y*0.055,z*0.058];c=shade([x,y,z],MCOL,0.8);}           // corps
    else if(k<7){p=[0.11+x*0.045,0.075+bob+y*0.04,z*0.04];c=shade([x,y,z],MCOL,0.8);}  // tête
    else if(k===7){const sd=i%2?1:-1;p=[0.095+x*0.006,0.125+bob+y*0.022,sd*0.03+z*0.022];c=[1.0,0.62,0.62];} // oreilles
    else{const u=q;p=[-0.10-0.16*u,0.04+0.03*Math.sin(u*5+t*5),0.04*Math.sin(u*4+t*3)];c=[0.95,0.6,0.5];}       // queue
    MOU.p.set(rot(p),n*3);MOU.c.set(sc(c,MVIS*1.15),n*3);n++;}
  upd(MOU);}

const NPL=500;const PLAT=dyn(NPL,1.1);const PLU=[];{const R=mulberry32(12);for(let i=0;i<NPL;i++)PLU.push([R()*TAU,Math.sqrt(R()),R()]);}

const SHOTS=[
 [0,4.45,[3.2,1.05,4.2,1.5,0.9,0.4],[3.0,1.10,3.7,1.4,1.0,0.3]],
 [4.45,8.45,[4.6,2.6,4.6,1.4,2.15,0],[4.2,2.5,4.2,1.4,2.2,0]],

function camAt(t){let s=SHOTS.find(q=>t>=q[0]&&t<q[1])||SHOTS[SHOTS.length-1];const k=sm(lin(t,s[0],s[1]))*0.85+lin(t,s[0],s[1])*0.15;
  const v=s[2].map((x,i)=>mix(x,s[3][i],k));cam.position.set(v[0],v[1],v[2]);cam.lookAt(v[3],v[4],v[5]);cam.updateMatrixWorld();}

function stateScene(t){
  IDLE=1;EX=0;TRUNK=0;EARS=0;REAR=0;STEP=0;BLOW=0;MVIS=1;MRUN=0;MROLL=0;
  // plan 1 : souris qui grignote près de la patte avant
  if(t<4.45){MP=[1.65,0,0.95];MDIR=Math.PI*0.85;}
  // plan 2 : souris présentée sur un plateau devant la trompe ; l'éléphant reste calme
  else if(t<8.45){MP=[2.55,1.55,0.15];MDIR=Math.PI;TRUNK=0.08*sm(lin(t,6.0,7.0));}
  // plan 3 : une souris file d'un coup sous ses pieds → sursaut
  else if(t<13.45){const k=lin(t,9.3,10.0);MRUN=k>0&&k<1?1:0;MDIR=-Math.PI/2;MP=[1.55,0,mix(3.2,-3.6,k)];MVIS=(k<=0||k>=1)?0:1;
    const st=sm(lin(t,9.75,10.15))*(1-sm(lin(t,11.6,12.8)));TRUNK=st;EARS=st;REAR=st;STEP=sm(lin(t,9.75,10.3))*(1-sm(lin(t,11.8,12.9)));}
  // plan 4 : souris au bout de la trompe → souffle, elle roule dans l'herbe (indemne)
  else if(t<17.95){TRUNK=0;const tip=trunkTip(t);const b=lin(t,15.0,15.9);BLOW=(t>=15.0&&t<16.4)?1:0;
    if(t<15.0){MP=[tip[0]+0.22,0,tip[2]+0.05];MDIR=Math.PI;}
    else{const k=sm(lin(t,15.0,15.9));MP=[tip[0]+0.22+0.9*k,0.55*Math.sin(Math.PI*lin(t,15.0,15.9)),tip[2]+0.05+0.25*k];MROLL=-TAU*1.5*sm(lin(t,15.0,15.9));MDIR=Math.PI;
      if(t>16.6){MDIR=Math.PI*0.2;MP=[MP[0]+0.15*sm(lin(t,16.6,17.9)),0,MP[2]+0.3*sm(lin(t,16.6,17.9))];}}}
  // plan 5-6 : calme, la souris passe tranquillement à côté
  else{MDIR=0;MP=[mix(-0.4,1.8,lin(t,17.95,24)),0,1.25];EARS=0.1;}
  buildEle(t);buildMouse(t);
  // plateau
  {const v=(t>=4.45&&t<8.45)?1:0;for(let i=0;i<NPL;i++){const [a,ru,q]=PLU[i];const p=[2.55+Math.cos(a)*ru*0.22,1.53-q*0.02,0.15+Math.sin(a)*ru*0.22];
    PLAT.p.set(i<420?p:[2.55+0.02*Math.cos(a),1.53-ru*1.53,0.15+0.02*Math.sin(a)],i*3);PLAT.c.set(sc([0.42,0.36,0.32],v*0.8),i*3);}upd(PLAT);}
  // souffle
  {const tip=trunkTip(t);for(let i=0;i<NAIR;i++){const [q,dy,dz]=AU[i];let a=0,p=[0,-9,0];
    if(BLOW){const age=((t-15.0)*1.8+q)%1;p=[tip[0]+0.05+age*1.8,tip[1]-0.05+age*(0.35*dy)+age*0.15,tip[2]+age*0.45*dz];a=0.7*(1-age)*(1-lin(t,16.0,16.4));}
    AIR.p.set(p,i*3);AIR.c.set([0.55*a,0.80*a,1.0*a],i*3);}upd(AIR);}
  // sol + herbes
  for(let i=0;i<NG;i++){const g=GP[i];const dist=Math.hypot(g[0]-cam.position.x,g[1]-cam.position.z);const k=(0.20+0.12*g[2])*clamp(1.6-dist*0.10,0.18,1.2);
    GROUND.p.set([g[0],(g[2]-.5)*0.01,g[1]],i*3);GROUND.c.set([0.62*k,0.44*k,0.28*k],i*3);GROUND.z[i]=2.0;}upd(GROUND);
  for(let i=0;i<NGR;i++){const [x,z,h,a]=GRP[i];const sway=0.03*Math.sin(t*1.2+x*0.7+a);const dist=Math.hypot(x-cam.position.x,z-cam.position.z);const k=0.16*clamp(1.6-dist*0.10,0.2,1.2);
    GRASS.p.set([x+sway,h,z],i*3);GRASS.c.set([0.70*k,0.58*k,0.30*k],i*3);}upd(GRASS);
  // poussière en suspension
  for(let i=0;i<NM;i++){const d=MD[i];let x,y,z,a;
    if(i<200&&STEP>0.05&&STEP<0.95){const age=((t*1.5+d[3])%1);x=0.5+d[0]*0.6;y=0.03+age*0.4;z=d[2]*0.8;a=0.22*(1-age);}
    else{x=1+d[0]*6+0.15*Math.sin(t*0.3+i);y=0.3+(d[1]+1)*1.6;z=d[2]*4;a=0.035+0.05*d[3];}
    MOTE.p.set([x,y,z],i*3);MOTE.c.set([0.85*a,0.62*a,0.40*a],i*3);}upd(MOTE);
  camAt(t);
  bloom.strength=0.75;
}
