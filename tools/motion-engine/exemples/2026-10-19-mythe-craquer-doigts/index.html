/* ============================== utilitaires déterministes ============================== */
const W=1080,H=1920,RW=720,RH=1280;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const mix=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-clamp(x),3);
const ein=x=>Math.pow(clamp(x),3);
const pulse=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
const win=(t,a,b,fa=.2,fb=.2)=>clamp((t-a)/fa)*clamp((b-t)/fb);
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const C=c=>new THREE.Color(c);
const T_CRACK=1.5, T_RECALL=21.2;

/* ============================== rendu ============================== */
const r=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
r.setPixelRatio(1); r.setSize(RW,RH,false); r.domElement.id='gl'; document.body.prepend(r.domElement);
r.toneMapping=THREE.NeutralToneMapping; r.toneMappingExposure=1.0;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,RW/RH,0.05,400); scene.add(cam);
{const pm=new THREE.PMREMGenerator(r);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.35;}

const NOISE=`
float hash3(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn3(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm3(vec3 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vn3(p);p*=2.07;a*=.5;}return s;}
`;

/* ---------- fond : négatoscope (boîte lumineuse de radiologue) ---------- */
const bgU={c0:{value:C('#2A1E6E')},c1:{value:C('#120C38')},c2:{value:C('#07061A')},uK:{value:1},uCold:{value:0},uCx:{value:0.5},uCy:{value:0.529}};
const bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:bgU,depthWrite:false,depthTest:false,
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.9999,1.0);}`,
 fragmentShader:`varying vec2 vUv;uniform vec3 c0,c1,c2;uniform float uK,uCold,uCx,uCy;
 void main(){vec2 d=(vUv-vec2(uCx,uCy))*vec2(1.0,1.55);float r=length(d);
  vec3 c=mix(c0,c1,smoothstep(0.0,0.42,r));c=mix(c,c2,smoothstep(0.38,1.05,r));
  float tubes=exp(-pow((vUv.x-0.27)/0.09,2.0))+exp(-pow((vUv.x-0.73)/0.09,2.0));c*=1.0+0.10*tubes*(1.0-smoothstep(0.2,1.0,r));
  vec3 cold=mix(vec3(0.02,0.05,0.13),vec3(0.004,0.008,0.03),smoothstep(0.0,1.0,r));c=mix(c,cold,uCold);
  gl_FragColor=vec4(c*uK,1.0);}`}));
bg.frustumCulled=false;bg.renderOrder=-100;scene.add(bg);

/* ---------- doigt radio ---------- */
const lathe=(pts,seg=40)=>new THREE.LatheGeometry(pts.map(([x,y])=>new THREE.Vector2(x,y)),seg);
const P_META=[[0,-6.5],[0.33,-6.49],[0.55,-6.38],[0.6,-6.12],[0.5,-5.6],[0.4,-4.8],[0.36,-3.6],[0.37,-2.4],[0.42,-1.55],[0.52,-1.02],[0.6,-0.62],[0.62,-0.36],[0.58,-0.16],[0.46,-0.05],[0.26,0.0],[0,0.01]];
const P_PROX=[[0,0.1],[0.3,0.05],[0.5,0.0],[0.61,0.05],[0.62,0.28],[0.5,0.7],[0.4,1.3],[0.36,2.4],[0.38,3.4],[0.44,3.9],[0.47,4.15],[0.42,4.33],[0.25,4.4],[0,4.41]];
const P_MID=[[0,0.06],[0.3,0.02],[0.45,0.0],[0.46,0.2],[0.36,0.6],[0.3,1.3],[0.32,2.0],[0.37,2.35],[0.33,2.52],[0.18,2.6],[0,2.61]];
const P_DIST=[[0,0.05],[0.28,0.0],[0.36,0.05],[0.33,0.35],[0.24,0.9],[0.2,1.4],[0.28,1.65],[0.3,1.78],[0.2,1.88],[0,1.9]];
const P_SKIN=[[0,-6.7],[0.9,-6.62],[1.12,-6.3],[1.12,-4.0],[1.08,-1.6],[1.02,-0.6],[0.98,0.1],[0.9,0.7],[0.8,1.5],[0.76,3.2],[0.8,4.2],[0.82,4.6],[0.76,5.2],[0.7,6.4],[0.69,7.25],[0.66,7.9],[0.62,8.7],[0.5,9.25],[0.28,9.55],[0,9.62]];
const G={meta:lathe(P_META),prox:lathe(P_PROX),mid:lathe(P_MID),dist:lathe(P_DIST),skin:lathe(P_SKIN,48),
  cap:new THREE.SphereGeometry(0.66,32,10,0,Math.PI*2,0,0.95),capU:new THREE.SphereGeometry(0.64,32,10,0,Math.PI*2,Math.PI-0.9,0.9),
  cav:new THREE.SphereGeometry(1,32,20)};
const FILL_Y0=-6.7,FILL_LEN=16.3;
const BONE_VS=`uniform mat4 uRootInv;varying vec3 vN,vV,vL;
 void main(){vec4 wp=modelMatrix*vec4(position,1.0);vL=(uRootInv*wp).xyz;vN=normalize(mat3(modelMatrix)*normal);vV=normalize(cameraPosition-wp.xyz);gl_Position=projectionMatrix*viewMatrix*wp;}`;
const FILL_FS=`uniform vec3 uFillCol;uniform float uFill,uFillOn;
 vec3 fillAdd(float y,float f,float k){float lev=${FILL_Y0.toFixed(2)}+uFill*${FILL_LEN.toFixed(2)};float inF=(1.0-smoothstep(lev-0.04,lev+0.04,y))*step(${FILL_Y0.toFixed(2)}+0.001,lev);
  float men=exp(-pow((y-lev)/0.09,2.0))*step(0.002,uFill);return (uFillCol*(0.30+0.9*f)*inF*k+vec3(1.0,1.0,1.0)*men*0.9*k)*uFillOn;}`;
function boneMat(U){return new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
 vertexShader:BONE_VS,
 fragmentShader:NOISE+FILL_FS+`varying vec3 vN,vV,vL;uniform float uA,uAmber;
 void main(){float f=1.0-abs(dot(normalize(vN),normalize(vV)));float a=0.05+pow(f,2.2)*0.42;
  float n=fbm3(vL*vec3(9.0,2.2,9.0));a*=0.7+0.6*n;
  vec3 c=mix(vec3(0.62,0.76,1.0),vec3(0.30,0.85,1.0),pow(f,3.0))*a;
  c=mix(c,c*vec3(1.4,1.0,0.55),uAmber*0.6);
  c+=fillAdd(vL.y,f,0.55);
  gl_FragColor=vec4(c*uA,1.0);}`});}
function skinMat(U){return new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.FrontSide,
 vertexShader:`uniform float uGap,uPipA,uDipA,uSwell;varying vec3 vN,vV;varying float vY;
 vec3 rx(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,p.y*c-p.z*s,p.y*s+p.z*c);}
 void main(){vec3 p=position;vec3 n=normal;vY=p.y;
  float sw=uSwell*(0.09*exp(-pow(p.y/0.8,2.0))+0.08*exp(-pow((p.y-4.56)/0.6,2.0))+0.05*exp(-pow((p.y-7.24)/0.5,2.0)));p.xz*=1.0+sw;
  p.y+=(uGap-0.12)*smoothstep(-0.5,0.5,p.y);
  float py=uGap+4.44,dy=uGap+7.115;
  float w2=smoothstep(dy-0.3,dy+0.3,p.y),w1=smoothstep(py-0.35,py+0.35,p.y);
  vec3 q=p-vec3(0,dy,0);q=rx(q,uDipA*w2)+vec3(0,dy,0);q=q-vec3(0,py,0);q=rx(q,uPipA*w1)+vec3(0,py,0);
  n=rx(rx(n,uDipA*w2),uPipA*w1);
  vec4 wp=modelMatrix*vec4(q,1.0);vN=normalize(mat3(modelMatrix)*n);vV=normalize(cameraPosition-wp.xyz);gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:FILL_FS+`varying vec3 vN,vV;varying float vY;uniform float uA,uAmber;
 void main(){float f=1.0-abs(dot(normalize(vN),normalize(vV)));
  vec3 col=mix(vec3(0.42,0.36,1.0),vec3(1.0,0.66,0.22),uAmber);
  vec3 c=col*(0.018+pow(f,2.4)*0.30*(1.0+0.25*uAmber));
  c+=fillAdd(vY,f,0.5);
  gl_FragColor=vec4(c*uA,1.0);}`});}
function capMat(U){return new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
 vertexShader:BONE_VS,fragmentShader:`varying vec3 vN,vV,vL;uniform float uA,uCapK;void main(){float f=1.0-abs(dot(normalize(vN),normalize(vV)));
  gl_FragColor=vec4(vec3(0.30,0.95,0.85)*(0.10+0.8*pow(f,2.0))*uA*uCapK,1.0);}`});}
const cavU={uOpen:{value:0},uA:{value:1}};
const cavMat=new THREE.ShaderMaterial({uniforms:cavU,transparent:true,depthWrite:false,depthTest:false,
 vertexShader:`varying vec3 vN,vV;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vN=normalize(mat3(modelMatrix)*normal);vV=normalize(cameraPosition-wp.xyz);gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:`varying vec3 vN,vV;uniform float uOpen,uA;void main(){float f=1.0-abs(dot(normalize(vN),normalize(vV)));
  vec3 core=vec3(0.006,0.004,0.02);vec3 rim=vec3(0.75,0.6,1.0)*2.4;float k=pow(f,3.0);
  gl_FragColor=vec4(mix(core,rim,k),clamp(uOpen,0.0,1.0)*mix(0.94,1.0,k)*uA);}`});

function makeFinger(opt={}){
  const U={uRootInv:{value:new THREE.Matrix4()},uA:{value:1},uAmber:{value:0},uFill:{value:0},uFillOn:{value:0},uFillCol:{value:C('#9682FF')},uCapK:{value:1}};
  const SU={uRootInv:U.uRootInv,uA:{value:1},uAmber:U.uAmber,uFill:U.uFill,uFillOn:U.uFillOn,uFillCol:U.uFillCol,uGap:{value:0.12},uPipA:{value:0},uDipA:{value:0},uSwell:{value:0}};
  const root=new THREE.Group();scene.add(root);
  const bm=boneMat(U),sk=skinMat(SU),cm=capMat(U);
  const meta=new THREE.Mesh(G.meta,bm);root.add(meta);
  const capL=new THREE.Mesh(G.cap,cm);capL.position.y=-0.66+0.02;root.add(capL);
  const proxG=new THREE.Group();root.add(proxG);
  proxG.add(new THREE.Mesh(G.prox,bm));
  const capH=new THREE.Mesh(G.capU,cm);capH.position.y=0.64-0.0;capH.scale.set(0.98,0.5,0.98);proxG.add(capH);
  const pipG=new THREE.Group();pipG.position.y=4.44;proxG.add(pipG);
  const mid=new THREE.Mesh(G.mid,bm);mid.position.y=0.04;pipG.add(mid);
  const dipG=new THREE.Group();dipG.position.y=0.04+2.6+0.035;pipG.add(dipG);
  const dist=new THREE.Mesh(G.dist,bm);dist.position.y=0.035;dipG.add(dist);
  const skin=new THREE.Mesh(G.skin,sk);skin.renderOrder=1;root.add(skin);
  let cav=null;if(opt.cavity){cav=new THREE.Mesh(G.cav,cavMat);cav.renderOrder=5;root.add(cav);}
  for(const m of [meta,capL,skin])m.renderOrder=m.renderOrder||0;
  const F={root,proxG,pipG,dipG,U,SU,cav,
    set(s){const g=s.gap??0.12;proxG.position.y=g;SU.uGap.value=g;pipG.rotation.x=s.pip||0;dipG.rotation.x=s.dip||0;SU.uPipA.value=s.pip||0;SU.uDipA.value=s.dip||0;
      SU.uSwell.value=s.swell||0;U.uAmber.value=s.amber||0;U.uA.value=(s.a??1)*(opt.k||1);SU.uA.value=(s.sa??s.a??1)*(opt.k||1);
      U.uFill.value=s.fill||0;U.uFillOn.value=(s.fill||0)>0.0005?1:0;U.uCapK.value=s.cap??1;
      if(cav){const o=s.open||0;cav.visible=o>0.003;cav.position.y=g*0.5;cav.scale.set(0.5*(0.4+0.6*o),Math.max(0.001,(g*0.5+0.05)*o),0.5*(0.4+0.6*o));cavU.uOpen.value=clamp(o*1.4);}
      root.updateMatrixWorld(true);U.uRootInv.value.copy(root.matrixWorld).invert();}};
  return F;}
const FA=makeFinger({cavity:true});
const FB=makeFinger();FB.U.uFillCol.value=C('#5EF2E0');

function hermK(K,t,idx){const n=K.length;let i=0;while(i<n-2&&t>K[i+1][0])i++;const a=K[i],b=K[i+1];const dt=b[0]-a[0];const u=clamp((t-a[0])/dt);

  const tan=(k,j)=>{if(k===0||k===n-1)return 0;const h0=K[k][0]-K[k-1][0],h1=K[k+1][0]-K[k][0];const d0=(val(k,j)-val(k-1,j))/h0,d1=(val(k+1,j)-val(k,j))/h1;
    if(d0*d1<=0)return 0;const w1=2*h1+h0,w2=h1+2*h0;return (w1+w2)/(w1/d0+w2/d1);};
  const dim=Array.isArray(a[idx])?3:1;const out=[];

const _v=new THREE.Vector3();

function fingerState(t){

  if(t>22.3&&t<22.75){pip=1.15-0.5*Math.sin(Math.PI*lin(t,22.3,22.6))*(t<22.6?1:0);}
