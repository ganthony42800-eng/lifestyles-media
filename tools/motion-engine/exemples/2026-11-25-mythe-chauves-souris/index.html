{const R=mulberry32(1212);

}

   const rim=Math.pow(1-Math.abs(z/l),2);const rr=0.075;FR.push([c[0]+x/l*rr,c[1]+y/l*rr*1.15,c[2]+z/l*rr,0.9*(0.5+0.6*rim),0.42*(0.5+0.6*rim),0.10,j]);}

{const n=900,a=new Float32Array(n*3);const Rd=mulberry32(3);for(let i=0;i<n;i++){a.set([(Rd()-.5)*12,(Rd()-.5)*18,-1.5-Rd()*8],i*3);}

const KEYS=[[0,0.00,0.04,3.0,0.12],[2.6,0.03,0.05,2.85,0.13],[4.4,-0.05,0.04,1.35,0.15],[6.6,0.06,0.03,0.95,0.15],[8.4,0.10,0.06,2.7,0.02],[11.0,-0.10,0.08,2.6,0.0],

  const t0=K[i][0],t1=K[i+1][0],p0=K[i][col],p1=K[i+1][col];const sl=(a,b)=>(K[b][col]-K[a][col])/(K[b][0]-K[a][0]);
